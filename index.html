                    ${hxLn('', hxV(`${em} ${pn}`))}

                    ${w === null ? '' : hxLn('', hxWkHtml(w))}</div>
                  <div class="hl-end">${notes}${del}</div>
                </div>`;
            });
            items += `<li class="${e.cls.trim()}"${e.st} data-k="g${g.plantName}"><div class="hl-item hg-exp${open ? ' hg-open' : ''}" data-g="${gi}">
              <div class="hg-head">

            // One harvest: the plant row / card is the harvest itself
            const it = g.items[0], id = escHtml(String(it.id)), e = enter('e' + it.id), w = hxWeeks(it);
            const notes = hxNotesBtn((it.notes || []).length, `openHistoryNotesModal('${id}', this)`);

            items += `<li class="${e.cls.trim()}"${e.st} data-hid="${id}" data-k="e${id}"><div class="hl-item hr-row can-del">
              <span class="hl-av" aria-hidden="true">${g.emoji}</span>

                ${hxLn('', `Plantat ${hxV(hnShortDate(it.plantDate))}`)}

    // ===== Calendari: simplified 30-day-month view of history (planted / harvested) =====
    // Every month is normalized to 30 days, bucketed into 10 three-day tiles per band. Intensity per bucket is the
    // sum of quantities, weighted by how recent the year is (this/last year = 1, fading to a 0.1 floor at 6+ years
    // back), then scaled to the peak bucket within the *current filter* (so a single modest plant still shows
    // contrast once searched for). Filter changes only morph existing tiles' colours (CSS transition); switching
    // into the tab rebuilds the cards and replays the Resum-style staggered rise-in.
    const MONTHS_FULL = ['Gener', 'Febrer', 'Març', 'Abril', 'Maig', 'Juny', 'Juliol', 'Agost', 'Setembre', 'Octubre', 'Novembre', 'Desembre'];
    let calBuilt = false, calTileEls = null;
    // Millors mesos (item 31): which view is active, and that view's own card-body elements (parallel to calTileEls).
    let calViewMode = 'heatmap', calBestCardEls = null;
    // Millors mesos can show unit plantings ('planter', default) or llavors; Visió general and the month dialog never include llavors
    let calSrc = 'planter';
    const calIsLl = () => calViewMode === 'best' && calSrc === 'llavors';
    const calBase = () => calIsLl() ? (appData.history || []).filter(isLl) : histUnits();

    function calWeight(year) {
      const yb = new Date().getFullYear() - year;
      if (yb <= 1) return 1;
      if (yb === 2) return 0.7;
      if (yb === 3) return 0.5;
      if (yb === 4) return 0.35;
      if (yb === 5) return 0.25;
      return 0.1; // floor: old history never fully disappears
    }
    function calDateBucket(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      if (!m) return null;
      const day = Math.min(30, Math.max(1, +m[3])); // normalized 30-day month
      return { year: +m[1], month: +m[2] - 1, bucket: Math.min(9, Math.floor((day - 1) / 3)) };
    }
    function calCatsPaint() { catChipsPaint('cal-cats', 'cal-cat-row', catAvail(calBase().map(h => catOf(h.plantName))), calCats, 'cal'); }
    function calFilteredHistory() {

    // ===== Plant drill-down + insight card (item 26c, refined 26e) =====
    // With exactly one category chip active, a second chip row lists only the plants in it that actually have
    // history (Calendari aggregates history — a catalogue plant with nothing planted/harvested yet has nothing to
    // show here, so it's left out rather than offered as a dead end). Picking one (or typing a name that resolves
    // uniquely) is "selecting a plant": the grid filters to it as usual, and an insight card appears above the
    // grid with its planted/harvested month ranges and its best-success planting window.
    const calNamesWithHistory = () => new Set(calBase().map(h => nmTrim(h.plantName)));
    function calPlantsAvail() {
      if (calCats.size !== 1) return [];
      const catId = [...calCats][0], withHistory = calNamesWithHistory();
      return (appData.plants || [])
        .filter(p => withHistory.has(p.name) && (catId === 'none' ? !catOfPlant(p) : catOfPlant(p) === catId))
        .map(p => p.name)
        .sort((a, b) => a.localeCompare(b, 'ca'));
    }
    // Resolves the current search text to a single plant that has history (passing the active category filter),
    // whether that text is a unique substring match or an exact name picked out among several substring matches.
    function calActivePlant() {
      const q = normTxt(document.getElementById('calendar-search').value);
      if (!q) return null;
      const withHistory = calNamesWithHistory();
      const cands = (appData.plants || []).filter(p => withHistory.has(p.name) && normTxt(p.name).includes(q) && catPass(calCats, catOfPlant(p)));
      if (cands.length === 1) return cands[0];
      const exact = cands.filter(p => normTxt(p.name) === q);
      return exact.length === 1 ? exact[0] : null;
    }
    // Picking a chip sets the search text (reusing the existing filter) but deliberately leaves focus on the chip
    // itself — moving focus into the search field would yank the cursor away from what the user just tapped.
    function calPlantToggle(name) {

    function calPlantsPaint() {

      if (!avail.length) { row.innerHTML = ''; row.dataset.sig = ''; return; }
      const sig = avail.join('|');
      if (row.dataset.sig !== sig) {
        const had = row.contains(document.activeElement) ? document.activeElement.dataset.plant : null, left = row.scrollLeft;
        row.innerHTML = '';

          b.innerHTML = `<span class="fc-emoji" aria-hidden="true">${catEmoji(name)}</span>${escHtml(name)}`;
          b.onclick = () => calPlantToggle(name);
          row.appendChild(b);
        });
        row.dataset.sig = sig; row.scrollLeft = left;
        if (had) { const b = row.querySelector(`[data-plant="${CSS.escape(had)}"]`); if (b) b.focus({ preventScroll: true }); }
      }

      csUpdate(row.closest('.cs'));
    }
    // Distinct months (0–11) a set of entries touch, folded into contiguous ranges ("Març–Maig i Setembre").
    function calRangeLabel(monthSet) {
      if (!monthSet.size) return '';
      const months = [...monthSet].sort((a, b) => a - b);
      const runs = []; let start = months[0], prev = months[0];
      for (let i = 1; i <= months.length; i++) {
        const m = months[i];
        if (m === prev + 1) { prev = m; continue; }
        runs.push([start, prev]);
        if (i < months.length) { start = m; prev = m; }
      }
      return runs.map(([a, b]) => a === b ? MONTHS_FULL[a] : `${MONTHS_FULL[a]}–${MONTHS_FULL[b]}`).join(' i ');
    }
    // Best contiguous run of planting months by average success rate (harvestQty/plantQty, all years pooled).
    // Scans every sub-range of each unbroken run of data-bearing months and keeps the highest average, breaking
    // ties toward the longer (then earlier) range — with only one month of data, that single month wins outright.
    function calBestWindow(monthAvgs) {
      let best = null, i = 0;
      while (i < 12) {
        if (monthAvgs[i] === null) { i++; continue; }
        let j = i; while (j < 12 && monthAvgs[j] !== null) j++;
        for (let a = i; a < j; a++) {
          for (let b = a; b < j; b++) {
            const vals = monthAvgs.slice(a, b + 1), avg = vals.reduce((s, v) => s + v, 0) / vals.length, len = b - a + 1;
            if (!best || avg > best.avg + 0.001 || (Math.abs(avg - best.avg) < 0.001 && len > best.len)) best = { start: a, end: b, avg, len };
          }
        }
        i = j;
      }
      return best;
    }
    function calInsightRender() {
      const box = document.getElementById('cal-insight');
      // Heatmap-only (item 31): Millors mesos already shows each plant's best-month figures on the cards
      // themselves, so the drill-down card would be redundant there.
      if (calViewMode === 'best') { box.hidden = true; return; }
      const plant = calActivePlant();
      if (!plant) { box.hidden = true; return; }
      const hist = histUnits().filter(it => it.plantName === plant.name);
      const plantedSet = new Set(), harvestedSet = new Set(), succByMonth = Array.from({ length: 12 }, () => []);
      hist.forEach(it => {
        const pb = calDateBucket(it.plantDate);
        if (pb) {
          plantedSet.add(pb.month);
          const p = parseFloat(it.plantQty) || 0, h = parseFloat(it.harvestQty) || 0;
          if (p > 0) succByMonth[pb.month].push(Math.round((h / p) * 100));
        }
        const hb = calDateBucket(it.harvestDate);
        if (hb) harvestedSet.add(hb.month);
      });
      const monthAvgs = succByMonth.map(a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null);
      const best = calBestWindow(monthAvgs);
      document.getElementById('ci-emoji').textContent = plant.emoji || catEmoji(plant.name);
      document.getElementById('ci-name').textContent = plant.name;
      document.getElementById('ci-planted').textContent = `Plantat ${calRangeLabel(plantedSet) || 'sense dades'}`;

    // For each plant, every month it's ever been planted in gets a score = (3-yr avg plantQty for plantings made

    function calBestMonthsCompute() {

      return Object.entries(byName).map(([name, entries]) => {
        const recent = entries.filter(e => e.year >= curYear - 2);
        const avgQty = recent.length ? recent.reduce((s, e) => s + (parseFloat(e.it.plantQty) || 0), 0) / recent.length : null;
        const succVals = entries.map(e => {
          const p = parseFloat(e.it.plantQty) || 0, h = parseFloat(e.it.harvestQty) || 0;
          return p > 0 ? Math.round((h / p) * 100) : null;
        }).filter(v => v !== null);
        const succ = succVals.length ? Math.round(succVals.reduce((a, c) => a + c, 0) / succVals.length) : null;
        return { name, avgQty, succ, emoji: catEmoji(name) };
      }).sort((a, b) => (b.avgQty || 0) - (a.avgQty || 0));
    }

        else if (k[0] === 'p') { if (!Array.isArray(appData.plants)) appData.plants = []; const i = appData.plants.findIndex(p => p.name === name); if (i >= 0) appData.plants[i] = v; else appData.plants.push(v); }
        else if (k[0] === 's') { if (!appData.cellSides) appData.cellSides = {}; appData.cellSides[name] = v; }
        else if (k[0] === 'h') { if (!Array.isArray(appData.history)) appData.history = []; const i = appData.history.findIndex(h => String(h.id) === name); if (i >= 0) appData.history[i] = v; else appData.history.push(v); }
        else if (k[0] === 'x') appData[name] = v;
      }
      function removeLocal(k) {
        const name = k.slice(2);
        if (k[0] === 'p') appData.plants = (appData.plants || []).filter(p => p.name !== name);
        else if (k[0] === 's') delete (appData.cellSides || {})[name];
        else if (k[0] === 'h') appData.history = (appData.history || []).filter(h => String(h.id) !== name);
        else if (k[0] === 'x') delete appData[name];
      }

      // ---- Push local changes (diff against what was last sent) ----
      function push() {
        const sent = new Set();
        if (!adapter || !st.code) return sent;
        if (ensureIds()) persistLocal();
        const cur = recMap(), ops = [];
        cur.forEach((j, k) => { const h = hash(j); if (st.base[k] !== h) ops.push({ k, v: j, d: false, h }); });
        Object.keys(st.base).forEach(k => { if (!cur.has(k)) ops.push({ k, v: null, d: true }); });
        if (!ops.length) return sent;
        ops.forEach(o => { sent.add(o.k); if (o.d) delete st.base[o.k]; else st.base[o.k] = o.h; });
        saveSt();
        for (let i = 0; i < ops.length; i += 400) send(ops.slice(i, i + 400));
        return sent;
      }
      function send(ops) {
        pending++; refresh();
        Promise.resolve(adapter.write(st.code, ops.map(o => ({ k: o.k, v: o.v, d: o.d, by: st.dev }))))
          .then(() => { pending--; lastErr = null; refresh(); })
          .catch(e => { // rejected (e.g. rules): forget we sent them so the next push retries
            pending--; lastErr = e; console.error('Sync: write failed', e);
            ops.forEach(o => { st.base[o.k] = '!'; }); saveSt(); refresh();
          });
      }
      function onSave() {
        if (!ready || !st.code) return;
        clearTimeout(pushTimer); pushTimer = setTimeout(push, 300);
      }

      // ---- Apply remote changes ----
      const busy = () => (typeof activeSideKey !== 'undefined' && activeSideKey !== null) || (typeof pdIsOpen === 'function' && pdIsOpen());
      function rerender() {
        const run = f => { try { f(); } catch (e) { console.error('Sync: re-render failed', e); } };
        run(renderGrid);
        if (currentView === 'summary') run(renderSummaryView);
        else if (currentView === 'history') run(renderHistoryTable);
        else if (currentView === 'plants') run(renderPlanter);
        else if (currentView === 'calendar') run(calRender);
      }
      function flushRemote() {
        if (!remote.size) return;
        if (busy()) { clearTimeout(flushTimer); flushTimer = setTimeout(flushRemote, 800); return; }
        const mine = push(); // anything edited locally goes out first and wins over stale remote copies
        const cur = recMap(); let changed = false;
        remote.forEach((doc, k) => {
          if (k === 'm:hort' || mine.has(k)) return;
          if (doc.d) { delete st.base[k]; if (cur.has(k)) { removeLocal(k); changed = true; } return; }
          const h = hash(doc.v);
          if (cur.has(k) && hash(cur.get(k)) === h) { st.base[k] = h; return; }
          try { setLocal(k, JSON.parse(doc.v)); st.base[k] = h; changed = true; } catch (e) { console.error('Sync: bad record', k, e); }
        });
        remote.clear(); saveSt();
        if (changed) { persistLocal(); rerender(); }
      }
      function onDocs(docs, meta) {
        docs.forEach(d => remote.set(d.k, d));
        flushRemote(); refresh(meta);
      }

      // ---- Connection ----
      async function fbAdapter() {
        const [A, U, F] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]);
        const app = A.initializeApp(HORT_FIREBASE_CONFIG);
        const auth = U.getAuth(app);
        const db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
        await new Promise(res => { const off = U.onAuthStateChanged(auth, () => { off(); res(); }); });
        if (!auth.currentUser) await U.signInAnonymously(auth);
        const col = code => F.collection(db, 'hortes', code, 'records');
        return {
          async fetchAll(code) { return (await F.getDocsFromServer(col(code))).docs.map(d => d.data()); },
          write(code, ops) {
            const b = F.writeBatch(db), t = Date.now();
            ops.forEach(o => b.set(F.doc(col(code), encodeURIComponent(o.k)), { k: o.k, v: o.v, d: !!o.d, t, by: o.by }));
            return b.commit();
          },
          listen(code, cb, err) {
            return F.onSnapshot(col(code), { includeMetadataChanges: true },
              s => cb(s.docChanges().map(c => c.doc.data()), { fromCache: s.metadata.fromCache, pending: s.metadata.hasPendingWrites }), err);
          }
        };
      }
      async function ensureAdapter() {
        if (adapter) return adapter;
        if (!cfgOk() && !window.__HORT_ADAPTER__) throw new Error('NOCONFIG');
        adapter = await (window.__HORT_ADAPTER__ || fbAdapter)();
        return adapter;
      }
      function attach() {
        if (unsub || !adapter || !st.code) return;
        unsub = adapter.listen(st.code, onDocs, e => { lastErr = e; console.error('Sync: listener error', e); refresh(); });
      }
      async function connect() {
        refresh();
        try { await ensureAdapter(); } catch (e) { console.warn('Sync: not connected yet', e); if (navigator.onLine && e.message !== 'NOCONFIG') lastErr = e; refresh(); return; }
        lastErr = null; push(); attach(); refresh();
      }
      function detach() { if (unsub) { try { unsub(); } catch (e) { } unsub = null; } remote.clear(); lastMeta = { fromCache: true, pending: false }; }

      // ---- Actions used by the dialog ----
      async function create() {
        await ensureAdapter();
        detach(); st.code = gen(8); st.base = {}; saveSt();
        ensureIds();
        pending++; // the marker doc that lets "join" tell a real hort from a mistyped code
        Promise.resolve(adapter.write(st.code, [{ k: 'm:hort', v: JSON.stringify({ created: Date.now() }), d: false, by: st.dev }]))
          .then(() => { pending--; refresh(); }).catch(e => { pending--; lastErr = e; refresh(); });
        push(); attach(); refresh();
        return st.code;
      }
      async function join(raw) {
        const code = norm(raw);
        if (code.length !== 8) throw new Error('BADCODE');
        await ensureAdapter();
        const docs = await adapter.fetchAll(code);
        if (!docs.length) throw new Error('NOHORT');
        try { localStorage.setItem(BACKUP, JSON.stringify(appData)); } catch (e) { }
        detach();
        appData = { cols: 8, cols2: 8, paths2: [], cellSides: {}, history: [], customPlants: [], paths: [], plants: [] };
        st.base = {};
        docs.forEach(d => { if (d.k === 'm:hort' || d.d) return; try { setLocal(d.k, JSON.parse(d.v)); st.base[d.k] = hash(d.v); } catch (e) { console.error('Sync: bad record', d.k, e); } });
        cols = appData.cols || 8; appData.cols = cols; cols2 = appData.cols2 || 8; appData.cols2 = cols2;
        st.code = code; saveSt();
        let fixed = false; try { fixed = catEnsure(); } catch (e) { }
        persistLocal(); rerender();
        attach(); if (fixed) push(); refresh();
        return code;
      }
      function leave() { detach(); st.code = null; st.base = {}; saveSt(); lastErr = null; refresh(); }

      // ---- State → chip ----
      const LABELS = {
        off: ['cloud_off', 'No sincronitzat'], connecting: ['sync', 'Connectant…'], syncing: ['sync', 'Sincronitzant…'],
        synced: ['cloud_done', 'Sincronitzat'], offline: ['cloud_off', 'Sense connexió'], error: ['error', 'Error de sincronització']
      };
      function refresh(meta) {
        if (meta) lastMeta = meta;
        let s;
        if (!st.code) s = 'off';
        else if (lastErr) s = 'error';
        else if (!adapter) s = navigator.onLine ? 'connecting' : 'offline';
        else if (!navigator.onLine) s = 'offline';
        else s = (pending > 0 || lastMeta.pending || lastMeta.fromCache) ? 'syncing' : 'synced';
        state = s;
        const [ic, label] = LABELS[s];
        document.querySelectorAll('[data-sync-chip]').forEach(c => {
          c.dataset.state = s; c.title = label; c.setAttribute('aria-label', 'Sincronització: ' + label);
          const i = c.querySelector('.sync-ic'), l = c.querySelector('.sync-label');
          if (i) i.textContent = ic; if (l) l.textContent = label;
        });
        if (typeof syStatus === 'function') syStatus();
      }

      function init() {
        ready = true;
        refresh();
        window.addEventListener('online', () => { if (st.code && !adapter) connect(); else refresh(); });
        window.addEventListener('offline', () => refresh());
        document.addEventListener('visibilitychange', () => { if (document.hidden && ready && st.code) { clearTimeout(pushTimer); push(); } });
        if (st.code) connect();
      }

      return {
        init, onSave, create, join, leave, refresh,
        get state() { return state; }, get code() { return st.code; }, get configured() { return cfgOk() || !!window.__HORT_ADAPTER__; },
        get label() { return LABELS[state][1]; }, get icon() { return LABELS[state][0]; },
        fmt: c => (c ? c.slice(0, 4) + '-' + c.slice(4) : ''), norm,
        _dbg: { get st() { return st; }, recMap, flushRemote, push }
      };
    })();
    document.addEventListener('DOMContentLoaded', () => HortSync.init());

    // ---- Sync dialog (same chrome as the other .hn dialogs) ----
    let syReturnFocus = null, syInerted = [], syBusy = false, syLeaveArmed = null;
    const syIsOpen = () => document.getElementById('sync-modal').classList.contains('open');
    function syStatus() {
      const s = document.getElementById('sy-status'), sub = document.getElementById('sy-sub');
      if (sub) sub.textContent = HortSync.code ? 'Hort connectat' : 'Hort compartit entre dispositius';
      if (s) s.innerHTML = `<span class="material-symbols-outlined" aria-hidden="true">${HortSync.icon}</span><span>${escHtml(HortSync.label)}</span>`;
    }
    function syMsg(text, err) { const m = document.getElementById('sy-msg'); if (m) { m.textContent = text || ''; m.classList.toggle('err', !!err); } }
    function syRender() {
      const body = document.getElementById('sy-body');
      if (!HortSync.configured) {
        body.innerHTML = `<p class="sy-p">La sincronització encara no està configurada: falten les claus de Firebase al fitxer de l'aplicació.</p>`;
      } else if (HortSync.code) {
        body.innerHTML = `<div class="sy-sec">
            <div class="sy-status" id="sy-status"></div>
            <div class="sy-code"><span class="sy-code-txt" id="sy-code-txt">${HortSync.fmt(HortSync.code)}</span>
              <button type="button" class="pm-btn sy-btn sy-btn-tonal" onclick="syCopy()"><span class="material-symbols-outlined" aria-hidden="true">content_copy</span>Copia</button></div>
            <p class="sy-p">Qualsevol dispositiu amb aquest codi veu i edita el mateix hort. Comparteix-lo només amb qui vulguis.</p>
          </div>
          <div class="sy-sec">
            <p class="sy-p">Si surts d'aquest hort, les dades es queden en aquest dispositiu però deixen de sincronitzar-se.</p>
            <button type="button" class="pm-btn sy-btn pm-btn-outlined" id="sy-leave" onclick="syLeave()"><span class="material-symbols-outlined" aria-hidden="true">logout</span><span class="sy-leave-label">Surt d'aquest hort</span></button>
          </div>
          <p class="sy-msg" id="sy-msg" role="status" aria-live="polite"></p>`;
      } else {
        body.innerHTML = `<div class="sy-sec">
            <h4 class="hn-gh">Crea un hort compartit</h4>
            <p class="sy-p">Puja les dades d'aquest dispositiu i obtén un codi de 8 caràcters per connectar-hi els altres dispositius.</p>
            <button type="button" class="pm-btn sy-btn sy-btn-tonal" id="sy-create" onclick="syCreate()"><span class="material-symbols-outlined" aria-hidden="true">cloud_upload</span>Crea un hort nou</button>
          </div>
          <div class="sy-sec">
            <h4 class="hn-gh">Uneix-te a un hort</h4>
            <p class="sy-p">Les dades d'aquest dispositiu se substituiran per les del hort (se'n guarda una còpia de seguretat en aquest dispositiu).</p>
            <div class="of-field sy-f" id="sy-code-f">
              <label class="of-label" for="sy-code-in">Codi de l'hort</label>
              <input type="text" id="sy-code-in" class="sy-in" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key==='Enter')syJoin()">
            </div>
            <button type="button" class="pm-btn sy-btn sy-btn-tonal" id="sy-join" onclick="syJoin()"><span class="material-symbols-outlined" aria-hidden="true">cloud_download</span>Uneix-te</button>
          </div>
          <p class="sy-msg" id="sy-msg" role="status" aria-live="polite"></p>`;
      }
      syStatus();
    }
    function syErr(e) {
      const m = e && e.message;
      if (m === 'NOHORT') return "No s'ha trobat cap hort amb aquest codi.";
      if (m === 'BADCODE') return 'El codi ha de tenir 8 caràcters.';
      if (m === 'NOCONFIG') return 'La sincronització no està configurada.';
      if (!navigator.onLine) return 'Cal connexió a internet per fer-ho.';
      return "No s'ha pogut completar. Torna-ho a provar.";
    }
    async function syRun(btnId, fn) {
      if (syBusy) return; syBusy = true;
      const b = document.getElementById(btnId); if (b) b.disabled = true; syMsg('');
      try { await fn(); } catch (e) { console.error(e); syMsg(syErr(e), true); }
      syBusy = false; const b2 = document.getElementById(btnId); if (b2) b2.disabled = false;
    }
    function syCreate() { syRun('sy-create', async () => { await HortSync.create(); syRender(); showSnackbar('Hort creat. Copia el codi per als altres dispositius.'); }); }
    function syJoin() {
      const inp = document.getElementById('sy-code-in');
      syRun('sy-join', async () => { await HortSync.join(inp.value); syRender(); showSnackbar('Connectat al hort.'); });
    }
    async function syCopy() {
      const code = HortSync.fmt(HortSync.code);
      try { await navigator.clipboard.writeText(code); showSnackbar('Codi copiat.'); }
      catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('sy-code-txt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); showSnackbar('Selecciona i copia el codi.'); }
    }
    function syLeave() {
      const b = document.getElementById('sy-leave');
      if (!syLeaveArmed) {
        b.querySelector('.sy-leave-label').textContent = 'Segur? Torna a tocar'; b.classList.add('sy-btn-err');
        syLeaveArmed = setTimeout(() => { syLeaveArmed = null; if (document.getElementById('sy-leave')) syRender(); }, 4000);
        return;
      }
      clearTimeout(syLeaveArmed); syLeaveArmed = null;
      HortSync.leave(); syRender(); showSnackbar("Has sortit del hort. Les dades es queden en aquest dispositiu.");
    }
    function openSyncDialog(trigger) {
      const m = document.getElementById('sync-modal');
      if (syIsOpen()) return;
      syRender();
      syReturnFocus = trigger || document.activeElement;
      syInerted = [...document.body.children].filter(el => el !== m && el.id !== 'snackbar-host' && el.tagName !== 'SCRIPT' && !el.inert);
      syInerted.forEach(el => { el.inert = true; });
      document.documentElement.classList.add('hn-lock');
      m.inert = false; m.classList.remove('open'); void m.offsetWidth; m.classList.add('open');
      setTimeout(() => document.getElementById('sy-dlg').focus({ preventScroll: true }), 30);
    }
    function closeSyncDialog() {
      const m = document.getElementById('sync-modal');
      if (!m.classList.contains('open')) return;
      clearTimeout(syLeaveArmed); syLeaveArmed = null;
      m.classList.remove('open'); m.inert = true;
      syInerted.forEach(el => { el.inert = false; }); syInerted = [];
      document.documentElement.classList.remove('hn-lock');
      const back = syReturnFocus; syReturnFocus = null;
      if (back && document.contains(back)) back.focus({ preventScroll: true });
    }
    (function initSyncDialog() {
      const scrim = document.getElementById('sy-scrim');
      scrim.addEventListener('click', closeSyncDialog);
      ['wheel', 'touchmove'].forEach(t => scrim.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.addEventListener('keydown', e => {
        if (!syIsOpen()) return;
        if (e.key === 'Escape') { e.preventDefault(); closeSyncDialog(); }
        else if (e.key === 'Tab') {
          const f = [...document.querySelectorAll('#sy-dlg button:not([disabled]), #sy-dlg input')].filter(x => x.offsetParent !== null);
          if (!f.length) return;
          const i = f.indexOf(document.activeElement), last = f.length - 1;
          if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[last].focus(); }
          else if (!e.shiftKey && (i === last)) { e.preventDefault(); f[0].focus(); }
        }
      });
    })();
  </script>
  <script>
    // PWA shortcuts (manifest.json) open the app as ./?view=grid|summary|history|calendar|plants.
    // Registered after the app's own DOMContentLoaded handlers, so it runs once the app has loaded its data.
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const v = new URLSearchParams(location.search).get('view');
        if (v && ['grid', 'summary', 'history', 'calendar', 'plants'].includes(v)) {
          switchView(v);
          history.replaceState(null, '', location.pathname + location.hash);
        }
      } catch (e) { console.warn('view param', e); }
    });

    // Service worker: offline launch + auto-reload when a new version takes over.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const hadController = !!navigator.serviceWorker.controller;
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!hadController || reloaded) return;
          reloaded = true;
          location.reload();
        });
        navigator.serviceWorker.register('sw.js').then((reg) => reg.update()).catch((e) => console.warn('SW registration failed', e));
      });
    }
  </script>
</body>
</html>
