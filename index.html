      const hctList = document.getElementById('hct-list'), hctCal = document.getElementById('hct-cal'), calSplit = document.getElementById('cal-split');
      if (hctList && hctCal) {
        hctList.setAttribute('aria-pressed', view === 'history' ? 'true' : 'false');
        hctCal.setAttribute('aria-pressed', view === 'calendar' ? 'true' : 'false');
      }
      // The Calendari split button (item 32) fills like a selected toggle while Calendari is the active page;
      // its view-picker menu shouldn't stay open behind whatever page is showing instead.
      if (calSplit) calSplit.classList.toggle('active', view === 'calendar');
      if (view !== 'calendar' && typeof calViewMenuClose === 'function') calViewMenuClose();

      // Contextual rail FABs: CSV export on Historial, "Afegir planta" on Planter
      [['rail-fab-export', 'history'], ['rail-fab-plant', 'plants']].forEach(([id, v]) => {
        const b = document.getElementById(id); if (!b) return;
        b.classList.toggle('hidden', view !== v); b.classList.toggle('flex', view === v);
      });

      // Contextual Plànol FAB Menu Visibility
      const planolFabMobile = document.getElementById('planol-fab-menu-mobile');
      const planolFabRail = document.getElementById('planol-fab-menu-rail');
      if (planolFabMobile) planolFabMobile.classList.toggle('hidden', view !== 'grid');
      if (planolFabRail) planolFabRail.classList.toggle('hidden', view !== 'grid');
      if (view !== 'grid') closePlanolFabMenu();

      const renderNew = () => {
        if (viewChanged) pageToTop(view); // a page always opens at its very top, whatever the previous page's scroll position was
        if (view === 'summary') renderSummaryView();
        else if (view === 'history') {
          histPrevKeys = new Set(); // rows rise in when the view opens
          renderHistoryTable();
        } else if (view === 'plants') {
          plPrevKeys = new Set();
          renderPlanter();
        } else if (view === 'calendar') {
          calViewMode = 'heatmap'; // always reopens on Visió general (item 31)
          calSrc = 'planter';
          calSyncViewToggle();
          calSyncSrcToggle();
          calRender();
        }
      };
      if (!deferSwap) { renderNew(); return; }
      oldSec.classList.add('vs-leaving');
      viewSwapTimer = setTimeout(() => {
        viewSwapTimer = null;
        if (currentView !== view) return;
        Object.keys(VIEWS).forEach(v => {
          const sec = document.getElementById(VIEWS[v]);
          if (sec) { sec.classList.remove('vs-leaving'); sec.classList.toggle('hidden', v !== view); }
        });
        renderNew();
      }, VIEW_SWAP_MS);
    }

    // Scroll the page (and any scroller that holds the page) back to the top, instantly
    function pageToTop(view) {
      const sec = document.getElementById({ grid: 'view-grid', summary: 'view-summary', history: 'view-history', calendar: 'view-calendar', plants: 'view-plants' }[view]);
      for (let el = sec; el && el !== document.documentElement; el = el.parentElement) if (el.scrollTop) el.scrollTop = 0;
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
      if (typeof calFtbLastY !== 'undefined') calFtbLastY = 0;
    }

    function addColumn(g) {
      if (g === 2) cols2++; else cols++;
      saveData();
      renderGrid();
    }

    function lastColumnHasPlants(g) {
      const last = gridCols(g) - 1;
      for (let r = 0; r < rowsIn(g, last); r++) {
        for (const side of ['left', 'right']) {
          if ((appData.cellSides[slotKey(g, r, last, side)] || []).length > 0) return true;
        }
      }
      return false;
    }

    function updateColumnControls() {
      [1, 2].forEach(g => {
        const sfx = g === 2 ? '-2' : '';
        const rm = document.getElementById('col-remove-btn' + sfx);
        if (!rm) return;
        const n = gridCols(g);
        const blocked = n <= 1 || lastColumnHasPlants(g);
        rm.setAttribute('aria-disabled', blocked);
        rm.title = blocked ? (n <= 1 ? 'Cal almenys una columna' : "Buida l'última columna per poder eliminar-la") : 'Eliminar columna';
        // The count is no longer shown as text; announce it to screen readers instead
        const status = document.getElementById('cols-status' + sfx);
        if (status) status.textContent = `${n} ${n === 1 ? 'columna' : 'columnes'}`;
      });
    }

    function removeColumn(g) {
      if (gridCols(g) <= 1) return;
      if (lastColumnHasPlants(g)) {
        showSnackbar("L'última columna té plantes. Buida-la abans d'eliminar-la.");
        return;
      }
      if (g === 2) cols2--; else cols--;
      saveData();
      renderGrid();
      showSnackbar('Columna eliminada', 'Desfer', () => addColumn(g));
    }

    // ===== Garden rendering =====
    let pathEditMode = false;

    function getPathType(i, g) {
      const p = g === 2 ? appData.paths2 : appData.paths;
      return (p && p[i] === 'irrigation') ? 'irrigation' : 'walk';
    }

    function renderGrid() {
      updateColumnControls();
      if (!Array.isArray(appData.paths)) appData.paths = [];
      if (!Array.isArray(appData.paths2)) appData.paths2 = [];
      renderGarden(1);
      renderGarden(2);
    }

    function renderGarden(g) {
      const container = document.getElementById(g === 2 ? 'grid-container-2' : 'grid-container');
      if (!container) return;
      const n = gridCols(g);
      // Plànol 2 has a notch (page background) under its short columns whenever taller columns follow them
      const notch = g === 2 && n > GRID2_SHORT_COLS;
      container.classList.toggle('garden-l', notch);

      // Header: column numbers (with spacers over the paths)
      let head = '<div class="garden-head"><div class="row-labels" style="visibility:hidden"></div>';
      for (let c = 0; c < n; c++) {
        head += `<span class="garden-label col-w">${c + 1}</span>`;
        if (c < n - 1) head += '<span class="garden-path" aria-hidden="true"></span>';
      }
      head += '</div>';

      // Body: row numbers of the first column on the left, then bed columns with a path between each pair.
      // With a notch, rows 3-4 are numbered in the gutter right of the short columns, under the short path.
      let rowLabels = '<div class="row-labels">';
      for (let r = 0; r < rowsIn(g, 0); r++) rowLabels += `<span class="garden-label bed-h">${r + 1}</span>`;
      rowLabels += '</div>';

      container.innerHTML = head + '<div class="garden-body">' + rowLabels + '</div>';
      const body = container.querySelector('.garden-body');

      for (let c = 0; c < n; c++) {
        const col = document.createElement('div');
        col.className = 'bed-col';
        for (let r = 0; r < rowsIn(g, c); r++) {
          const cell = document.createElement('div');
          cell.className = 'bed-cell bed-h';
          appendVerticalSidesToCell(cell, r, c, g);
          col.appendChild(cell);
        }
        body.appendChild(col);
        if (c < n - 1) {
          const path = buildPath(c, g);
          if (notch && c === GRID2_SHORT_COLS - 1) {
            const w = document.createElement('div');
            w.className = 'path-notch-w';
            w.appendChild(path);
            const lab = document.createElement('div');
            lab.className = 'row-labels';
            for (let r = rowsIn(g, c); r < ROWS; r++) lab.insertAdjacentHTML('beforeend', `<span class="garden-label bed-h">${r + 1}</span>`);
            w.appendChild(lab);
            body.appendChild(w);
          } else body.appendChild(path);
        }
      }
      if (g === 2) {
        drawGroundShape(container);
        if (!container.dataset.ro && window.ResizeObserver) {
          container.dataset.ro = '1';
          new ResizeObserver(() => drawGroundShape(container)).observe(container);
        }
      }
    }

    // Draws the L-shaped ground of plànol 2 as an SVG path with rounded corners (convex outside, concave at the notch)
    function drawGroundShape(container) {
      let svg = container.querySelector(':scope > .garden-ground');
      const notchW = container.querySelector('.path-notch-w');
      if (!notchW) { if (svg) svg.remove(); return; }
      const cr = container.getBoundingClientRect();
      const W = cr.width, H = cr.height;
      const xN = notchW.getBoundingClientRect().left - cr.left - 2;
      const lastCell = container.querySelector('.bed-col').lastElementChild.getBoundingClientRect();
      const yN = lastCell.bottom - cr.top + (parseFloat(getComputedStyle(container).paddingBottom) || 16);
      const R = parseFloat(getComputedStyle(container).borderTopLeftRadius) || 28;
      const P = [[0, 0], [W, 0], [W, H], [xN, H], [xN, yN], [0, yN]];
      let d = '';
      P.forEach((p, i) => {
        const a = P[(i + P.length - 1) % P.length], b = P[(i + 1) % P.length];
        const la = Math.hypot(a[0] - p[0], a[1] - p[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
        const r = Math.min(R, la / 2, lb / 2);
        const A = [p[0] + (a[0] - p[0]) / la * r, p[1] + (a[1] - p[1]) / la * r];
        const B = [p[0] + (b[0] - p[0]) / lb * r, p[1] + (b[1] - p[1]) / lb * r];
        const cross = (p[0] - a[0]) * (b[1] - p[1]) - (p[1] - a[1]) * (b[0] - p[0]);
        d += (i === 0 ? 'M' : 'L') + A[0].toFixed(1) + ' ' + A[1].toFixed(1) + ` A${r} ${r} 0 0 ${cross > 0 ? 1 : 0} ` + B[0].toFixed(1) + ' ' + B[1].toFixed(1) + ' ';
      });
      d += 'Z';
      if (!svg) {
        svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'garden-ground');
        svg.setAttribute('aria-hidden', 'true');
        svg.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'path'));
        container.insertBefore(svg, container.firstChild);
      }
      svg.setAttribute('width', W); svg.setAttribute('height', H);
      svg.firstChild.setAttribute('d', d);
    }

    function buildPath(i, g) {
      const t = getPathType(i, g);
      const el = document.createElement('div');
      el.className = 'garden-path';
      el.dataset.t = t;
      el.dataset.i = i;
      // A path is as tall as the shorter of the two columns it runs between (the one at the notch is 2 rows long)
      const rows = Math.min(rowsIn(g, i), rowsIn(g, i + 1));
      el.style.height = `calc(${rows} * var(--bh) + ${rows - 1} * 3px)`;
      el.innerHTML = `
        <div class="path-morph" aria-hidden="true"><div class="pg"></div><div class="pw"></div></div>
        <button type="button" class="path-toggle" onclick="togglePath(${i}, ${g || 1})" aria-label="${pathLabel(i, t, g)}">
          <span class="path-toggle-face">
            <span class="material-symbols-outlined path-ic path-ic-walk" aria-hidden="true">footprint</span>
            <span class="material-symbols-outlined path-ic path-ic-water" aria-hidden="true">water_drop</span>
          </span>
        </button>`;
      return el;
    }

    function pathLabel(i, t, g) {
      return `${g === 2 ? 'Segon plànol. ' : ''}Camí entre les columnes ${i + 1} i ${i + 2}: ${t === 'irrigation' ? 'reg' : 'per caminar'}. Toca per canviar-lo.`;
    }

    function togglePath(i, g) {
      if (!pathEditMode) return;
      const key = g === 2 ? 'paths2' : 'paths';
      if (!Array.isArray(appData[key])) appData[key] = [];
      const next = getPathType(i, g) === 'walk' ? 'irrigation' : 'walk';
      appData[key][i] = next;
      saveData();
      const el = document.querySelector(`#${g === 2 ? 'grid-container-2' : 'grid-container'} .garden-path[data-i="${i}"]`);
      if (el) {
        el.dataset.t = next;
        const btn = el.querySelector('.path-toggle');
        if (btn) btn.setAttribute('aria-label', pathLabel(i, next, g));
      }
    }

    function setPathEditMode(on) {
      pathEditMode = !!on;
      const view = document.getElementById('view-grid');
      if (view) view.classList.toggle('paths-editing', pathEditMode);
      const btn = document.getElementById('path-edit-btn');
      if (btn) btn.setAttribute('aria-pressed', pathEditMode);
      // Beds are not tappable while editing paths
      document.querySelectorAll('.garden .side-spot').forEach(b => { b.disabled = pathEditMode; });
    }

    function cropSig(c) {
      return `${c.emoji || getPlantEmoji(c.plantName)}|${c.plantName}|${isLl(c) ? 'L' : c.plantQty}`;
    }

    function slotContent(crops) {
      const n = crops.length;
      const pill = (c, i) => {
        const emoji = c.emoji || getPlantEmoji(c.plantName || '');
        const qty = isLl(c) ? 'L' : (parseInt(c.plantQty, 10) || 0);
        return `<span class="crop-pill pill-${i + 1}" data-sig="${String(cropSig(c)).replace(/"/g, '&quot;')}" aria-hidden="true"><span class="crop-emoji">${emoji}</span><span class="crop-qty ${String(qty).length >= 3 ? 'q3' : ''}">${qty}</span></span>`;
      };
      if (n <= 2) return crops.map(pill).join('');
      return pill(crops[0], 0) + pill(crops[1], 1) +
        `<span class="crop-more more-m" aria-hidden="true">+${n - 1}</span><span class="crop-more more-d" aria-hidden="true">+${n - 2}</span>`;
    }

    function appendVerticalSidesToCell(cell, r, c, g) {
      const sideNames = { left: 'esquerre', right: 'dret' };
      ['left', 'right'].forEach((side, i) => {
        const sideKey = slotKey(g, r, c, side);
        const crops = appData.cellSides[sideKey] || [];

        const sideEl = document.createElement('button');
        sideEl.type = 'button';
        sideEl.dataset.sideKey = sideKey;
        sideEl.className = `side-spot ${crops.length > 0 ? 'planted' : ''} ${crops.length > 2 ? 'ovf' : ''} ${sideKey === activeSideKey ? 'slot-selected' : ''}`;
        sideEl.disabled = pathEditMode;

        const where = `${g === 2 ? 'Segon plànol, ' : ''}Fila ${r + 1}, columna ${c + 1}, costat ${sideNames[side]}`;
        if (crops.length > 0) {
          const list = crops.map(cp => `${cp.plantName}: ${isLl(cp) ? 'llavors' : cp.plantQty}`).join(', ');
          sideEl.innerHTML = slotContent(crops);
          sideEl.title = list;
          sideEl.setAttribute('aria-label', `${where}: ${list}`);
        } else {
          sideEl.innerHTML = '<span class="slot-plus" aria-hidden="true">+</span>';
          sideEl.setAttribute('aria-label', `${where}: buit`);
        }

        sideEl.onclick = (e) => {
          e.stopPropagation();
          if (pathEditMode) return;
          openPlantModal(sideKey, r, c, side);
        };

        cell.appendChild(sideEl);
        if (i === 0) {
          const div = document.createElement('span');
          div.className = 'bed-divider';
          div.setAttribute('aria-hidden', 'true');
          cell.appendChild(div);
        }
      });
    }

    // After saving a slot: removed pills shrink away, then new/changed pills spring in
    function renderGridAfterEdit(key, oldCrops) {
      const newCrops = appData.cellSides[key] || [];
      const newSigs = newCrops.map(cropSig);
      const oldSigs = (oldCrops || []).map(cropSig);
      const half = document.querySelector(`.side-spot[data-side-key="${key}"]`);
      const leaving = half ? [...half.querySelectorAll('.crop-pill')].filter(p => {
        const i = newSigs.indexOf(p.dataset.sig);
        return i === -1;
      }) : [];
      const finish = () => {
        renderGrid();
        const h = document.querySelector(`.side-spot[data-side-key="${key}"]`);
        if (!h) return;
        const remaining = [...oldSigs];
        let k = 0;
        h.querySelectorAll('.crop-pill').forEach(p => {
          const idx = remaining.indexOf(p.dataset.sig);
          if (idx === -1) { p.style.setProperty('--k', k++); p.classList.add('pill-in'); }
          else remaining.splice(idx, 1);
        });
        h.querySelectorAll('.crop-more').forEach(m => { if (newCrops.length !== oldSigs.length) { m.style.setProperty('--k', k); m.classList.add('pill-in'); } });
      };
      if (leaving.length) {
        leaving.forEach(p => p.classList.add('pill-out'));
        setTimeout(finish, 300);
      } else {
        finish();
      }
    }

    let currentCropsWorkingCopy = [];

    function openPlantModal(sideKey, r, c, sideId) {
      activeSideKey = sideKey;
      document.querySelectorAll('.side-spot.slot-selected').forEach(el => el.classList.remove('slot-selected'));
      const slotEl = document.querySelector(`.side-spot[data-side-key="${sideKey}"]`);
      if (slotEl) slotEl.classList.add('slot-selected');
      document.getElementById('modal-title').textContent = 'Editar secció';
      pmReturnFocus = slotEl;

      const existing = appData.cellSides[sideKey] || [];
      currentCropsWorkingCopy = JSON.parse(JSON.stringify(existing));
      // Remember which saved planting each working copy comes from (not serialized), so a harvest can remove
      // exactly that planting from the saved data while the other unsaved edits stay pending until Desar
      currentCropsWorkingCopy.forEach((c, i) => Object.defineProperty(c, '__orig', { value: existing[i], enumerable: false, writable: true }));
      pmHarvest = {};
      if (currentCropsWorkingCopy.length === 0) {
        currentCropsWorkingCopy.push(createNewCropObject());
      }

      pmOpenIdx = 0;
      ntShowAll = {};
      pmSession++;
      renderModalCrops();
      pmOpen(slotEl);
    }

    // ===== Plant editor container: open/close, spotlight, page shift, Escape, focus trap =====
    const PM_WIDE = window.matchMedia('(min-width: 840px)');
    let pmReturnFocus = null, pmRaf = 0, pmStopTimer = 0;

    function pmTrack() {
      const slot = document.querySelector('.side-spot.slot-selected');
      const hole = document.getElementById('pm-hole');
      if (slot && hole) {
        const r = slot.getBoundingClientRect();
        hole.style.left = (r.left - 5) + 'px'; hole.style.top = (r.top - 5) + 'px';
        hole.style.width = (r.width + 10) + 'px'; hole.style.height = (r.height + 10) + 'px';
        if (hole.dataset.for !== slot.dataset.sideKey) {
          // Match the slot's own corners (4px inside a bed, 16px at the column ends) + the 5px margin
          const cs = getComputedStyle(slot);
          hole.style.borderRadius = ['borderTopLeftRadius', 'borderTopRightRadius', 'borderBottomRightRadius', 'borderBottomLeftRadius']
            .map(k => (parseFloat(cs[k]) || 0) + 5 + 'px').join(' ');
          hole.dataset.for = slot.dataset.sideKey;
        }
      }
      pmRaf = requestAnimationFrame(pmTrack);
    }

    // Larger screens: if the slot would sit under the sheet, slide the garden left (scroll first, then offset)
    function pmReveal(slot) {
      document.querySelectorAll('.garden').forEach(x => { x.classList.remove('pm-back'); x.style.left = '0px'; });
      if (!slot || !PM_WIDE.matches) return;
      const g = slot.closest('.garden');
      if (!g) return;
      const sheetLeft = window.innerWidth - 16 - 400 - 24;
      let over = slot.getBoundingClientRect().right + 5 - sheetLeft;
      if (over <= 0) return;
      const sc = g.closest('.grid-scroll');
      if (sc) {
        const room = sc.scrollWidth - sc.clientWidth - sc.scrollLeft;
        const by = Math.min(over, Math.max(0, room));
        if (by > 0) { sc.scrollBy({ left: by, behavior: 'smooth' }); over -= by; }
      }
      if (over > 0) g.style.left = (-over) + 'px';
    }

    function pmOpen(slot) {
      const m = document.getElementById('plant-modal');
      const panel = document.getElementById('pm-panel');
      const body = document.getElementById('pm-body');
      body.scrollTop = 0; panel.classList.remove('pm-scrolled');
      clearTimeout(pmStopTimer); cancelAnimationFrame(pmRaf); pmTrack();
      pmReveal(slot);
      m.inert = false;
      m.classList.add('pm-open');
      setTimeout(() => panel.focus({ preventScroll: true }), 30);
    }

    function pmIsOpen() { return document.getElementById('plant-modal').classList.contains('pm-open'); }

    function pmClose() {
      const m = document.getElementById('plant-modal');
      if (!m.classList.contains('pm-open')) return;
      m.classList.remove('pm-open');
      m.inert = true; // no taps, clicks or keyboard focus reach the closed editor
      document.querySelectorAll('.garden').forEach(g => { g.classList.add('pm-back'); g.style.left = '0px'; });
      pmStopTimer = setTimeout(() => { cancelAnimationFrame(pmRaf); pmRaf = 0; }, 350);
      const back = pmReturnFocus; pmReturnFocus = null;
      if (back && document.contains(back)) back.focus({ preventScroll: true });
    }

    (function initPlantEditor() {
      const catchEl = document.getElementById('pm-catch');
      catchEl.addEventListener('click', () => { if (PM_WIDE.matches) closeModal(); });
      // The page behind stays put while the editor is open
      ['wheel', 'touchmove'].forEach(t => catchEl.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.getElementById('pm-body').addEventListener('scroll', e =>
        document.getElementById('pm-panel').classList.toggle('pm-scrolled', e.target.scrollTop > 0), { passive: true });
      document.addEventListener('keydown', e => {
        if (!pmIsOpen()) return;
        if (e.key === 'Escape') {
          const hv = document.querySelector('#modal-crops-container .pc-item.harvesting');
          if (hv) { e.preventDefault(); setHarvesting(hv, +hv.dataset.i, false, true); return; }
          e.preventDefault(); closeModal();
        } else if (e.key === 'Tab') {
          const panel = document.getElementById('pm-panel');
          const f = [...panel.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')]
            .filter(el => !el.disabled && el.offsetParent !== null && el.tabIndex >= 0 && !el.closest('[inert]'));
          if (!f.length) return;
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && (document.activeElement === first || document.activeElement === panel)) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
    })();

    function createNewCropObject() {
      return {
        plantName: '',
        plantQty: 1,
        plantDate: isoLocalDate(new Date()), // local date (toISOString gave yesterday/tomorrow near midnight)
        emoji: '🌱',
        notes: []
      };
    }

    let pmListTimers = [];
    function renderModalCrops() {
      const container = document.getElementById('modal-crops-container');
      pmListTimers.forEach(clearTimeout); pmListTimers = [];
      container.style.pointerEvents = '';
      container.innerHTML = '';

      if (pmOpenIdx >= currentCropsWorkingCopy.length) pmOpenIdx = currentCropsWorkingCopy.length - 1;
      container.className = 'pc-list';

      currentCropsWorkingCopy.forEach((crop, idx) => {
        const item = document.createElement('div');
        item.className = 'pc-item' + (idx === pmOpenIdx ? ' open settled' : '');
        item.dataset.i = idx;

        const currentEmoji = crop.emoji || getPlantEmoji(crop.plantName);

        item.innerHTML = `
          <button type="button" class="pc-head" onclick="toggleCropItem(${idx})" aria-expanded="${idx === pmOpenIdx}" aria-controls="pc-body-${idx}">
            <span class="pc-avatar" aria-hidden="true">${currentEmoji}</span>
            <span class="pc-text">
              <span class="pc-name">${crop.plantName ? escHtml(crop.plantName) : 'Nova planta'}</span>
              <span class="pc-sup" id="crop-sup-${idx}">${cropSummary(crop)}</span>
            </span>
            <span class="material-symbols-outlined pc-chev" aria-hidden="true">expand_more</span>
          </button>
          <div class="pc-body" id="pc-body-${idx}"><div><div class="pc-inner">
          <div class="pc-main">
          ${plantFieldHtml(crop, idx, currentEmoji)}

          ${qtyDateHtml(crop, idx)}

          <section class="nt" id="nt-${idx}" aria-labelledby="nt-h-${idx}">${notesSectionHtml(crop, idx)}</section>
          </div>
          ${harvestHtml(crop, idx)}
          <div class="pc-actions">
            <button type="button" class="m3-btn pc-harvest" id="hv-toggle-${idx}" onclick="toggleHarvest(${idx})" aria-expanded="false" aria-controls="hv-${idx}">
              <span class="hv-swap"><span class="hv-a"><span class="material-symbols-outlined" aria-hidden="true">agriculture</span>Collir</span><span class="hv-b" aria-hidden="true"><span class="material-symbols-outlined" aria-hidden="true">close</span>Cancel·lar</span></span>

      });
    }

    // New or restored card: grows in from zero height, already open, while the previously open card closes
    function pmAnimateEnter(idx, focusField) {
      const list = document.getElementById('modal-crops-container');
      const w = list.children[idx]; if (!w) return;
      const item = w.querySelector('.pc-item');
      list.querySelectorAll('.pc-item.open').forEach(it => { if (it !== item) setCropItemOpen(it, false); });
      w.classList.add('pc-anim', 'entering');

      item.querySelector('.pc-head').setAttribute('aria-expanded', 'true');

      requestAnimationFrame(() => w.classList.remove('entering'));
      setTimeout(() => w.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 200);
      setTimeout(() => {
        w.classList.remove('pc-anim');
        if (item.classList.contains('open')) item.classList.add('settled');

    // ===== Plant field (N1): M3 outlined text field + suggestions menu =====
    // Emoji is not picked here: it follows the plant name (getPlantEmoji). Plantings keep storing
    // plantName + emoji exactly as before, so old exports import unchanged.
    const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const normTxt = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    function plantFieldHtml(crop, idx, emoji) {
      return `
          <div class="pp-field" data-pp="${idx}">
            <div class="pp-box">
              <label class="pp-label" for="pp-in-${idx}">Planta</label>
              <span class="pp-emoji" aria-hidden="true">${emoji}</span>
              <input id="pp-in-${idx}" class="pp-input" data-pp-in="${idx}" value="${escHtml(crop.plantName || '')}" placeholder="Cerca o escriu una planta"
                role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="pp-menu-${idx}" autocomplete="off" autocapitalize="sentences" spellcheck="false">
              <button type="button" class="pp-arrow" data-pp-arr="${idx}" tabindex="-1" aria-label="Mostrar plantes"><span class="material-symbols-outlined">arrow_drop_down</span></button>
            </div>
            <div class="pp-menu" id="pp-menu-${idx}" data-menu="${idx}" role="listbox" aria-label="Plantes"></div>
          </div>`;
    }
    let ppItems = [], ppActive = -1;
    function ppHighlight(name, q) {
      if (!q) return escHtml(name);
      const i = normTxt(name).indexOf(normTxt(q));
      if (i < 0) return escHtml(name);
      return escHtml(name.slice(0, i)) + '<mark>' + escHtml(name.slice(i, i + q.trim().length)) + '</mark>' + escHtml(name.slice(i + q.trim().length));
    }
    function ppBuild(idx, query) {
      const menu = document.getElementById(`pp-menu-${idx}`); if (!menu) return;
      const cur = currentCropsWorkingCopy[idx].plantName || '';
      const q = (query || '').trim(), nq = normTxt(q);
      const match = n => !nq || normTxt(n).includes(nq);
      const all = catSortedNames();
      const shown = all.filter(match);
      const exact = all.some(n => normTxt(n) === nq);
      ppItems = [];
      let html = '';
      const row = n => {
        ppItems.push({ type: 'pick', name: n });
        const sel = n === cur;
        return `<button type="button" class="pp-mi" role="option" id="pp-opt-${idx}-${ppItems.length - 1}" data-k="${ppItems.length - 1}" aria-selected="${sel}">
          <span class="pp-e" aria-hidden="true">${escHtml(catEmoji(n))}</span><span class="pp-l">${ppHighlight(n, q)}</span>${sel ? '<span class="material-symbols-outlined pp-ck" aria-hidden="true">check</span>' : ''}</button>`;
      };
      if (shown.length) html += `<div class="pp-mh">Plantes</div>` + shown.map(row).join('');
      if (!shown.length) html += `<div class="pp-empty">Cap planta coincideix amb «${escHtml(q)}».</div>`;
      if (nq && !exact) {
        ppItems.push({ type: 'add', name: q });
        html += `<div class="pp-div"></div><button type="button" class="pp-mi pp-add" role="option" id="pp-opt-${idx}-${ppItems.length - 1}" data-k="${ppItems.length - 1}"><span class="material-symbols-outlined" aria-hidden="true">add</span><span class="pp-l">Afegir «${escHtml(q)}»</span></button>`;
      }
      menu.innerHTML = html;
      ppActive = nq ? 0 : ppItems.findIndex(it => it.name === cur);
      ppPaint(idx);
    }
    function ppPaint(idx) {
      const menu = document.getElementById(`pp-menu-${idx}`); if (!menu) return;
      menu.querySelectorAll('.pp-mi').forEach(b => b.classList.toggle('active', +b.dataset.k === ppActive));
      const inp = document.getElementById(`pp-in-${idx}`);
      const a = menu.querySelector(`.pp-mi[data-k="${ppActive}"]`);
      if (a) { a.scrollIntoView({ block: 'nearest' }); inp && inp.setAttribute('aria-activedescendant', a.id); }
      else if (inp) inp.removeAttribute('aria-activedescendant');
    }
    function ppOpen(idx) {
      const f = document.querySelector(`#modal-crops-container [data-pp="${idx}"]`); if (!f) return;
      const inp = f.querySelector('.pp-input');
      ppBuild(idx, inp.value === (currentCropsWorkingCopy[idx].plantName || '') ? '' : inp.value);
      f.classList.add('menu-open'); f.querySelector('.pp-menu').classList.add('open'); inp.setAttribute('aria-expanded', 'true');
      setTimeout(() => { const m = f.querySelector('.pp-menu'); if (m.classList.contains('open')) m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 60);
    }
    function ppClose(idx, restore = true) {
      const f = document.querySelector(`#modal-crops-container [data-pp="${idx}"]`); if (!f) return;
      f.classList.remove('menu-open'); f.querySelector('.pp-menu').classList.remove('open');
      const inp = f.querySelector('.pp-input');
      inp.setAttribute('aria-expanded', 'false'); inp.removeAttribute('aria-activedescendant');
      if (restore && currentCropsWorkingCopy[idx]) inp.value = currentCropsWorkingCopy[idx].plantName || '';
    }
    function ppChoose(idx, it) {
      if (!it || !currentCropsWorkingCopy[idx]) return;
      let name = it.name.trim();
      if (!name) return;
      if (it.type === 'add') {
        // Same behaviour as the old "Afegir personalitzada": saved to customPlants straight away
        // New plants go straight into the catalogue (near-duplicates reuse the existing name)
        const existing = (appData.plants || []).find(p => normTxt(p.name) === normTxt(name));
        if (existing) name = existing.name;
        else {
          if (!Array.isArray(appData.plants)) appData.plants = [];
          const np = { name, emoji: getPlantEmoji(name) }, sc = getPlantCategory(name);
          if (sc) np.category = sc; // suggested from the name; can be changed in Planter
          appData.plants.push(np);
          saveData();
          alertBox(`«${name}» s'ha afegit al planter`);
        }
      }
      const crop = currentCropsWorkingCopy[idx];
      crop.plantName = name;
      crop.emoji = catEmoji(name); // the catalogue decides the emoji
      const item = document.querySelector(`#modal-crops-container .pc-item[data-i="${idx}"]`);
      if (item) {
        item.querySelector('.pc-name').textContent = name;
        item.querySelector('.pc-avatar').textContent = crop.emoji;
        item.querySelector('.pp-emoji').textContent = crop.emoji;
      }
      ppClose(idx);
      const inp = document.getElementById(`pp-in-${idx}`); if (inp) inp.blur();
    }
    (function initPlantField() {
      const root = document.getElementById('modal-crops-container');
      root.addEventListener('mousedown', e => { if (e.target.closest('.pp-mi, .pp-arrow')) e.preventDefault(); });
      root.addEventListener('focusin', e => {
        const inp = e.target.closest('[data-pp-in]'); if (!inp) return;
        const idx = +inp.dataset.ppIn;
        inp.closest('.pp-field').classList.add('focus');
        ppOpen(idx); inp.select();
      });
      root.addEventListener('focusout', e => {
        const inp = e.target.closest('[data-pp-in]'); if (!inp) return;
        const idx = +inp.dataset.ppIn;
        inp.closest('.pp-field').classList.remove('focus');
        setTimeout(() => { if (document.activeElement !== inp) ppClose(idx); }, 120);
      });
      root.addEventListener('input', e => {
        const inp = e.target.closest('[data-pp-in]'); if (!inp) return;
        const idx = +inp.dataset.ppIn, f = inp.closest('.pp-field');
        if (!f.classList.contains('menu-open')) ppOpen(idx);
        ppBuild(idx, inp.value);
      });
      root.addEventListener('keydown', e => {
        const inp = e.target.closest('[data-pp-in]'); if (!inp) return;
        const idx = +inp.dataset.ppIn, f = inp.closest('.pp-field'), isOpen = f.classList.contains('menu-open');
        if (e.key === 'ArrowDown') { e.preventDefault(); if (!isOpen) ppOpen(idx); ppActive = Math.min(ppItems.length - 1, ppActive + 1); ppPaint(idx); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (isOpen) { ppActive = Math.max(0, ppActive - 1); ppPaint(idx); } }
        else if (e.key === 'Enter') { e.preventDefault(); if (isOpen && ppActive >= 0) ppChoose(idx, ppItems[ppActive]); }
        else if (e.key === 'Escape' && isOpen) { e.preventDefault(); e.stopPropagation(); ppClose(idx); }
      });
      root.addEventListener('click', e => {
        const mi = e.target.closest('.pp-mi');
        if (mi) { ppChoose(+mi.closest('.pp-menu').dataset.menu, ppItems[+mi.dataset.k]); return; }
        const ar = e.target.closest('[data-pp-arr]');
        if (ar) {
          const idx = +ar.dataset.ppArr, f = ar.closest('.pp-field');
          if (f.classList.contains('menu-open')) { ppClose(idx); document.getElementById(`pp-in-${idx}`).blur(); }
          else document.getElementById(`pp-in-${idx}`).focus();
        }
      });
    })();

    // ===== Quantity (Q1: − / + stepper field) and planting date (device date picker; new plantings default to today) =====
    function isoLocalDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function fmtDateCa(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      return m ? `${+m[3]} ${CA_MONTHS[+m[2] - 1]} ${m[1]}` : '';
    }
    // Quantity field: "−" at 1 switches to Llavors (sown seeds, no number), "+" goes back to 1. A saved planting keeps its mode.
    const qtyLocked = crop => !!(crop && crop.__orig);
    function qtyState(crop) {
      const ll = isLl(crop), q = parseInt(crop.plantQty, 10) || 1, locked = qtyLocked(crop);
      const seed = !ll && q <= 1 && !locked; // "−" would switch to Llavors: show a seed icon + hint
      const hint = locked ? null : ll ? '+ per tornar a unitats' : seed ? 'Icona esquerra per llavors' : '';
      return { ll, q, locked, seed, hint, minusOff: ll || (q <= 1 && locked), plusOff: ll && locked };
    }
    function qtyDateHtml(crop, idx) {
      const { ll, q, seed, hint, minusOff, plusOff } = qtyState(crop);
      return `
          <div class="qd-row">
            <div class="qty-col">
            <div class="of-field qty-field">
              <label class="of-label" for="qty-in-${idx}">Quantitat</label>
              <button type="button" class="qty-btn" id="qty-minus-${idx}" aria-label="${seed ? 'Llavors (sense quantitat)' : 'Una menys'}" aria-controls="qty-in-${idx}" ${minusOff ? 'aria-disabled="true"' : ''}
                onpointerdown="qtyHold(event, ${idx}, -1)" onclick="if (event.detail === 0) qtyStep(${idx}, -1)"><span class="material-symbols-outlined" id="qty-minus-ic-${idx}">${seed ? 'grain' : 'remove'}</span></button>
              <input id="qty-in-${idx}" class="qty-in${ll ? ' ll' : ''}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${ll ? 'Llavors' : q}" ${ll ? 'readonly' : ''}
                oninput="qtyInput(${idx}, this)" onblur="qtyBlur(${idx}, this)">
              <button type="button" class="qty-btn" id="qty-plus-${idx}" aria-label="Una més" aria-controls="qty-in-${idx}" ${plusOff ? 'aria-disabled="true"' : ''}
                onpointerdown="qtyHold(event, ${idx}, 1)" onclick="if (event.detail === 0) qtyStep(${idx}, 1)"><span class="material-symbols-outlined">add</span></button>
            </div>
            ${hint === null ? '' : `<p class="qty-hint" id="qty-hint-${idx}" aria-hidden="true">${hint}</p>`}
            </div>
            <div class="date-col">
              <div class="of-field date-field">
                <label class="of-label" for="date-in-${idx}">Data de plantació</label>
                <span class="date-txt" id="date-txt-${idx}" aria-hidden="true">${fmtDateCa(crop.plantDate) || 'Sense data'}</span>
                <span class="material-symbols-outlined date-ic" aria-hidden="true">calendar_today</span>
                <input id="date-in-${idx}" class="date-in" type="date" value="${escHtml(crop.plantDate || '')}"
                  onchange="dateSet(${idx}, this.value)" onclick="dateOpenPicker(this)">
              </div>
            </div>
          </div>`;
    }
    function qtyPaint(idx) {
      const crop = currentCropsWorkingCopy[idx]; if (!crop) return;
      const { ll, q, seed, hint, minusOff, plusOff } = qtyState(crop);
      const mi = document.getElementById(`qty-minus-ic-${idx}`); if (mi) mi.textContent = seed ? 'grain' : 'remove';
      const mb = document.getElementById(`qty-minus-${idx}`); if (mb) mb.setAttribute('aria-label', seed ? 'Llavors (sense quantitat)' : 'Una menys');
      const ht = document.getElementById(`qty-hint-${idx}`); if (ht && hint !== null) ht.textContent = hint;
      const inp = document.getElementById(`qty-in-${idx}`);
      if (inp) {
        inp.classList.toggle('ll', ll); inp.readOnly = ll;
        if (ll) inp.value = 'Llavors'; else if (document.activeElement !== inp) inp.value = q;
      }
      const setOff = (el, off) => { if (el) { if (off) el.setAttribute('aria-disabled', 'true'); else el.removeAttribute('aria-disabled'); } };
      setOff(document.getElementById(`qty-minus-${idx}`), minusOff);
      setOff(document.getElementById(`qty-plus-${idx}`), plusOff);
      const hv = document.getElementById(`hv-${idx}`); if (hv) hv.querySelector('.hv-qty')?.toggleAttribute('hidden', ll);
    }
    // allowSwitch: only the first press of a hold may flip between Llavors and a number (so holding "−" doesn't slide into Llavors)
    function qtyStep(idx, d, allowSwitch = true) {
      const crop = currentCropsWorkingCopy[idx]; if (!crop) return false;
      if (isLl(crop)) {
        if (d < 0 || qtyLocked(crop) || !allowSwitch) return false;
        delete crop.llavors; updateCropField(idx, 'plantQty', '1'); qtyPaint(idx); return true; // "+" from Llavors → 1
      }
      const cur = parseInt(crop.plantQty, 10) || 1;
      if (d < 0 && cur <= 1) {
        if (qtyLocked(crop) || !allowSwitch) return false;
        crop.llavors = true; updateCropField(idx, 'plantQty', '1'); qtyPaint(idx); return true; // "−" at 1 → Llavors
      }
      const next = Math.max(1, Math.min(9999, cur + d));
      if (next === cur) return false;
      updateCropField(idx, 'plantQty', String(next));
      const inp = document.getElementById(`qty-in-${idx}`); if (inp) inp.value = next;
      qtyPaint(idx);
      return true;
    }
    // Press = one step; hold = repeats (after 0.45s, every 80ms)
    let qtyHoldTimer = 0, qtyRepeat = 0;
    function stepHold(e, step) {
      if (e.button > 0) return;
      e.preventDefault();
      if (!step()) return;
      clearTimeout(qtyHoldTimer); clearInterval(qtyRepeat);
      qtyHoldTimer = setTimeout(() => { qtyRepeat = setInterval(() => { if (!step()) clearInterval(qtyRepeat); }, 80); }, 450);
      const stop = () => { clearTimeout(qtyHoldTimer); clearInterval(qtyRepeat); window.removeEventListener('pointerup', stop); window.removeEventListener('pointercancel', stop); };
      window.addEventListener('pointerup', stop); window.addEventListener('pointercancel', stop);
    }
    function qtyHold(e, idx, d) { let first = true; stepHold(e, () => { const r = qtyStep(idx, d, first); first = false; return r; }); }

    // ===== Harvest inside the card (H2): Collir → orange surface ripples out from the button over the card
    // (header stays), Collir becomes Cancel·la, the bin becomes Confirma. Confirming moves the plant to Historial
    // (saved immediately, as before) and the card leaves the list; the editor stays open. =====
    let pmHarvest = {};
    function harvestHtml(crop, idx) {
      return `
          <div class="hv" id="hv-${idx}" role="group" aria-label="Collita" inert>
            <div class="hv-c">
              <p class="hv-t"><span class="material-symbols-outlined" aria-hidden="true">agriculture</span>Collita</p>
              <p class="hv-s">Es mourà a l'Historial amb les seves notes.</p>
              <div class="qd-row">
                <div class="of-field qty-field hv-qty" ${isLl(crop) ? 'hidden' : ''}>
                  <label class="of-label" for="hq-in-${idx}">Quantitat collida</label>
                  <button type="button" class="qty-btn" id="hq-minus-${idx}" aria-label="Una menys" aria-controls="hq-in-${idx}"
                    onpointerdown="stepHold(event, () => hqStep(${idx}, -1))" onclick="if (event.detail === 0) hqStep(${idx}, -1)"><span class="material-symbols-outlined">remove</span></button>
                  <input id="hq-in-${idx}" class="qty-in" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value=""
                    oninput="hqInput(${idx}, this)" onblur="hqPaint(${idx})">
                  <button type="button" class="qty-btn" aria-label="Una més" aria-controls="hq-in-${idx}"
                    onpointerdown="stepHold(event, () => hqStep(${idx}, 1))" onclick="if (event.detail === 0) hqStep(${idx}, 1)"><span class="material-symbols-outlined">add</span></button>
                </div>
                <div class="date-col">
                  <div class="of-field date-field">
                    <label class="of-label" for="hd-in-${idx}">Data de collita</label>
                    <span class="date-txt" id="hd-txt-${idx}" aria-hidden="true"></span>
                    <span class="material-symbols-outlined date-ic" aria-hidden="true">calendar_today</span>
                    <input id="hd-in-${idx}" class="date-in" type="date" value="" onchange="hdSet(${idx}, this.value)" onclick="dateOpenPicker(this)">
                  </div>
                </div>
              </div>
            </div>
          </div>`;
    }
    function hqPaint(idx) {
      const st = pmHarvest[idx]; if (!st) return;
      const inp = document.getElementById(`hq-in-${idx}`); if (inp && document.activeElement !== inp) inp.value = st.qty;
      const minus = document.getElementById(`hq-minus-${idx}`);
      if (minus) { if (st.qty <= 0) minus.setAttribute('aria-disabled', 'true'); else minus.removeAttribute('aria-disabled'); }
    }
    function hqStep(idx, d) {
      const st = pmHarvest[idx]; if (!st) return false;
      const next = Math.max(0, Math.min(9999, st.qty + d)); // 0 allowed: lost crop
      if (next === st.qty) return false;
      st.qty = next;
      const inp = document.getElementById(`hq-in-${idx}`); if (inp) inp.value = next;
      hqPaint(idx); return true;
    }
    function hqInput(idx, el) {
      const st = pmHarvest[idx]; if (!st) return;
      const digits = el.value.replace(/\D/g, '').slice(0, 4);
      if (digits !== el.value) el.value = digits;
      st.qty = digits === '' ? 0 : parseInt(digits, 10);
      hqPaint(idx);
    }
    function hdPaint(idx) {
      const st = pmHarvest[idx]; if (!st) return;
      const t = document.getElementById(`hd-txt-${idx}`); if (t) t.textContent = fmtDateCa(st.date);
      const inp = document.getElementById(`hd-in-${idx}`); if (inp && inp.value !== st.date) inp.value = st.date;
    }
    function hdSet(idx, val) { const st = pmHarvest[idx]; if (!st) return; if (val) st.date = val; hdPaint(idx); }

    function setHarvesting(item, idx, on, moveFocus) {
      if (!item) return;
      const hv = item.querySelector('.hv'), main = item.querySelector('.pc-main');
      const toggle = item.querySelector('.pc-harvest'), del = item.querySelector('.pc-delete'), ok = item.querySelector('.hv-confirm');
      if (on) {
        // Ripple origin = centre of the Collir button; radius reaches the farthest corner of the card body
        const hr = hv.getBoundingClientRect(), br = toggle.getBoundingClientRect();
        const x = br.left + br.width / 2 - hr.left, y = br.top + br.height / 2 - hr.top;
        hv.style.setProperty('--hv-x', x + 'px'); hv.style.setProperty('--hv-y', y + 'px');
        hv.style.setProperty('--hv-r', (Math.hypot(Math.max(x, hr.width - x), Math.max(y, hr.height - y)) + 8) + 'px');
      }
      item.classList.toggle('harvesting', on);
      hv.inert = !on; main.inert = on;
      toggle.setAttribute('aria-expanded', on);
      toggle.querySelector('.hv-a').setAttribute('aria-hidden', on); toggle.querySelector('.hv-b').setAttribute('aria-hidden', !on);
      del.inert = on;
      ok.tabIndex = on ? 0 : -1; ok.setAttribute('aria-hidden', !on);
      if (!on) delete pmHarvest[idx];
      if (moveFocus) setTimeout(() => {
        if (on) { const q = document.getElementById(`hq-in-${idx}`); if (q) q.focus({ preventScroll: true }); }
        else toggle.focus({ preventScroll: true });
      }, on ? 350 : 0);
    }
    function toggleHarvest(idx) {
      const item = document.querySelector(`#modal-crops-container .pc-item[data-i="${idx}"]`); if (!item) return;
      const on = !item.classList.contains('harvesting');
      if (on) {
        const crop = currentCropsWorkingCopy[idx];
        if (!crop || !crop.plantName || !crop.plantName.trim()) { alertBox('Tria primer una planta abans de collir.'); return; }
        document.querySelectorAll('#modal-crops-container .pc-item.harvesting').forEach(it => { if (it !== item) setHarvesting(it, +it.dataset.i, false); });
        pmHarvest[idx] = { qty: parseInt(crop.plantQty, 10) || 1, date: isoLocalDate(new Date()) };
        hqPaint(idx); hdPaint(idx);
      }
      setHarvesting(item, idx, on, true);
    }
    function confirmHarvestInline(idx) {
      const crop = currentCropsWorkingCopy[idx], st = pmHarvest[idx];
      if (!crop || !st) return;
      const ll = isLl(crop); // llavors: no quantities, just the dates (and flag)
      appData.history.push({
        id: Date.now() + Math.random(),
        plantName: crop.plantName,
        plantQty: ll ? '' : crop.plantQty,
        plantDate: crop.plantDate || isoLocalDate(new Date()),
        harvestDate: st.date,
        harvestQty: ll ? '' : String(st.qty),
        ...(ll ? { llavors: true } : {}),
        emoji: crop.emoji || getPlantEmoji(crop.plantName),
        notes: crop.notes ? JSON.parse(JSON.stringify(crop.notes)) : []
      });
      // Remove only this planting from the saved data (other unsaved edits stay pending until Desar / Cancel·lar)
      const key = activeSideKey;
      const oldCrops = JSON.parse(JSON.stringify(appData.cellSides[key] || []));
      if (crop.__orig) {
        const rest = (appData.cellSides[key] || []).filter(c => c !== crop.__orig);
        if (rest.length) appData.cellSides[key] = rest; else delete appData.cellSides[key];
      }
      saveData();
      renderGridAfterEdit(key, oldCrops);
      delete pmHarvest[idx];
      removeCropBlock(idx, { silent: true });
      showSnackbar(`«${crop.plantName}» s'ha mogut a l'Historial`);
    }
    function qtyInput(idx, el) {
      if (isLl(currentCropsWorkingCopy[idx])) return;
      const digits = el.value.replace(/\D/g, '').slice(0, 4);
      if (digits !== el.value) el.value = digits;
      const n = parseInt(digits, 10);
      if (n >= 1) { updateCropField(idx, 'plantQty', String(n)); qtyPaint(idx); }
    }
    function qtyBlur(idx, el) {
      if (isLl(currentCropsWorkingCopy[idx])) return;
      const n = parseInt(el.value, 10);
      if (!(n >= 1)) { updateCropField(idx, 'plantQty', '1'); }
      el.value = parseInt(currentCropsWorkingCopy[idx].plantQty, 10) || 1;
      qtyPaint(idx);
    }
    function datePaint(idx) {
      const iso = currentCropsWorkingCopy[idx].plantDate || '';
      const t = document.getElementById(`date-txt-${idx}`); if (t) t.textContent = fmtDateCa(iso) || 'Sense data';
      const inp = document.getElementById(`date-in-${idx}`); if (inp && inp.value !== iso) inp.value = iso;
    }
    function dateSet(idx, val) {
      if (!val) return datePaint(idx); // clearing the native picker keeps the previous date
      updateCropField(idx, 'plantDate', val);
      datePaint(idx);
    }
    function dateOpenPicker(el) {
      // Desktop browsers only open the calendar from the small icon; open it from anywhere in the field
      if (window.matchMedia('(pointer: fine)').matches && typeof el.showPicker === 'function') { try { el.showPicker(); } catch (e) {} }
    }

    // ===== Plants in the side: expandable list (one card open at a time) =====
    // A card is open by default (first card on opening, the new card when adding one);
    // everything is collapsed only when the user collapses the open card themselves.
    let pmOpenIdx = 0;
    const CA_MONTHS = ['gen', 'febr', 'març', 'abr', 'maig', 'juny', 'jul', 'ag', 'set', 'oct', 'nov', 'des'];
    function cropSummary(crop) {
      const q = parseInt(crop.plantQty, 10) || 1;
      let txt = isLl(crop) ? 'Llavors' : `${q} ${q === 1 ? 'unitat' : 'unitats'}`;
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(crop.plantDate || '');
      if (m) txt += ` · plantat ${+m[3]} ${CA_MONTHS[+m[2] - 1]}`;
      return txt;
    }
    function setCropItemOpen(item, on) {
      const body = item.querySelector('.pc-body');
      item.querySelector('.pc-head').setAttribute('aria-expanded', on);
      if (on) {
        item.classList.add('open');
        const done = e => { if (e.target !== body) return; body.removeEventListener('transitionend', done); if (item.classList.contains('open')) item.classList.add('settled'); };
        body.addEventListener('transitionend', done);
      } else {
        if (item.classList.contains('harvesting')) setHarvesting(item, +item.dataset.i, false);
        item.classList.remove('settled');
        item.querySelectorAll('.pp-menu.open').forEach(m => ppClose(+m.dataset.menu));
        requestAnimationFrame(() => item.classList.remove('open'));
      }
    }
    function toggleCropItem(idx) {
      pmOpenIdx = (pmOpenIdx === idx) ? -1 : idx;
      document.querySelectorAll('#modal-crops-container .pc-item').forEach(item => {
        const on = +item.dataset.i === pmOpenIdx;
        if (on !== item.classList.contains('open')) setCropItemOpen(item, on);
      });
      if (pmOpenIdx >= 0) {
        const it = document.querySelector(`#modal-crops-container .pc-item[data-i="${pmOpenIdx}"]`);
        setTimeout(() => it && it.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 320);
      }
    }



    // ===== Notes (T3): timeline, newest first. Stored oldest → newest as before ({ text, date }). =====
    let ntShowAll = {};
    const NT_SHOW = 3;
    function noteWhen(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      if (!m) return escHtml(iso || '');
      const y = +m[1], mo = +m[2], d = +m[3];
      const then = new Date(y, mo - 1, d), now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((now - then) / 864e5);
      const date = `${d} ${CA_MONTHS[mo - 1]}${y !== now.getFullYear() ? ' ' + y : ''}`;
      if (diff === 0) return `<b>Avui</b> · ${date}`;
      if (diff === 1) return `<b>Ahir</b> · ${date}`;
      if (diff > 1 && diff < 7) return `<b>Fa ${diff} dies</b> · ${date}`;
      return date;
    }
    function notesListHtml(crop, idx, newIdx) {
      const notes = crop.notes || [];
      if (!notes.length) return `<div class="nt-empty"><span class="material-symbols-outlined" aria-hidden="true">edit_note</span>Encara no hi ha notes per a aquest cultiu.</div>`;
      const order = notes.map((n, i) => i).reverse();
      const visible = ntShowAll[idx] ? order : order.slice(0, NT_SHOW);
      let html = `<ol class="nt-tl">` + visible.map((i, k) => `
        <li class="nt-item${k === 0 ? ' latest' : ''}${i === newIdx ? ' in' : ''}" data-n="${i}">
          <span class="nt-dot" aria-hidden="true"></span>
          <div class="nt-when">${noteWhen(notes[i].date)}</div>
          <div class="nt-txt">${escHtml(notes[i].text)}</div>
          <button type="button" class="nt-del" onclick="removeNoteFromCrop(${idx}, ${i}, this)" aria-label="Eliminar la nota"><span class="material-symbols-outlined">delete</span></button>
        </li>`).join('') + `</ol>`;
      if (notes.length > NT_SHOW) {
        html += `<button type="button" class="nt-more${ntShowAll[idx] ? ' open' : ''}" onclick="toggleAllNotes(${idx})" aria-expanded="${!!ntShowAll[idx]}">
          <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>${ntShowAll[idx] ? "Mostra'n menys" : `Mostra'n ${notes.length - NT_SHOW} més`}</button>`;
      }
      return html;
    }
    function notesSectionHtml(crop, idx) {
      const n = (crop.notes || []).length;
      return `
          <h4 class="nt-h" id="nt-h-${idx}">Notes <span class="nt-count" id="nt-count-${idx}">${n ? '· ' + n : ''}</span></h4>
          <div class="nt-composer">
            <textarea id="note-input-${idx}" rows="1" placeholder="Afegeix una nota…" aria-label="Nova nota"
              oninput="noteInputSync(${idx})" onkeydown="if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); addNoteToCrop(${idx}); }"></textarea>
            <button type="button" class="nt-send" id="note-send-${idx}" onclick="addNoteToCrop(${idx})" aria-label="Afegir la nota" disabled><span class="material-symbols-outlined">arrow_forward</span></button>
          </div>
          <div id="nt-list-${idx}">${notesListHtml(crop, idx)}</div>`;
    }
    function notesRefresh(idx, newIdx) {
      const crop = currentCropsWorkingCopy[idx]; if (!crop) return;
      const list = document.getElementById(`nt-list-${idx}`); if (list) list.innerHTML = notesListHtml(crop, idx, newIdx);
      const c = document.getElementById(`nt-count-${idx}`); const n = (crop.notes || []).length; if (c) c.textContent = n ? '· ' + n : '';
    }
    function noteInputSync(idx) {
      const ta = document.getElementById(`note-input-${idx}`), send = document.getElementById(`note-send-${idx}`);
      if (!ta) return;
      ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 144) + 'px';
      const ok = ta.value.trim().length > 0;
      if (send) { send.disabled = !ok; send.classList.toggle('ready', ok); }
    }
    // Touch screens: tapping a note shows its bin (one at a time); tapping it again or anywhere else hides it
    document.addEventListener('click', e => {
      if (!window.matchMedia('(hover: none)').matches) return;
      if (e.target.closest('.nt-del')) return;
      const item = e.target.closest('#modal-crops-container .nt-item');
      document.querySelectorAll('#modal-crops-container .nt-item.show-del').forEach(it => { if (it !== item) it.classList.remove('show-del'); });
      if (item) item.classList.toggle('show-del');
    });
    function toggleAllNotes(idx) { ntShowAll[idx] = !ntShowAll[idx]; notesRefresh(idx); }

    function addNoteToCrop(idx) {
      const input = document.getElementById(`note-input-${idx}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;

      if (!currentCropsWorkingCopy[idx].notes) {
        currentCropsWorkingCopy[idx].notes = [];
      }
      currentCropsWorkingCopy[idx].notes.push({
        text: val,
        date: isoLocalDate(new Date())
      });
      input.value = '';
      noteInputSync(idx);
      notesRefresh(idx, currentCropsWorkingCopy[idx].notes.length - 1);
    }

    function removeNoteFromCrop(cropIdx, noteIdx, btn) {
      const crop = currentCropsWorkingCopy[cropIdx];
      if (!crop || !crop.notes) return;
      const li = btn && btn.closest('.nt-item');
      const done = () => { crop.notes.splice(noteIdx, 1); notesRefresh(cropIdx); };
      if (li) { li.classList.add('out'); setTimeout(done, 280); } else done();
    }

    function saveCellCropsSilently() {
      const validCrops = currentCropsWorkingCopy.filter(c => c.plantName && c.plantName.trim() !== '');
      if (validCrops.length > 0) {
        appData.cellSides[activeSideKey] = validCrops;
      } else {
        delete appData.cellSides[activeSideKey];
      }
      saveData();
    }



    function updateCropField(idx, field, val) {
      currentCropsWorkingCopy[idx][field] = val;
      const sup = document.getElementById(`crop-sup-${idx}`);
      if (sup) sup.textContent = cropSummary(currentCropsWorkingCopy[idx]);
    }

    function addCropBlock() {
      currentCropsWorkingCopy.push(createNewCropObject());
      const newIdx = currentCropsWorkingCopy.length - 1;
      renderModalCrops();            // keeps the currently open card open…
      pmAnimateEnter(newIdx, true);  // …then the new card grows in open and the old one closes
    }

    // Delete a plant card; "Desfer" in the snackbar puts it back (only while the same editor is still open)
    let pmSession = 0, pmUndoPending = false;
    function removeCropBlock(idx, opts = {}) {
      const removed = currentCropsWorkingCopy.splice(idx, 1)[0];
      const wasOpen = pmOpenIdx === idx;
      let addedBlank = false;
      if (currentCropsWorkingCopy.length === 0) {
        currentCropsWorkingCopy.push(createNewCropObject());
        addedBlank = true;
      }
      if (!opts.silent && removed && removed.plantName) {
        const session = pmSession;
        pmUndoPending = true;
        showSnackbar(`S'ha eliminat «${removed.plantName}»`, 'Desfer', () => {
          pmUndoPending = false;
          if (session !== pmSession || !pmIsOpen()) return;
          const blank = currentCropsWorkingCopy[0];
          if (addedBlank && currentCropsWorkingCopy.length === 1 && blank && !blank.plantName) currentCropsWorkingCopy.length = 0;
          const at = Math.min(idx, currentCropsWorkingCopy.length);
          currentCropsWorkingCopy.splice(at, 0, removed);
          if (!currentCropsWorkingCopy.some((c, k) => k !== at && !c.plantName) && currentCropsWorkingCopy.length === 1) { pmOpenIdx = 0; renderModalCrops(); return; }
          if (pmOpenIdx >= at) pmOpenIdx++;
          renderModalCrops();
          pmAnimateEnter(at);
        });
      }
      // Removing the open card opens its neighbour; otherwise keep the same card open
      if (pmOpenIdx === idx) pmOpenIdx = Math.min(idx, currentCropsWorkingCopy.length - 1);
      else if (pmOpenIdx > idx) pmOpenIdx--;
      const list = document.getElementById('modal-crops-container');
      const w = list.children[idx];
      if (!w || addedBlank) { renderModalCrops(); return; }
      // Fade + shrink the card, close the gap, open the neighbour; re-render (indices) once everything has settled
      list.style.pointerEvents = 'none';
      w.querySelectorAll('.pp-menu.open').forEach(m => m.classList.remove('open'));
      w.classList.add('pc-anim', 'leaving');
      const openTarget = pmOpenIdx;
      if (wasOpen && openTarget >= 0) {
        pmListTimers.push(setTimeout(() => { const nb = list.children[openTarget >= idx ? openTarget + 1 : openTarget]; if (nb && nb !== w) setCropItemOpen(nb.querySelector('.pc-item'), true); }, 120));
      }
      pmListTimers.push(setTimeout(() => {
        w.remove();
        pmListTimers.push(setTimeout(() => renderModalCrops(), 520));
      }, 480));
    }

    function closeModal() {
      if (pmUndoPending) { pmUndoPending = false; clearTimeout(snackTimer); document.getElementById('snackbar-host').innerHTML = ''; }
      pmSession++;
      pmClose();
      activeSideKey = null;
      const sel = [...document.querySelectorAll('.side-spot.slot-selected')];
      setTimeout(() => sel.forEach(el => { if (el.dataset.sideKey !== activeSideKey) el.classList.remove('slot-selected'); }), 250);
    }

    function saveCellCrops() {
      const editedKey = activeSideKey;
      const oldCrops = JSON.parse(JSON.stringify(appData.cellSides[editedKey] || []));
      currentCropsWorkingCopy.forEach((c, idx) => {
        const input = document.getElementById(`note-input-${idx}`);
        if (input && input.value.trim() !== '') {
          if (!c.notes) c.notes = [];
          c.notes.push({
            text: input.value.trim(),
            date: isoLocalDate(new Date())
          });
        }
      });

      const validCrops = currentCropsWorkingCopy.filter(c => c.plantName && c.plantName.trim() !== '');
      
      if (validCrops.length > 0) {
        appData.cellSides[activeSideKey] = validCrops;
      } else {
        delete appData.cellSides[activeSideKey];
      }

      saveData();
      closeModal();
      renderGridAfterEdit(editedKey, oldCrops);
      alertBox('Canvis desats');
    }

    function getPlantEmoji(name) {
      const lower = (name || '').toLowerCase();
      if (lower.includes('tomàquet')) return '🍅';
      if (lower.includes('ceba')) return '🧅';
      if (lower.includes('porros') || lower.includes('porro')) return '🌿';
      if (lower.includes('col')) return '🥬';
      if (lower.includes('espinac')) return '🍃';
      if (lower.includes('api')) return '🌱';
      if (lower.includes('julivert')) return '🌿';
      if (lower.includes('bleda')) return '🥬';
      if (lower.includes('carbassó')) return '🥒';
      return '🌱';
    }

    function renderSummaryView() {
      const host = document.getElementById('summary-content');
      const counts = {}, emojis = {}, dates = {}, llavors = new Map(); // llavors: plant name → emoji (sown seeds currently in the grid)
      let total = 0, oldestCrop = null, latestCrop = null;
      Object.values(appData.cellSides).forEach(list => (list || []).forEach(crop => {
        if (!crop || !crop.plantName) return;
        if (isLl(crop)) { const ln = nmTrim(crop.plantName); if (ln && !llavors.has(ln)) llavors.set(ln, crop.emoji || getPlantEmoji(ln)); return; } // not counted as units
        const n = crop.plantName, qty = parseInt(crop.plantQty, 10) || 1;
        counts[n] = (counts[n] || 0) + qty; total += qty;
        if (!emojis[n]) emojis[n] = crop.emoji || getPlantEmoji(n);
        if (crop.plantDate) {
          (dates[n] || (dates[n] = new Set())).add(crop.plantDate);
          if (!oldestCrop || crop.plantDate < oldestCrop.plantDate) oldestCrop = crop;
          if (!latestCrop || crop.plantDate > latestCrop.plantDate) latestCrop = crop;
        }
      }));

      document.getElementById('summary-hero-label').textContent = total === 1 ? 'unitat plantada' : 'unitats plantades';
      const crops = Object.entries(counts).map(([name, qty]) => ({ name, qty, cat: catOf(name) })).sort((a, b) => b.qty - a.qty);
      const pct = q => total > 0 ? Math.round(q / total * 100) : 0;

      // Most popular category = most units planted; ties → first in the fixed order; plants without one don't count
      let top = null;
      CATS.forEach(c => { const q = crops.filter(x => x.cat === c.id).reduce((a, x) => a + x.qty, 0); if (q > 0 && (!top || q > top.q)) top = { ...c, q }; });
      renderSummaryStats(crops.length, top, top ? pct(top.q) : 0, oldestCrop, latestCrop, llavors);
      countUp(document.getElementById('summary-hero-number'), total);

      if (!crops.length && llavors.size) { host.innerHTML = ''; playSummaryEntrance(); return; } // only llavors planted: the Llavors card says it
      if (!crops.length) {
        host.innerHTML = `<div class="hx-empty"><span class="material-symbols-outlined" aria-hidden="true">potted_plant</span>
          <h3>Encara no has plantat res</h3><p>Fes clic a una cel·la del plànol per començar a plantar.</p>
          <button type="button" class="hx-btn" onclick="switchView('grid')"><span class="material-symbols-outlined" aria-hidden="true">grid_view</span>Anar al Plànol</button></div>`;
        playSummaryEntrance();
        return;
      }
      const card = c => `<div class="rc">
          <span class="rc-av" aria-hidden="true"><span>${escHtml(emojis[c.name])}</span></span>
          <div class="rc-t"><span class="rc-n">${escHtml(c.name)}</span>
            <span class="rc-s">${plantingDatesLabel(dates[c.name] ? [...dates[c.name]].sort() : [])}</span>
            <span class="rc-s">${pct(c.qty)}% de l'hort</span></div>
          <div class="rc-q"><span class="rc-num">${c.qty}</span><span class="rc-u">${c.qty === 1 ? 'unitat' : 'unitats'}</span></div>
        </div>`;
      // Groups in the fixed category order, "Sense categoria" last, empty ones hidden; no headings while nothing has a category
      if (!crops.some(c => c.cat)) host.innerHTML = `<div class="rg-grid">${crops.map(card).join('')}</div>`;
      else host.innerHTML = [...CATS, { ...CAT_NONE, id: '' }].map(g => {
        const list = crops.filter(c => c.cat === g.id); if (!list.length) return '';
        return `<section class="rg" aria-label="${g.label}"><h3 class="rg-h"><span class="material-symbols-outlined" aria-hidden="true">${g.icon}</span>${g.label}</h3>
          <div class="rg-grid">${list.map(card).join('')}</div></section>`;
      }).join('');
      playSummaryEntrance();
    }

    // ===== Resum entrance motion (visual only) =====
    let countUpFrame = null;
    function countUp(el, target) {
      if (!el) return;
      cancelAnimationFrame(countUpFrame);
      const duration = 800, start = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3);
      const tick = now => {
        const t = Math.min(1, (now - start) / duration);
        el.textContent = Math.round(target * ease(t));
        if (t < 1) countUpFrame = requestAnimationFrame(tick);
      };
      if (target <= 0) { el.textContent = target; return; }
      countUpFrame = requestAnimationFrame(tick);
    }

    function playSummaryEntrance() {
      const items = [
        document.getElementById('summary-hero'),
        ...document.querySelectorAll('#summary-stats > .rt'),
        document.getElementById('summary-divider'),
        ...document.querySelectorAll('#summary-content .rg-h, #summary-content .rc, #summary-content .hx-empty')
      ].filter(Boolean);
      items.forEach((el, i) => {
        el.classList.remove('enter-rise');
        void el.offsetWidth; // restart the animation on elements that stay in the page
        el.style.setProperty('--i', Math.min(i, 12));
        el.classList.add('enter-rise');
      });
    }

    // M3 Expressive "Cookie 9-sided" shape behind every cookie avatar (Resum crop cards, Planter). Same lobe profile as the old 12-sided one.

    // Display-only planting-date text for a crop card
    function plantingDatesLabel(dates) {
      if (!dates || dates.length === 0) return 'Sense data de plantació';
      const thisYear = new Date().getFullYear();
      const parse = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
      const years = [...new Set(dates.map(d => parse(d).getFullYear()))];
      const oneYear = years.length === 1;
      const yearSuffix = oneYear && years[0] !== thisYear ? ` del ${years[0]}` : '';
      const dayMonth = iso => oneYear
        ? new Intl.DateTimeFormat('ca', { day: 'numeric', month: 'long' }).format(parse(iso))
        : formatDateCa(iso);
      const el = txt => /^(1|11) /.test(txt) ? `l’${txt}` : `el ${txt}`; // l’1 de juny, l’11 de març
      if (dates.length === 1) return `Plantat ${el(dayMonth(dates[0]))}${yearSuffix}`;
      if (dates.length === 2) return `Plantat ${el(dayMonth(dates[0]))} i ${el(dayMonth(dates[1]))}${yearSuffix}`;
      // 3 or more: "3 plantacions · de març a maig"
      const monthName = iso => new Intl.DateTimeFormat('ca', { month: 'long' }).format(parse(iso));
      const withYear = iso => oneYear ? monthName(iso) : `${monthName(iso)} ${parse(iso).getFullYear()}`;
      const de = w => /^[aeiouàèéíòóú]/i.test(w) ? `d’${w}` : `de ${w}`;
      const first = withYear(dates[0]);
      const last = withYear(dates[dates.length - 1]);
      const range = first === last ? first : `${de(first)} a ${last}`;
      return `${dates.length} plantacions · ${range}${yearSuffix}`;
    }

    // Display-only: "2026-03-12" -> "12 de març de 2026"
    function formatDateCa(iso) {
      const [y, m, d] = (iso || '').split('-').map(Number);
      if (!y || !m || !d) return iso || '';
      return new Intl.DateTimeFormat('ca', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(y, m - 1, d));
    }

    // ===== Historial: one merged view. Plants sorted by their most recent harvest; a plant with several harvests
    // expands (table row / card) to show them, newest first; a plant with one harvest shows it directly.
    let histPrevKeys = new Set(), histAgg = [], histOpen = new Set(), histSingleName = null;

    // Filters: plant name (accents and case ignored) + planting-date range
    function historyFiltered(withLl) {
      const q = normTxt(document.getElementById('history-search').value);
      const start = document.getElementById('history-date-start').value;
      const end = document.getElementById('history-date-end').value;
      return (withLl ? (appData.history || []) : histUnits()).filter(item => {
        const pDate = item.plantDate || '';
        return normTxt(item.plantName).includes(q) && (!start || pDate >= start) && (!end || pDate <= end) && catPass(histCats, catOf(item.plantName));
      });
    }

    // "Netejar filtres" clears the search and both dates (approved behaviour change: it used to clear the dates only)
    function clearHistoryFilters() {
      document.getElementById('history-search').value = '';

      document.getElementById('history-date-end').value = '';
      histCats.clear();

    function hfSync() {
      const q = document.getElementById('history-search').value;
      document.getElementById('hf-search-clear').hidden = !q;
      let active = !!q.trim();
      ['start', 'end'].forEach(w => {
        const v = document.getElementById(`history-date-${w}`).value;

        f.classList.toggle('has-val', !!v);
        f.querySelector('.hf-dclear').hidden = !v;
        document.getElementById(`hf-${w}-txt`).textContent = v ? fmtDateCa(v) : 'Qualsevol';

      });
      if (histCats.size) active = true;
      document.getElementById('hf-clear-all').hidden = !active;
      document.getElementById('hf-clear-bar-w').hidden = !(active && currentView === 'history');
      return active;

    function successChip(pct) {
      const band = pct >= 80 ? ['sx-hi', 'trending_up'] : pct >= 50 ? ['sx-mid', 'trending_flat'] : ['sx-lo', 'trending_down'];
      return `<span class="sx ${band[0]}"><span class="material-symbols-outlined" aria-hidden="true">${band[1]}</span>${pct}%</span>`;
    }
    const hxQty = v => { const s = String(v ?? '').trim(); return s === '' ? '—' : escHtml(s); };
    const hxDate = iso => fmtDateCa(iso) || (iso ? escHtml(iso) : 'Sense data');
    const hxUnits = n => (parseFloat(n) === 1 ? 'unitat' : 'unitats');
    const hxNotesBtn = (count, onclick) => count
      ? `<button type="button" class="hx-np" onclick="${onclick}" title="Notes" aria-label="Veure ${count === 1 ? 'la nota' : `les ${count} notes`}"><span class="material-symbols-outlined" aria-hidden="true">sticky_note_2</span>${count}</button>`
      : '';
    // Weeks between planting and harvest (null when a date is missing or the order is wrong)
    const hxUtc = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
    function hxWeeks(it) {
      const a = hxUtc(it.plantDate), b = hxUtc(it.harvestDate);
      return a !== null && b !== null && b >= a ? (b - a) / 6048e5 : null;
    }
    function hxAvgWeeks(items) {
      const w = items.map(hxWeeks).filter(x => x !== null);
      return w.length ? w.reduce((a, c) => a + c, 0) / w.length : null;
    }
    const hxWk = w => String(Math.round(w)); // whole weeks
    const hxWkText = w => w === null ? '' : `${hxWk(w)} ${hxWk(w) === '1' ? 'setmana' : 'setmanes'} de cultiu`;
    // Phone-card line: one fact per row, two-tone (label in on-surface-variant, the number/date in on-surface via .hl-v)
    const hxLn = (icon, html) => `<span class="hl-sup">${html}</span>`;
    const hxV = t => `<b class="hl-v">${t}</b>`;
    const hxWkHtml = w => w === null ? '' : `${hxV(hxWk(w))} ${hxWk(w) === '1' ? 'setmana' : 'setmanes'} de cultiu`;

    // Groups the filtered harvests by plant name. Harvests newest first; plants by their most recent harvest.
    function historyGroups(filtered) {
      const order = new Map(appData.history.map((h, i) => [h, i]));
      const all = {};
      histUnits().forEach(h => { all[h.plantName] = (all[h.plantName] || 0) + 1; });
      const cmp = (a, b) => (b.harvestDate || '').localeCompare(a.harvestDate || '') || order.get(b) - order.get(a);
      const groups = {};
      filtered.forEach(item => {
        const name = item.plantName;
        if (!groups[name]) groups[name] = { plantName: name, harvestCount: 0, allCount: all[name] || 0, totalPlantQty: 0, totalHarvestQty: 0, notesCount: 0, items: [] };
        const g = groups[name];
        g.harvestCount++;
        g.totalPlantQty += parseFloat(item.plantQty) || 0;
        g.totalHarvestQty += parseFloat(item.harvestQty) || 0;
        g.notesCount += (item.notes || []).length;
        g.items.push(item);
      });
      const list = Object.values(groups);
      list.forEach(g => { g.items.sort(cmp); g.latest = g.items[0]; g.emoji = g.latest.emoji || getPlantEmoji(g.plantName); });
      return list.sort((a, b) => cmp(a.latest, b.latest));
    }

    // Llavors: one extra group at the bottom of the list ("Llavors"), one nested row per harvested sowing, plants A→Z (newest first within a plant)
    const LL_KEY = '§llavors';
    function llavorsGroup(items) {
      if (!items.length) return null;
      const order = new Map(appData.history.map((h, i) => [h, i]));
      const sorted = items.slice().sort((a, b) => nmTrim(a.plantName).localeCompare(nmTrim(b.plantName), 'ca') ||
        (b.harvestDate || '').localeCompare(a.harvestDate || '') || order.get(b) - order.get(a));
      const latest = items.reduce((m, h) => ((h.harvestDate || '') > (m.harvestDate || '') ? h : m), items[0]);
      return { plantName: LL_KEY, title: 'Llavors', isLl: true, emoji: '', harvestCount: items.length,
        allCount: appData.history.filter(isLl).length, notesCount: items.reduce((n, h) => n + (h.notes || []).length, 0), items: sorted, latest };
    }

    function renderHistoryTable() {
      histCatsPaint();
      const active = hfSync();
      const host = document.getElementById('history-results');
      const filtered = historyFiltered(true);
      const now = new Set();
      let k = 0;
      // Rows that weren't on screen before rise in (30ms apart, max 8 steps); rows already shown, or hidden, stay still
      const enter = (key, visible = true) => {
        now.add(key);
        if (!visible || fxQuiet || histPrevKeys.has(key)) return { cls: '', st: '' };
        return { cls: ' hr-in', st: ` style="--k:${Math.min(k++, 8)}"` };
      };
      let html = '';
      histAgg = [];

      if (!(appData.history || []).length) {
        histSingleName = null;
        html = `<div class="hx-empty"><span class="material-symbols-outlined" aria-hidden="true">agriculture</span>
          <h3>Encara no has collit res</h3><p>Quan cullis una planta al Plànol, apareixerà aquí.</p></div>`;
      } else if (!filtered.length) {
        histSingleName = null;
        html = `<div class="hx-empty"><span class="material-symbols-outlined" aria-hidden="true">search_off</span>
          <h3>Cap collita coincideix amb els filtres</h3><p>Prova amb un altre nom, unes altres dates o altres categories.</p>
          ${active ? `<button type="button" class="hx-btn" onclick="clearHistoryFilters()"><span class="material-symbols-outlined" aria-hidden="true">filter_alt_off</span>Netejar filtres</button>` : ''}</div>`;
      } else {
        histAgg = historyGroups(filtered.filter(h => !isLl(h)));
        // When the results come down to a single plant with several harvests, open it (once; the user can close it again)
        const only = histAgg.length === 1 && histAgg[0].items.length > 1 ? histAgg[0].plantName : null;
        if (only && only !== histSingleName) histOpen.add(only);
        histSingleName = only;
        const llGroup = llavorsGroup(filtered.filter(isLl));
        if (llGroup) histAgg.push(llGroup); // always last

        const pctOf = (p, h) => Math.round(((parseFloat(h) || 0) / (parseFloat(p) || 1)) * 100);
        const qtyU = v => { const t = hxQty(v); return t === '—' ? t : `${t} u.`; };
        const delBtn = (id, name) => `<button type="button" class="hx-del" onclick="deleteHistoryItem('${id}')" aria-label="Eliminar aquesta collita de «${name}»" title="Eliminar registre"><span class="material-symbols-outlined">delete</span></button>`;
        const dash = '<span class="hx-none" aria-label="Sense notes">—</span>';
        let rows = '', items = '';

        const wkCell = w => w === null ? '<span class="hx-none">—</span>' : hxWk(w);
        histAgg.forEach((g, gi) => {
          const name = escHtml(g.title || g.plantName || '');
          if (g.isLl) {
            // Llavors group: no Plantat / Collit / Èxit numbers, only the average weeks and the notes
            const open = histOpen.has(g.plantName), e = enter('g' + g.plantName), gw = hxAvgWeeks(g.items);
            const gNotes = hxNotesBtn(g.notesCount, `openHistoryGroupNotes(${gi}, this)`);
            const n = g.harvestCount, count = n < g.allCount ? `${n} de ${g.allCount} collites` : `${n} ${n === 1 ? 'collita' : 'collites'}`;
            const last = hnShortDate(g.latest.harvestDate);
            const lAv = '<span class="material-symbols-outlined" aria-hidden="true">grain</span>';
            rows += `<tr class="ht-grp${open ? ' hg-open' : ''}${e.cls}"${e.st} data-g="${gi}" data-k="g${g.plantName}" onclick="hxRowToggle(event, ${gi})">
              <td><div class="ht-plant"><button type="button" class="hx-chev" onclick="toggleHistGroup(${gi})" aria-expanded="${open}" aria-label="Collites de llavors"><span class="material-symbols-outlined" aria-hidden="true">expand_more</span></button>
                <span class="ht-av" aria-hidden="true">${lAv}</span>
                <span class="ht-text"><span class="ht-name">Llavors</span><span class="ht-sub">${count} · última ${last}</span></span></div></td>
              <td class="n"></td><td class="n"></td><td class="n ht-num">${wkCell(gw)}</td><td class="c"></td>

            let entries = '';

              rows += `<tr class="ht-ch hr-row can-del${ce.cls}"${ce.st} data-hid="${id}" data-k="e${id}" data-gc="${gi}"${open ? '' : ' hidden'}>
                  <td><span class="ht-text"><span class="ht-name ht-ln">${em} ${pn}</span><span class="ht-sub">Plantat ${hnShortDate(it.plantDate)} · Collit ${hnShortDate(it.harvestDate)}</span></span></td>
                  <td class="n"></td><td class="n"></td><td class="n">${wkCell(w)}</td><td class="c"></td>

                </tr>`;
              entries += `<div class="he hr-row can-del${ce.cls}"${ce.st} data-hid="${id}">
