  <script>
    const ROWS = 4;
    let cols = 8;
    let activeSideKey = null;
    let currentView = 'grid';
    let railExpandedBeforeHistory = false;

    function setRailExpanded(expanded) {
      const rail = document.getElementById('desktop-nav-rail');
      if (!rail) return;
      rail.classList.toggle('expanded', expanded);
      document.getElementById('rail-menu-btn').setAttribute('aria-expanded', expanded);
    }

    function togglePlanolFabMenu(target) {
      const root = document.getElementById(target === 'mobile' ? 'planol-fab-menu-mobile' : 'planol-fab-menu-rail');
      if (!root) return;
      const willOpen = !root.classList.contains('is-open');
      closePlanolFabMenu();
      if (willOpen) {
        root.classList.add('is-open');
        const toggle = root.querySelector('[data-fab-toggle]');
        if (toggle) toggle.setAttribute('aria-expanded', 'true');
      }
    }

    function closePlanolFabMenu() {
      ['planol-fab-menu-mobile', 'planol-fab-menu-rail'].forEach(id => {
        const root = document.getElementById(id);
        if (!root) return;
        root.classList.remove('is-open');
        const toggle = root.querySelector('[data-fab-toggle]');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
      });
    }

    // ===== Standard button group press (M3 Expressive) =====
    // Pressed button grows 15%; each neighbour gives at most 8% of its width; the rest comes from the gaps,
    // so the group keeps its width and nothing around it moves. Resting widths are measured once, never mid-press.
    function initStdGroup(group) {
      if (!group) return;
      const btns = [...group.querySelectorAll(':scope > .gb')];
      const GROW = 0.15, NEIGHBOUR_MAX = 0.08;
      const gapRest = btns.map((b, i) => i === 0 ? 0 : (b.classList.contains('gb-pair') ? 4 : 12));
      const gapMin = btns.map((b, i) => i === 0 ? 0 : (b.classList.contains('gb-pair') ? 2 : 4));
      let nat = [];
      const measure = () => {
        if (group.classList.contains('pressing')) return;
        btns.forEach(b => { b.style.transition = 'none'; b.style.width = ''; b.style.marginLeft = ''; });
        nat = btns.map(b => Math.ceil(b.getBoundingClientRect().width));
        btns.forEach((b, i) => { b.style.width = nat[i] + 'px'; });
        void group.offsetWidth;
        btns.forEach(b => { b.style.transition = ''; });
      };
      const rest = () => btns.forEach((b, i) => { b.style.width = nat[i] + 'px'; b.style.marginLeft = ''; });
      btns.forEach((b, i) => {
        const down = () => {
          if (b.getAttribute('aria-disabled') === 'true' || !nat.length) return;
          const grow = nat[i] * GROW, L = btns[i - 1], R = btns[i + 1];
          let need = grow;
          const giveL = L ? Math.min(nat[i - 1] * NEIGHBOUR_MAX, need / (R ? 2 : 1)) : 0;
          const giveR = R ? Math.min(nat[i + 1] * NEIGHBOUR_MAX, need / (L ? 2 : 1)) : 0;
          need -= giveL + giveR;
          const gaps = [L ? i : null, R ? i + 1 : null].filter(x => x !== null);
          const gapGive = gaps.map(g => Math.min(gapRest[g] - gapMin[g], need / gaps.length));
          need -= gapGive.reduce((a, c) => a + c, 0);
          if (need > 0.1) gaps.forEach((g, k) => { const extra = Math.min(gapRest[g] - gapMin[g] - gapGive[k], need); gapGive[k] += extra; need -= extra; });
          group.classList.add('pressing'); b.classList.add('pressed');
          b.style.width = (nat[i] + grow - Math.max(0, need)) + 'px';
          if (L) L.style.width = (nat[i - 1] - giveL) + 'px';
          if (R) R.style.width = (nat[i + 1] - giveR) + 'px';
          gaps.forEach((g, k) => { btns[g].style.marginLeft = (gapRest[g] - gapGive[k]) + 'px'; });
        };
        const up = () => { if (!b.classList.contains('pressed')) return; group.classList.remove('pressing'); b.classList.remove('pressed'); rest(); };
        b.addEventListener('pointerdown', down);
        ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, up));
      });
      measure();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
      if ('ResizeObserver' in window) new ResizeObserver(measure).observe(group.parentElement);
      window.addEventListener('resize', measure);
    }
    document.addEventListener('DOMContentLoaded', () => initStdGroup(document.getElementById('planol-controls')));

    // Escape closes the import/export menu
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePlanolFabMenu(); });

    function triggerImport() {
      const importInput = document.getElementById('import-file');
      if (importInput) {
        importInput.click();
      }
      closePlanolFabMenu();
    }

    function initNavRail() {
      const rail = document.getElementById('desktop-nav-rail');
      if (!rail) return;
      if (window.innerWidth >= 1280) {
        rail.classList.add('expanded');
      } else {

      document.getElementById('rail-menu-btn').setAttribute('aria-expanded', rail.classList.contains('expanded'));
    }

    function toggleRail() {
      const rail = document.getElementById('desktop-nav-rail');
      if (!rail) return;
      rail.classList.toggle('expanded');
      document.getElementById('rail-menu-btn').setAttribute('aria-expanded', rail.classList.contains('expanded'));
    }

    const PRESET_PLANTS = [
      "Porros", "Col de Saboya / Savoy", "Col Manresana", "Espinacs",
      "Api", "Julivert", "Bledes", "Fulla de Roure Vermell",
      "Francesca / Cogollos", "Carbassó", "Tomàquet", "Ceba"
    ];


    let appData = {
      cols: 8,
      cellSides: {},
      history: [],
      customPlants: [],
      paths: []
    };

    document.addEventListener('DOMContentLoaded', () => {
      initNavRail();
      loadSavedData();
      if (catEnsure()) saveData();
      initCookieMask();
      renderGrid();

      // Close FAB menus when clicking outside
      document.addEventListener('click', (e) => {
        const railMenu = document.getElementById('planol-fab-menu-rail');
        const mobileMenu = document.getElementById('planol-fab-menu-mobile');
        if (railMenu && !railMenu.contains(e.target) && mobileMenu && !mobileMenu.contains(e.target)) {
          closePlanolFabMenu();
        }
      });
    });

    let dataVer = 0; // bumps on every save; undo of a merge only applies if nothing changed since
    function saveData() {
      appData.cols = cols;
      dataVer++;
      // Older app versions read customPlants: keep it in step with the catalogue (every name that isn't a preset)
      if (Array.isArray(appData.plants)) appData.customPlants = appData.plants.map(p => p.name).filter(n => !PRESET_PLANTS.includes(n));
      localStorage.setItem('allotment_data_v10', JSON.stringify(appData));
    }


    // ===== Plant catalogue (item 17): appData.plants = [{ name, emoji }], keyed by name =====
    // Single source for names and emojis. Plantings and history keep storing plantName + emoji as before;
    // renames / emoji changes are written into them too, so old app versions still show the right thing.
    const nmTrim = x => String(x || '').trim();
    // Builds the catalogue for files that don't have one (presets + customPlants + every name in use; emoji = most
    // common stored emoji for that name, ties → most recent), and adds any name in use that the catalogue lacks.
    function catEnsure() {
      const fresh = !Array.isArray(appData.plants);
      const list = fresh ? [] : appData.plants.filter(p => p && nmTrim(p.name)).map(p => ({ ...p, name: nmTrim(p.name), emoji: p.emoji || getPlantEmoji(p.name) })); // keeps category
      const have = new Set(list.map(p => p.name)), added = [], votes = {};
      const add = n => { n = nmTrim(n); if (n && !have.has(n)) { have.add(n); added.push(n); } };
      const vote = (n, e, when) => {
        n = nmTrim(n); if (!n || !e) return;
        const m = votes[n] || (votes[n] = new Map()); const v = m.get(e) || { n: 0, last: '' };

      if (/ (julivert|alfabrega|farigol|romani|menta|orenga|coriandre|anet|cibulet|salvia|estrago|llorer|marduix|melissa)/.test(n)) return 'aroma';
      if (/ (mongeta|fesol|pesol|fava|faves|cigro|llentia|bajoca|tirabec|cacauet)/.test(n)) return 'llegum';
      if (/ (ceba|porro|all |alls |calcot|escalunya|pastanaga|patata|trumfa|rave|nap |naps |remolatxa|moniato|xirivia|fonoll|gingebre)/.test(n)) return 'arrel';
      if (/ (tomaquet|carbass|pebrot|albergini|cogombre|melo|sindria|maduix|blat de moro|bitxo)/.test(n)) return 'fruit';
      if (/ (enciam|lletuga|espinac|bled|col |cols |kale|api |ruca|escarola|endivi|cogoll|francesca|fulla|cabdell|canonge|borratja|mostassa|xicoria)/.test(n)) return 'fulla';

    // ===== Filter motion (item 20). fxFilter(host, futureKeys, rerender):
    // 1) cards whose key won't be shown fade + shrink (200ms, emphasized accelerate) while the rest stay put;
    // 2) the page re-renders; cards still shown glide from their old place to the new one (FLIP, 500ms, emphasized decelerate);
    // 3) cards coming back fade + grow in (400ms, after the move starts). Keys: data-k on rows / cards.
    // A second tap while it runs finishes the first one at once and starts again from there.
    let fxQuiet = false, fxPending = null;
    const fxEase = () => getComputedStyle(document.documentElement).getPropertyValue('--md-sys-motion-easing-emphasized-decelerate').trim() || 'ease-out';
    const fxVisible = host => [...host.querySelectorAll('[data-k]')].filter(el => el.getClientRects().length);
    function fxFilter(host, future, rerender) {
      if (fxPending) { clearTimeout(fxPending.t); fxPending.run(false); }
      const first = new Map(), els = fxVisible(host);
      els.forEach(el => first.set(el.dataset.k, el.getBoundingClientRect()));
      const leaving = els.filter(el => !future.has(el.dataset.k));
      leaving.forEach(el => el.classList.add('fx-out'));
      const job = {
        run(animate) {
          fxPending = null;
          fxQuiet = true; try { rerender(); } finally { fxQuiet = false; }
          if (!animate) return;
          const ease = fxEase(), ins = [];
          let moved = false;
          fxVisible(host).forEach(el => {
            const a = first.get(el.dataset.k);
            if (!a) { ins.push(el); return; }
            const b = el.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
            if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
            moved = true;
            el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 500, easing: ease });
          });
          ins.forEach((el, i) => el.animate([{ opacity: 0, transform: 'scale(0.92)' }, { opacity: 1, transform: 'none' }],
            { duration: 400, delay: (moved ? 150 : 0) + Math.min(i, 8) * 30, easing: ease, fill: 'backwards' }));
        }
      };
      job.t = setTimeout(() => job.run(true), leaving.length ? 200 : 0);
      fxPending = job;
    }

        sideEl.className = `side-spot ${crops.length > 0 ? 'planted' : ''} ${crops.length > 2 ? 'ovf' : ''} ${sideKey === activeSideKey ? 'slot-selected' : ''}`;
        sideEl.disabled = pathEditMode;

        const where = `Fila ${r + 1}, columna ${c + 1}, costat ${sideNames[side]}`;
        if (crops.length > 0) {
          const list = crops.map(cp => `${cp.plantName}: ${cp.plantQty}`).join(', ');
          sideEl.innerHTML = slotContent(crops);
          sideEl.title = list;
          sideEl.setAttribute('aria-label', `${where}: ${list}`);
        } else {
          sideEl.innerHTML = '<span class="slot-plus" aria-hidden="true">+</span>';
          sideEl.setAttribute('aria-label', `${where}: buit`);
        }

        sideEl.onclick = (e) => {
          e.stopPropagation();
          if (pathEditMode) return;
          openPlantModal(sideKey, r, c, side);
        };

        cell.appendChild(sideEl);
        if (i === 0) {
          const div = document.createElement('span');
          div.className = 'bed-divider';
          div.setAttribute('aria-hidden', 'true');
          cell.appendChild(div);
        }
      });
    }

    // After saving a slot: removed pills shrink away, then new/changed pills spring in
    function renderGridAfterEdit(key, oldCrops) {
      const newCrops = appData.cellSides[key] || [];
      const newSigs = newCrops.map(cropSig);
      const oldSigs = (oldCrops || []).map(cropSig);
      const half = document.querySelector(`.side-spot[data-side-key="${key}"]`);
      const leaving = half ? [...half.querySelectorAll('.crop-pill')].filter(p => {
        const i = newSigs.indexOf(p.dataset.sig);
        return i === -1;
      }) : [];
      const finish = () => {
        renderGrid();
        const h = document.querySelector(`.side-spot[data-side-key="${key}"]`);
        if (!h) return;
        const remaining = [...oldSigs];
        let k = 0;
        h.querySelectorAll('.crop-pill').forEach(p => {
          const idx = remaining.indexOf(p.dataset.sig);
          if (idx === -1) { p.style.setProperty('--k', k++); p.classList.add('pill-in'); }
          else remaining.splice(idx, 1);
        });
        h.querySelectorAll('.crop-more').forEach(m => { if (newCrops.length !== oldSigs.length) { m.style.setProperty('--k', k); m.classList.add('pill-in'); } });
      };
      if (leaving.length) {
        leaving.forEach(p => p.classList.add('pill-out'));
        setTimeout(finish, 300);
      } else {
        finish();
      }
    }

    let currentCropsWorkingCopy = [];

    function openPlantModal(sideKey, r, c, sideId) {
      activeSideKey = sideKey;
      document.querySelectorAll('.side-spot.slot-selected').forEach(el => el.classList.remove('slot-selected'));
      const slotEl = document.querySelector(`.side-spot[data-side-key="${sideKey}"]`);
      if (slotEl) slotEl.classList.add('slot-selected');
      document.getElementById('modal-title').textContent = 'Editar secció';
      pmReturnFocus = slotEl;

      const existing = appData.cellSides[sideKey] || [];
      currentCropsWorkingCopy = JSON.parse(JSON.stringify(existing));
      // Remember which saved planting each working copy comes from (not serialized), so a harvest can remove
      // exactly that planting from the saved data while the other unsaved edits stay pending until Desar
      currentCropsWorkingCopy.forEach((c, i) => Object.defineProperty(c, '__orig', { value: existing[i], enumerable: false, writable: true }));
      pmHarvest = {};
      if (currentCropsWorkingCopy.length === 0) {
        currentCropsWorkingCopy.push(createNewCropObject());
      }

      pmOpenIdx = 0;
      ntShowAll = {};
      pmSession++;
      renderModalCrops();
      pmOpen(slotEl);
    }

    // ===== Plant editor container: open/close, spotlight, page shift, Escape, focus trap =====
    const PM_WIDE = window.matchMedia('(min-width: 840px)');
    let pmReturnFocus = null, pmRaf = 0, pmStopTimer = 0;

    function pmTrack() {
      const slot = document.querySelector('.side-spot.slot-selected');
      const hole = document.getElementById('pm-hole');
      if (slot && hole) {
        const r = slot.getBoundingClientRect();
        hole.style.left = (r.left - 5) + 'px'; hole.style.top = (r.top - 5) + 'px';
        hole.style.width = (r.width + 10) + 'px'; hole.style.height = (r.height + 10) + 'px';
        if (hole.dataset.for !== slot.dataset.sideKey) {
          // Match the slot's own corners (4px inside a bed, 16px at the column ends) + the 5px margin
          const cs = getComputedStyle(slot);
          hole.style.borderRadius = ['borderTopLeftRadius', 'borderTopRightRadius', 'borderBottomRightRadius', 'borderBottomLeftRadius']
            .map(k => (parseFloat(cs[k]) || 0) + 5 + 'px').join(' ');
          hole.dataset.for = slot.dataset.sideKey;
        }
      }
      pmRaf = requestAnimationFrame(pmTrack);
    }

    // Larger screens: if the slot would sit under the sheet, slide the garden left (scroll first, then offset)
    function pmReveal(slot) {
      const g = document.getElementById('grid-container');
      g.classList.remove('pm-back'); g.style.left = '0px';
      if (!slot || !PM_WIDE.matches) return;
      const sheetLeft = window.innerWidth - 16 - 400 - 24;
      let over = slot.getBoundingClientRect().right + 5 - sheetLeft;
      if (over <= 0) return;
      const sc = g.closest('.grid-scroll');
      if (sc) {
        const room = sc.scrollWidth - sc.clientWidth - sc.scrollLeft;
        const by = Math.min(over, Math.max(0, room));
        if (by > 0) { sc.scrollBy({ left: by, behavior: 'smooth' }); over -= by; }
      }
      if (over > 0) g.style.left = (-over) + 'px';
    }

    function pmOpen(slot) {
      const m = document.getElementById('plant-modal');
      const panel = document.getElementById('pm-panel');
      const body = document.getElementById('pm-body');
      body.scrollTop = 0; panel.classList.remove('pm-scrolled');
      clearTimeout(pmStopTimer); cancelAnimationFrame(pmRaf); pmTrack();
      pmReveal(slot);
      m.inert = false;
      m.classList.add('pm-open');
      setTimeout(() => panel.focus({ preventScroll: true }), 30);
    }

    function pmIsOpen() { return document.getElementById('plant-modal').classList.contains('pm-open'); }

    function pmClose() {
      const m = document.getElementById('plant-modal');
      if (!m.classList.contains('pm-open')) return;
      m.classList.remove('pm-open');
      m.inert = true; // no taps, clicks or keyboard focus reach the closed editor
      const g = document.getElementById('grid-container');
      g.classList.add('pm-back'); g.style.left = '0px';
      pmStopTimer = setTimeout(() => { cancelAnimationFrame(pmRaf); pmRaf = 0; }, 350);
      const back = pmReturnFocus; pmReturnFocus = null;
      if (back && document.contains(back)) back.focus({ preventScroll: true });
    }

    (function initPlantEditor() {
      const catchEl = document.getElementById('pm-catch');
      catchEl.addEventListener('click', () => { if (PM_WIDE.matches) closeModal(); });
      // The page behind stays put while the editor is open
      ['wheel', 'touchmove'].forEach(t => catchEl.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.getElementById('pm-body').addEventListener('scroll', e =>
        document.getElementById('pm-panel').classList.toggle('pm-scrolled', e.target.scrollTop > 0), { passive: true });
      document.addEventListener('keydown', e => {
        if (!pmIsOpen()) return;
        if (e.key === 'Escape') {
          const hv = document.querySelector('#modal-crops-container .pc-item.harvesting');
          if (hv) { e.preventDefault(); setHarvesting(hv, +hv.dataset.i, false, true); return; }
          e.preventDefault(); closeModal();
        } else if (e.key === 'Tab') {
          const panel = document.getElementById('pm-panel');
          const f = [...panel.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])')]
            .filter(el => !el.disabled && el.offsetParent !== null && el.tabIndex >= 0 && !el.closest('[inert]'));
          if (!f.length) return;
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && (document.activeElement === first || document.activeElement === panel)) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
    })();

    function createNewCropObject() {
      return {
        plantName: '',
        plantQty: 1,
        plantDate: isoLocalDate(new Date()), // local date (toISOString gave yesterday/tomorrow near midnight)
        emoji: '🌱',
        notes: []
      };
    }

    let pmListTimers = [];
    function renderModalCrops() {
      const container = document.getElementById('modal-crops-container');
      pmListTimers.forEach(clearTimeout); pmListTimers = [];
      container.style.pointerEvents = '';
      container.innerHTML = '';

      if (pmOpenIdx >= currentCropsWorkingCopy.length) pmOpenIdx = currentCropsWorkingCopy.length - 1;
      container.className = 'pc-list';

      currentCropsWorkingCopy.forEach((crop, idx) => {
        const item = document.createElement('div');
        item.className = 'pc-item' + (idx === pmOpenIdx ? ' open settled' : '');
        item.dataset.i = idx;

        const currentEmoji = crop.emoji || getPlantEmoji(crop.plantName);

        item.innerHTML = `
          <button type="button" class="pc-head" onclick="toggleCropItem(${idx})" aria-expanded="${idx === pmOpenIdx}" aria-controls="pc-body-${idx}">
            <span class="pc-avatar" aria-hidden="true">${currentEmoji}</span>
            <span class="pc-text">
              <span class="pc-name">${crop.plantName ? escHtml(crop.plantName) : 'Nova planta'}</span>
              <span class="pc-sup" id="crop-sup-${idx}">${cropSummary(crop)}</span>
            </span>
            <span class="material-symbols-outlined pc-chev" aria-hidden="true">expand_more</span>
          </button>
          <div class="pc-body" id="pc-body-${idx}"><div><div class="pc-inner">
          <div class="pc-main">
          ${plantFieldHtml(crop, idx, currentEmoji)}

          ${qtyDateHtml(crop, idx)}

          <section class="nt" id="nt-${idx}" aria-labelledby="nt-h-${idx}">${notesSectionHtml(crop, idx)}</section>
          </div>
          ${harvestHtml(crop, idx)}
          <div class="pc-actions">
            <button type="button" class="m3-btn pc-harvest" id="hv-toggle-${idx}" onclick="toggleHarvest(${idx})" aria-expanded="false" aria-controls="hv-${idx}">
              <span class="hv-swap"><span class="hv-a"><span class="material-symbols-outlined" aria-hidden="true">agriculture</span>Collir</span><span class="hv-b" aria-hidden="true"><span class="material-symbols-outlined" aria-hidden="true">close</span>Cancel·la</span></span>
            </button>
            <div class="pc-right">
              <button type="button" class="pc-delete" onclick="removeCropBlock(${idx})" aria-label="Eliminar aquesta planta" title="Eliminar aquesta planta"><span class="material-symbols-outlined">delete</span></button>
              <button type="button" class="m3-btn pm-btn hv-confirm" onclick="confirmHarvestInline(${idx})" tabindex="-1" aria-hidden="true"><span class="material-symbols-outlined" aria-hidden="true">check</span>Confirma</button>
            </div>
          </div>
          </div></div></div>
        `;
        const wrap = document.createElement('div');
        wrap.className = 'pc-w';
        wrap.appendChild(item);
        container.appendChild(wrap);
      });
    }

    // New or restored card: grows in from zero height, already open, while the previously open card closes
    function pmAnimateEnter(idx, focusField) {
      const list = document.getElementById('modal-crops-container');
      const w = list.children[idx]; if (!w) return;
      const item = w.querySelector('.pc-item');
      list.querySelectorAll('.pc-item.open').forEach(it => { if (it !== item) setCropItemOpen(it, false); });
      w.classList.add('pc-anim', 'entering');
      item.classList.add('open'); item.classList.remove('settled');
      item.querySelector('.pc-head').setAttribute('aria-expanded', 'true');
      pmOpenIdx = idx;
      void w.offsetHeight;
      requestAnimationFrame(() => w.classList.remove('entering'));
      setTimeout(() => w.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 200);
      setTimeout(() => {
        w.classList.remove('pc-anim');
        if (item.classList.contains('open')) item.classList.add('settled');
        if (focusField) { const inp = item.querySelector('.pp-input'); if (inp) inp.focus({ preventScroll: true }); }
      }, 480);
    }

    // ===== Plant field (N1): M3 outlined text field + suggestions menu =====
    // Emoji is not picked here: it follows the plant name (getPlantEmoji). Plantings keep storing
    // plantName + emoji exactly as before, so old exports import unchanged.
    const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const normTxt = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    function plantFieldHtml(crop, idx, emoji) {
      return `
          <div class="pp-field" data-pp="${idx}">
            <div class="pp-box">
              <label class="pp-label" for="pp-in-${idx}">Planta</label>
              <span class="pp-emoji" aria-hidden="true">${emoji}</span>
              <input id="pp-in-${idx}" class="pp-input" data-pp-in="${idx}" value="${escHtml(crop.plantName || '')}" placeholder="Cerca o escriu una planta"
                role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="pp-menu-${idx}" autocomplete="off" autocapitalize="sentences" spellcheck="false">
              <button type="button" class="pp-arrow" data-pp-arr="${idx}" tabindex="-1" aria-label="Mostrar plantes"><span class="material-symbols-outlined">arrow_drop_down</span></button>
            </div>
            <div class="pp-menu" id="pp-menu-${idx}" data-menu="${idx}" role="listbox" aria-label="Plantes"></div>
          </div>`;
    }
    let ppItems = [], ppActive = -1;
    function ppHighlight(name, q) {
      if (!q) return escHtml(name);
      const i = normTxt(name).indexOf(normTxt(q));
      if (i < 0) return escHtml(name);
      return escHtml(name.slice(0, i)) + '<mark>' + escHtml(name.slice(i, i + q.trim().length)) + '</mark>' + escHtml(name.slice(i + q.trim().length));
    }
    function ppBuild(idx, query) {
      const menu = document.getElementById(`pp-menu-${idx}`); if (!menu) return;
      const cur = currentCropsWorkingCopy[idx].plantName || '';
      const q = (query || '').trim(), nq = normTxt(q);
      const match = n => !nq || normTxt(n).includes(nq);
      const all = catSortedNames();
      const shown = all.filter(match);
      const exact = all.some(n => normTxt(n) === nq);
      ppItems = [];
      let html = '';
      const row = n => {
        ppItems.push({ type: 'pick', name: n });
        const sel = n === cur;
        return `<button type="button" class="pp-mi" role="option" id="pp-opt-${idx}-${ppItems.length - 1}" data-k="${ppItems.length - 1}" aria-selected="${sel}">
          <span class="pp-e" aria-hidden="true">${escHtml(catEmoji(n))}</span><span class="pp-l">${ppHighlight(n, q)}</span>${sel ? '<span class="material-symbols-outlined pp-ck" aria-hidden="true">check</span>' : ''}</button>`;
      };
      if (shown.length) html += `<div class="pp-mh">Plantes</div>` + shown.map(row).join('');
      if (!shown.length) html += `<div class="pp-empty">Cap planta coincideix amb «${escHtml(q)}».</div>`;
      if (nq && !exact) {
        ppItems.push({ type: 'add', name: q });
        html += `<div class="pp-div"></div><button type="button" class="pp-mi pp-add" role="option" id="pp-opt-${idx}-${ppItems.length - 1}" data-k="${ppItems.length - 1}"><span class="material-symbols-outlined" aria-hidden="true">add</span><span class="pp-l">Afegir «${escHtml(q)}»</span></button>`;
      }
      menu.innerHTML = html;
      ppActive = nq ? 0 : ppItems.findIndex(it => it.name === cur);
      ppPaint(idx);
    }
    function ppPaint(idx) {
      const menu = document.getElementById(`pp-menu-${idx}`); if (!menu) return;
      menu.querySelectorAll('.pp-mi').forEach(b => b.classList.toggle('active', +b.dataset.k === ppActive));
      const inp = document.getElementById(`pp-in-${idx}`);
      const a = menu.querySelector(`.pp-mi[data-k="${ppActive}"]`);
      if (a) { a.scrollIntoView({ block: 'nearest' }); inp && inp.setAttribute('aria-activedescendant', a.id); }
      else if (inp) inp.removeAttribute('aria-activedescendant');
    }
    function ppOpen(idx) {
      const f = document.querySelector(`#modal-crops-container [data-pp="${idx}"]`); if (!f) return;
      const inp = f.querySelector('.pp-input');
      ppBuild(idx, inp.value === (currentCropsWorkingCopy[idx].plantName || '') ? '' : inp.value);
      f.classList.add('menu-open'); f.querySelector('.pp-menu').classList.add('open'); inp.setAttribute('aria-expanded', 'true');
      setTimeout(() => { const m = f.querySelector('.pp-menu'); if (m.classList.contains('open')) m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 60);
    }
    function ppClose(idx, restore = true) {
      const f = document.querySelector(`#modal-crops-container [data-pp="${idx}"]`); if (!f) return;
      f.classList.remove('menu-open'); f.querySelector('.pp-menu').classList.remove('open');
      const inp = f.querySelector('.pp-input');
      inp.setAttribute('aria-expanded', 'false'); inp.removeAttribute('aria-activedescendant');
      if (restore && currentCropsWorkingCopy[idx]) inp.value = currentCropsWorkingCopy[idx].plantName || '';
    }
    function ppChoose(idx, it) {
      if (!it || !currentCropsWorkingCopy[idx]) return;
      let name = it.name.trim();
      if (!name) return;
      if (it.type === 'add') {
        // Same behaviour as the old "Afegir personalitzada": saved to customPlants straight away
        // New plants go straight into the catalogue (near-duplicates reuse the existing name)
        const existing = (appData.plants || []).find(p => normTxt(p.name) === normTxt(name));
        if (existing) name = existing.name;
        else {
          if (!Array.isArray(appData.plants)) appData.plants = [];
          const np = { name, emoji: getPlantEmoji(name) }, sc = getPlantCategory(name);
          if (sc) np.category = sc; // suggested from the name; can be changed in Planter
          appData.plants.push(np);
          saveData();
          alertBox(`«${name}» s'ha afegit al planter`);
        }
      }
      const crop = currentCropsWorkingCopy[idx];
      crop.plantName = name;
      crop.emoji = catEmoji(name); // the catalogue decides the emoji
      const item = document.querySelector(`#modal-crops-container .pc-item[data-i="${idx}"]`);
      if (item) {
        item.querySelector('.pc-name').textContent = name;
        item.querySelector('.pc-avatar').textContent = crop.emoji;
        item.querySelector('.pp-emoji').textContent = crop.emoji;
      }
      ppClose(idx);
      const inp = document.getElementById(`pp-in-${idx}`); if (inp) inp.blur();
    }
    (function initPlantField() {
      const root = document.getElementById('modal-crops-container');
      root.addEventListener('mousedown', e => { if (e.target.closest('.pp-mi, .pp-arrow')) e.preventDefault(); });
      root.addEventListener('focusin', e => {
        const inp = e.target.closest('[data-pp-in]'); if (!inp) return;
        const idx = +inp.dataset.ppIn;
        inp.closest('.pp-field').classList.add('focus');
        ppOpen(idx); inp.select();
      });
      root.addEventListener('focusout', e => {
        const inp = e.target.closest('[data-pp-in]'); if (!inp) return;
        const idx = +inp.dataset.ppIn;
        inp.closest('.pp-field').classList.remove('focus');
        setTimeout(() => { if (document.activeElement !== inp) ppClose(idx); }, 120);
      });
      root.addEventListener('input', e => {
        const inp = e.target.closest('[data-pp-in]'); if (!inp) return;
        const idx = +inp.dataset.ppIn, f = inp.closest('.pp-field');
        if (!f.classList.contains('menu-open')) ppOpen(idx);
        ppBuild(idx, inp.value);
      });
      root.addEventListener('keydown', e => {
        const inp = e.target.closest('[data-pp-in]'); if (!inp) return;
        const idx = +inp.dataset.ppIn, f = inp.closest('.pp-field'), isOpen = f.classList.contains('menu-open');
        if (e.key === 'ArrowDown') { e.preventDefault(); if (!isOpen) ppOpen(idx); ppActive = Math.min(ppItems.length - 1, ppActive + 1); ppPaint(idx); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); if (isOpen) { ppActive = Math.max(0, ppActive - 1); ppPaint(idx); } }
        else if (e.key === 'Enter') { e.preventDefault(); if (isOpen && ppActive >= 0) ppChoose(idx, ppItems[ppActive]); }
        else if (e.key === 'Escape' && isOpen) { e.preventDefault(); e.stopPropagation(); ppClose(idx); }
      });
      root.addEventListener('click', e => {
        const mi = e.target.closest('.pp-mi');
        if (mi) { ppChoose(+mi.closest('.pp-menu').dataset.menu, ppItems[+mi.dataset.k]); return; }
        const ar = e.target.closest('[data-pp-arr]');
        if (ar) {
          const idx = +ar.dataset.ppArr, f = ar.closest('.pp-field');
          if (f.classList.contains('menu-open')) { ppClose(idx); document.getElementById(`pp-in-${idx}`).blur(); }
          else document.getElementById(`pp-in-${idx}`).focus();
        }
      });
    })();

    // ===== Quantity (Q1: − / + stepper field) and planting date (device date picker; new plantings default to today) =====
    function isoLocalDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
    function fmtDateCa(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      return m ? `${+m[3]} ${CA_MONTHS[+m[2] - 1]} ${m[1]}` : '';
    }
    function qtyDateHtml(crop, idx) {
      const q = parseInt(crop.plantQty, 10) || 1;
      return `
          <div class="qd-row">
            <div class="of-field qty-field">
              <label class="of-label" for="qty-in-${idx}">Quantitat</label>
              <button type="button" class="qty-btn" id="qty-minus-${idx}" aria-label="Una menys" aria-controls="qty-in-${idx}" ${q <= 1 ? 'aria-disabled="true"' : ''}
                onpointerdown="qtyHold(event, ${idx}, -1)" onclick="if (event.detail === 0) qtyStep(${idx}, -1)"><span class="material-symbols-outlined">remove</span></button>
              <input id="qty-in-${idx}" class="qty-in" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${q}"
                oninput="qtyInput(${idx}, this)" onblur="qtyBlur(${idx}, this)">
              <button type="button" class="qty-btn" aria-label="Una més" aria-controls="qty-in-${idx}"
                onpointerdown="qtyHold(event, ${idx}, 1)" onclick="if (event.detail === 0) qtyStep(${idx}, 1)"><span class="material-symbols-outlined">add</span></button>
            </div>
            <div class="date-col">
              <div class="of-field date-field">
                <label class="of-label" for="date-in-${idx}">Data de plantació</label>
                <span class="date-txt" id="date-txt-${idx}" aria-hidden="true">${fmtDateCa(crop.plantDate) || 'Sense data'}</span>
                <span class="material-symbols-outlined date-ic" aria-hidden="true">calendar_today</span>
                <input id="date-in-${idx}" class="date-in" type="date" value="${escHtml(crop.plantDate || '')}"
                  onchange="dateSet(${idx}, this.value)" onclick="dateOpenPicker(this)">
              </div>
            </div>
          </div>`;
    }
    function qtyPaint(idx) {
      const q = parseInt(currentCropsWorkingCopy[idx].plantQty, 10) || 1;
      const inp = document.getElementById(`qty-in-${idx}`);
      if (inp && document.activeElement !== inp) inp.value = q;
      const minus = document.getElementById(`qty-minus-${idx}`);
      if (minus) { if (q <= 1) minus.setAttribute('aria-disabled', 'true'); else minus.removeAttribute('aria-disabled'); }
    }
    function qtyStep(idx, d) {
      const crop = currentCropsWorkingCopy[idx]; if (!crop) return false;
      const cur = parseInt(crop.plantQty, 10) || 1;
      const next = Math.max(1, Math.min(9999, cur + d));

    // Press = one step; hold = repeats (after 0.45s, every 80ms)

    // ===== Harvest inside the card (H2): Collir → orange surface ripples out from the button over the card

    let pmHarvest = {};

    function confirmHarvestInline(idx) {

    function qtyInput(idx, el) {

    // ===== Notes (T3): timeline, newest first. Stored oldest → newest as before ({ text, date }). =====
    let ntShowAll = {};
    const NT_SHOW = 3;
    function noteWhen(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      if (!m) return escHtml(iso || '');
      const y = +m[1], mo = +m[2], d = +m[3];
      const then = new Date(y, mo - 1, d), now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((now - then) / 864e5);
      const date = `${d} ${CA_MONTHS[mo - 1]}${y !== now.getFullYear() ? ' ' + y : ''}`;
      if (diff === 0) return `<b>Avui</b> · ${date}`;
      if (diff === 1) return `<b>Ahir</b> · ${date}`;
      if (diff > 1 && diff < 7) return `<b>Fa ${diff} dies</b> · ${date}`;

    function notesListHtml(crop, idx, newIdx) {

    // Touch screens: tapping a note shows its bin (one at a time); tapping it again or anywhere else hides it

    function toggleAllNotes(idx) { ntShowAll[idx] = !ntShowAll[idx]; notesRefresh(idx); }

    function addNoteToCrop(idx) {

    function removeNoteFromCrop(cropIdx, noteIdx, btn) {

    function saveCellCropsSilently() {

    function addCropBlock() {
      currentCropsWorkingCopy.push(createNewCropObject());

    // Delete a plant card; "Desfés" in the snackbar puts it back (only while the same editor is still open)
    let pmSession = 0, pmUndoPending = false;
    function removeCropBlock(idx, opts = {}) {
      const removed = currentCropsWorkingCopy.splice(idx, 1)[0];
      const wasOpen = pmOpenIdx === idx;
      let addedBlank = false;
      if (currentCropsWorkingCopy.length === 0) {
        currentCropsWorkingCopy.push(createNewCropObject());
        addedBlank = true;
      }
      if (!opts.silent && removed && removed.plantName) {
        const session = pmSession;
        pmUndoPending = true;
        showSnackbar(`S'ha eliminat «${removed.plantName}»`, 'Desfés', () => {
          pmUndoPending = false;
          if (session !== pmSession || !pmIsOpen()) return;
          const blank = currentCropsWorkingCopy[0];
          if (addedBlank && currentCropsWorkingCopy.length === 1 && blank && !blank.plantName) currentCropsWorkingCopy.length = 0;
          const at = Math.min(idx, currentCropsWorkingCopy.length);
          currentCropsWorkingCopy.splice(at, 0, removed);
          if (!currentCropsWorkingCopy.some((c, k) => k !== at && !c.plantName) && currentCropsWorkingCopy.length === 1) { pmOpenIdx = 0; renderModalCrops(); return; }
          if (pmOpenIdx >= at) pmOpenIdx++;

          pmAnimateEnter(at);

      }

        w.remove();
        pmListTimers.push(setTimeout(() => renderModalCrops(), 520));
      }, 480));
    }

    function closeModal() {

    function saveCellCrops() {

    function getPlantEmoji(name) {
      const lower = (name || '').toLowerCase();
      if (lower.includes('tomàquet')) return '🍅';
      if (lower.includes('ceba')) return '🧅';
      if (lower.includes('porros') || lower.includes('porro')) return '🌿';
      if (lower.includes('col')) return '🥬';
      if (lower.includes('espinac')) return '🍃';
      if (lower.includes('api')) return '🌱';
      if (lower.includes('julivert')) return '🌿';
      if (lower.includes('bleda')) return '🥬';
      if (lower.includes('carbassó')) return '🥒';
      return '🌱';
    }

    function renderSummaryView() {
      const host = document.getElementById('summary-content');
      const counts = {}, emojis = {}, dates = {};
      let total = 0, oldestCrop = null, latestCrop = null;
      Object.values(appData.cellSides).forEach(list => (list || []).forEach(crop => {
        if (!crop || !crop.plantName) return;
        const n = crop.plantName, qty = parseInt(crop.plantQty, 10) || 1;
        counts[n] = (counts[n] || 0) + qty; total += qty;
        if (!emojis[n]) emojis[n] = crop.emoji || getPlantEmoji(n);
        if (crop.plantDate) {
          (dates[n] || (dates[n] = new Set())).add(crop.plantDate);
          if (!oldestCrop || crop.plantDate < oldestCrop.plantDate) oldestCrop = crop;
          if (!latestCrop || crop.plantDate > latestCrop.plantDate) latestCrop = crop;
        }
      }));

      document.getElementById('summary-hero-label').textContent = total === 1 ? 'unitat plantada' : 'unitats plantades';
      const crops = Object.entries(counts).map(([name, qty]) => ({ name, qty, cat: catOf(name) })).sort((a, b) => b.qty - a.qty);
      const pct = q => total > 0 ? Math.round(q / total * 100) : 0;

      // Most popular category = most units planted; ties → first in the fixed order; plants without one don't count
      let top = null;
      CATS.forEach(c => { const q = crops.filter(x => x.cat === c.id).reduce((a, x) => a + x.qty, 0); if (q > 0 && (!top || q > top.q)) top = { ...c, q }; });
      renderSummaryStats(crops.length, top, top ? pct(top.q) : 0, oldestCrop, latestCrop);

      if (!crops.length) {

      if (!el) return;

      const duration = 800, start = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3);
      const tick = now => {
        const t = Math.min(1, (now - start) / duration);
        el.textContent = Math.round(target * ease(t));
        if (t < 1) countUpFrame = requestAnimationFrame(tick);
      };
      if (target <= 0) { el.textContent = target; return; }
      countUpFrame = requestAnimationFrame(tick);
    }

    // Display-only planting-date text for a crop card
    function plantingDatesLabel(dates) {
      if (!dates || dates.length === 0) return 'Sense data de plantació';
      const thisYear = new Date().getFullYear();
      const parse = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
      const years = [...new Set(dates.map(d => parse(d).getFullYear()))];
      const oneYear = years.length === 1;
      const yearSuffix = oneYear && years[0] !== thisYear ? ` del ${years[0]}` : '';
      const dayMonth = iso => oneYear
        ? new Intl.DateTimeFormat('ca', { day: 'numeric', month: 'long' }).format(parse(iso))
        : formatDateCa(iso);
      const el = txt => /^(1|11) /.test(txt) ? `l’${txt}` : `el ${txt}`; // l’1 de juny, l’11 de març
      if (dates.length === 1) return `Plantat ${el(dayMonth(dates[0]))}${yearSuffix}`;
      if (dates.length === 2) return `Plantat ${el(dayMonth(dates[0]))} i ${el(dayMonth(dates[1]))}${yearSuffix}`;
      // 3 or more: "3 plantacions · de març a maig"
      const monthName = iso => new Intl.DateTimeFormat('ca', { month: 'long' }).format(parse(iso));
      const withYear = iso => oneYear ? monthName(iso) : `${monthName(iso)} ${parse(iso).getFullYear()}`;
      const de = w => /^[aeiouàèéíòóú]/i.test(w) ? `d’${w}` : `de ${w}`;
      const first = withYear(dates[0]);
      const last = withYear(dates[dates.length - 1]);
      const range = first === last ? first : `${de(first)} a ${last}`;
      return `${dates.length} plantacions · ${range}${yearSuffix}`;
    }

    // Display-only: "2026-03-12" -> "12 de març de 2026"
    function formatDateCa(iso) {
      const [y, m, d] = (iso || '').split('-').map(Number);
      if (!y || !m || !d) return iso || '';
      return new Intl.DateTimeFormat('ca', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(y, m - 1, d));
    }

    // ===== Historial: one merged view. Plants sorted by their most recent harvest; a plant with several harvests

    let histPrevKeys = new Set(), histAgg = [], histOpen = new Set(), histSingleName = null;

    // Filters: plant name (accents and case ignored) + planting-date range
    function historyFiltered() {
      const q = normTxt(document.getElementById('history-search').value);
      const start = document.getElementById('history-date-start').value;
      const end = document.getElementById('history-date-end').value;
      return appData.history.filter(item => {
        const pDate = item.plantDate || '';

      });

    // "Netejar filtres" clears the search and both dates (approved behaviour change: it used to clear the dates only)
    function clearHistoryFilters() {

    function hfSync() {
      const q = document.getElementById('history-search').value;
      document.getElementById('hf-search-clear').hidden = !q;
      let active = !!q.trim();
      ['start', 'end'].forEach(w => {
        const v = document.getElementById(`history-date-${w}`).value;
        const f = document.getElementById(`hf-${w}`);
        f.classList.toggle('has-val', !!v);
        f.querySelector('.hf-dclear').hidden = !v;
        document.getElementById(`hf-${w}-txt`).textContent = v ? fmtDateCa(v) : 'Qualsevol';
        if (v) active = true;
      });
      if (histCats.size) active = true;
      document.getElementById('hf-clear-all').hidden = !active;
      document.getElementById('hf-clear-bar-w').hidden = !(active && currentView === 'history');
      return active;

    function successChip(pct) {
      const band = pct >= 80 ? ['sx-hi', 'trending_up'] : pct >= 50 ? ['sx-mid', 'trending_flat'] : ['sx-lo', 'trending_down'];
      return `<span class="sx ${band[0]}"><span class="material-symbols-outlined" aria-hidden="true">${band[1]}</span>${pct}%</span>`;
    }
    const hxQty = v => { const s = String(v ?? '').trim(); return s === '' ? '—' : escHtml(s); };
    const hxDate = iso => fmtDateCa(iso) || (iso ? escHtml(iso) : 'Sense data');
    const hxUnits = n => (parseFloat(n) === 1 ? 'unitat' : 'unitats');
    const hxNotesBtn = (count, onclick) => count
      ? `<button type="button" class="hx-np" onclick="${onclick}" title="Notes" aria-label="Veure ${count === 1 ? 'la nota' : `les ${count} notes`}"><span class="material-symbols-outlined" aria-hidden="true">sticky_note_2</span>${count}</button>`
      : '';
    // Weeks between planting and harvest (null when a date is missing or the order is wrong)
    const hxUtc = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
    function hxWeeks(it) {
      const a = hxUtc(it.plantDate), b = hxUtc(it.harvestDate);
      return a !== null && b !== null && b >= a ? (b - a) / 6048e5 : null;
    }
    function hxAvgWeeks(items) {
      const w = items.map(hxWeeks).filter(x => x !== null);
      return w.length ? w.reduce((a, c) => a + c, 0) / w.length : null;
    }
    const hxWk = w => String(Math.round(w)); // whole weeks
    const hxWkText = w => w === null ? '' : `${hxWk(w)} ${hxWk(w) === '1' ? 'setmana' : 'setmanes'} de cultiu`;

    // Groups the filtered harvests by plant name. Harvests newest first; plants by their most recent harvest.
    function historyGroups(filtered) {
      const order = new Map(appData.history.map((h, i) => [h, i]));
      const all = {};
      appData.history.forEach(h => { all[h.plantName] = (all[h.plantName] || 0) + 1; });
      const cmp = (a, b) => (b.harvestDate || '').localeCompare(a.harvestDate || '') || order.get(b) - order.get(a);
      const groups = {};
      filtered.forEach(item => {
        const name = item.plantName;
        if (!groups[name]) groups[name] = { plantName: name, harvestCount: 0, allCount: all[name] || 0, totalPlantQty: 0, totalHarvestQty: 0, notesCount: 0, items: [] };
        const g = groups[name];
        g.harvestCount++;
        g.totalPlantQty += parseFloat(item.plantQty) || 0;
        g.totalHarvestQty += parseFloat(item.harvestQty) || 0;
        g.notesCount += (item.notes || []).length;
        g.items.push(item);
      });
      const list = Object.values(groups);
      list.forEach(g => { g.items.sort(cmp); g.latest = g.items[0]; g.emoji = g.latest.emoji || getPlantEmoji(g.plantName); });
      return list.sort((a, b) => cmp(a.latest, b.latest));
    }

    function renderHistoryTable() {

      // Rows that weren't on screen before rise in (30ms apart, max 8 steps); rows already shown, or hidden, stay still
      const enter = (key, visible = true) => {
        now.add(key);
        if (!visible || fxQuiet || histPrevKeys.has(key)) return { cls: '', st: '' };
        return { cls: ' hr-in', st: ` style="--k:${Math.min(k++, 8)}"` };

        const only = histAgg.length === 1 && histAgg[0].items.length > 1 ? histAgg[0].plantName : null;

                  <span class="hl-sup">Última collita ${last}</span>
                  ${gw === null ? '' : `<span class="hl-sup">De mitjana, ${hxWkText(gw)}</span>`}</span>

              </div>
              <div class="hg-body" id="hg-body-${gi}"${open ? '' : ' inert'}><div><div class="hg-list">${entries}</div></div></div>
            </div></li>`;
        });

        html = `<div class="ht-wrap"><table class="ht"><thead><tr>
            <th scope="col">Planta</th><th scope="col" class="n">Plantat</th><th scope="col" class="n">Collit</th>
            <th scope="col" class="n" title="Setmanes entre la plantació i la collita (mitjana a les files de planta)">Setmanes</th>
            <th scope="col" class="c">Èxit</th><th scope="col" class="e">Notes</th>
          </tr></thead><tbody>${rows}</tbody></table></div><ul class="hl">${items}</ul>`;
      }

      host.innerHTML = html;
      histPrevKeys = now;
      const status = document.getElementById('hs-status');
      if (status) {
        const p = histAgg.length, h = filtered.length;
        status.textContent = p ? `${p} ${p === 1 ? 'planta' : 'plantes'}, ${h} ${h === 1 ? 'collita' : 'collites'}` : 'Cap resultat';
      }
      hxStuck();
    }

    // Open / close one plant's harvests without re-rendering (so the card height and chevron can animate)
    function toggleHistGroup(gi) {
      const g = histAgg[gi]; if (!g) return;
      const key = g.plantName, open = !histOpen.has(key);
      if (open) histOpen.add(key); else histOpen.delete(key);
      const host = document.getElementById('history-results');
      const row = host.querySelector(`tr.ht-grp[data-g="${gi}"]`);
      if (row) {
        row.classList.toggle('hg-open', open);
        row.querySelector('.hx-chev').setAttribute('aria-expanded', open);
        const kids = [...host.querySelectorAll(`tr.ht-ch[data-gc="${gi}"]`)];
        kids.forEach((tr, k) => {
          tr.classList.remove('hr-in', 'hr-fold', 'show-del');
          if (open) { tr.hidden = false; tr.style.setProperty('--k', Math.min(k, 8)); void tr.offsetWidth; tr.classList.add('hr-in'); }
          else tr.classList.add('hr-fold');
        });
        if (!open) setTimeout(() => { if (!histOpen.has(key)) kids.forEach(tr => { tr.hidden = true; tr.classList.remove('hr-fold'); }); }, 200);
      }
      const card = host.querySelector(`.hl-item.hg-exp[data-g="${gi}"]`);
      if (card) {
        card.classList.toggle('hg-open', open);
        card.querySelector('.hg-toggle').setAttribute('aria-expanded', open);
        card.querySelector('.hg-body').inert = !open;
        if (!open) card.querySelectorAll('.show-del').forEach(el => el.classList.remove('show-del'));

    // Clicking anywhere on a plant row toggles it (its buttons keep their own action)
    function hxRowToggle(e, gi) { if (!e.target.closest('button')) toggleHistGroup(gi); }

    // Sticky table header: a divider appears once the table has scrolled under the collapsed app bar
    function hxStuck() {
      const w = document.querySelector('#history-results .ht-wrap');
      if (w) w.classList.toggle('stuck', w.getBoundingClientRect().top < 63.5);
    }
    document.addEventListener('scroll', hxStuck, { capture: true, passive: true });
    window.addEventListener('resize', hxStuck);

    // Touch: tapping a row shows its bin (one row at a time); tapping it again or anywhere else hides it
    document.addEventListener('click', e => {
      if (!window.matchMedia('(hover: none)').matches) return;
      if (e.target.closest('.hx-del, .hx-btn, .hx-np')) return;
      const row = e.target.closest('#history-results .hr-row');
      document.querySelectorAll('#history-results .hr-row.show-del').forEach(r => { if (r !== row) r.classList.remove('show-del'); });
      if (row) row.classList.toggle('show-del');
    });

    // Delete with undo (approved behaviour change): the row slides out; "Desfés" puts the record back in the same place
    function deleteHistoryItem(id) {
      const idx = appData.history.findIndex(h => String(h.id) === String(id));
      if (idx < 0) return;
      const removed = appData.history[idx];
      document.querySelectorAll(`#history-results [data-hid="${CSS.escape(String(id))}"]`).forEach(el => el.classList.add('hr-out'));
      setTimeout(() => {
        const at = appData.history.indexOf(removed);
        if (at < 0) return;
        appData.history.splice(at, 1);
        saveData();
        renderHistoryTable();
        showSnackbar(`S'ha eliminat «${removed.plantName}» de l'Historial`, 'Desfés', () => {
          if (appData.history.includes(removed)) return;
          appData.history.splice(Math.min(at, appData.history.length), 0, removed);
          saveData();
          if (currentView === 'history') renderHistoryTable();
        });
      }, 280);
    }

    // ===== Historial notes dialog (M3 basic dialog): plant header, read-only timeline newest first, one filled "Tancar".
    // Escape / tapping the scrim close it; focus moves in, Tab stays inside, and returns to the "Notes" button on close;
    // the page behind is inert and doesn't scroll. Notes data unchanged ({ text, date }, stored oldest → newest).
    let hnReturnFocus = null, hnInerted = [];
    function hnShortDate(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      if (!m) return escHtml(iso || '—');
      return `${+m[3]} ${CA_MONTHS[+m[2] - 1]}${+m[1] !== new Date().getFullYear() ? ' ' + m[1] : ''}`;
    }
    function hnIsOpen() { return document.getElementById('history-notes-modal').classList.contains('open'); }
    function hnScrollEdges() {
      const body = document.getElementById('history-notes-container');
      const scrollable = body.scrollHeight > body.clientHeight + 1;
      body.classList.toggle('more-above', scrollable && body.scrollTop > 0);
      body.classList.toggle('more-below', scrollable && body.scrollTop + body.clientHeight < body.scrollHeight - 1);
      body.tabIndex = scrollable ? 0 : -1; // keyboard users can scroll a long list
    }
    function hnTimeline(notes, kStart, markLatest) {
      const order = notes.map((n, i) => i).reverse(); // newest first
      return `<ol class="nt-tl">${order.map((i, k) => `
          <li class="nt-item${markLatest && k === 0 ? ' latest' : ''}" style="--k:${Math.min(kStart + k, 8)}">
            <span class="nt-dot" aria-hidden="true"></span>
            <div class="nt-when">${noteWhen(notes[i].date)}</div>
            <div class="nt-txt">${escHtml(notes[i].text)}</div>
          </li>`).join('')}</ol>`;
    }
    function hnShow(emoji, title, subHtml, bodyHtml, trigger) {
      const m = document.getElementById('history-notes-modal');
      document.getElementById('hn-avatar').textContent = emoji;
      document.getElementById('hn-title').textContent = title || '';
      document.getElementById('hn-sub').innerHTML = subHtml;
      const body = document.getElementById('history-notes-container');
      body.innerHTML = bodyHtml;
      body.scrollTop = 0;
      hnReturnFocus = trigger || document.activeElement;
      // Everything behind the dialog becomes inert (remember which layers we changed, to restore only those)
      hnInerted = [...document.body.children].filter(el => el !== m && el.id !== 'snackbar-host' && el.tagName !== 'SCRIPT' && !el.inert);
      hnInerted.forEach(el => { el.inert = true; });
      document.documentElement.classList.add('hn-lock');
      m.inert = false;
      m.classList.remove('open'); void m.offsetWidth; // replay the notes entrance when reopened quickly
      m.classList.add('open');
      hnScrollEdges();
      setTimeout(() => document.getElementById('hn-dlg').focus({ preventScroll: true }), 30);
    }

    function openHistoryNotesModal(itemId, trigger) {
      const item = appData.history.find(h => String(h.id) === String(itemId));
      if (!item || !item.notes || !item.notes.length) return;
      hnShow(item.emoji || getPlantEmoji(item.plantName), item.plantName,
        `Plantat ${hnShortDate(item.plantDate)} · Collit ${hnShortDate(item.harvestDate)}`,
        `<h4 class="nt-h">Notes <span class="nt-count">· ${item.notes.length}</span></h4>${hnTimeline(item.notes, 0, true)}`, trigger);
    }

    // Agrupat: all notes of one plant (within the current filters), one section per harvest, newest harvest first
    function openHistoryGroupNotes(gi, trigger) {
      const g = histAgg[gi];
      if (!g || !g.notesCount) return;
      const withNotes = g.items.map((it, i) => ({ it, i })).filter(x => (x.it.notes || []).length)
        .sort((a, b) => (b.it.harvestDate || '').localeCompare(a.it.harvestDate || '') || b.i - a.i);
      let k = 0, body = `<h4 class="nt-h">Notes <span class="nt-count">· ${g.notesCount}</span></h4>`;
      withNotes.forEach(({ it }, gIdx) => {
        body += `<h5 class="hn-gh">Collit ${hnShortDate(it.harvestDate)} · Plantat ${hnShortDate(it.plantDate)}</h5>${hnTimeline(it.notes, k, gIdx === 0)}`;
        k += it.notes.length;
      });
      hnShow(g.emoji, g.plantName, `${g.harvestCount} ${g.harvestCount === 1 ? 'collita' : 'collites'}`, body, trigger);
    }

    function closeHistoryNotesModal() {
      const m = document.getElementById('history-notes-modal');
      if (!m.classList.contains('open')) return;
      m.classList.remove('open');
      m.inert = true;
      hnInerted.forEach(el => { el.inert = false; }); hnInerted = [];
      document.documentElement.classList.remove('hn-lock');
      const back = hnReturnFocus; hnReturnFocus = null;
      if (back && document.contains(back)) back.focus({ preventScroll: true });
    }

    (function initHistoryNotesDialog() {
      const scrim = document.getElementById('hn-scrim');
      scrim.addEventListener('click', closeHistoryNotesModal);
      ['wheel', 'touchmove'].forEach(t => scrim.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.getElementById('history-notes-container').addEventListener('scroll', hnScrollEdges, { passive: true });
      window.addEventListener('resize', () => { if (hnIsOpen()) hnScrollEdges(); });
      document.addEventListener('keydown', e => {
        if (!hnIsOpen()) return;
        if (e.key === 'Escape') { e.preventDefault(); closeHistoryNotesModal(); }
        else if (e.key === 'Tab') {
          const dlg = document.getElementById('hn-dlg');
          const f = [document.getElementById('history-notes-container'), document.getElementById('hn-close')].filter(el => el.tabIndex >= 0);
          const first = f[0], last = f[f.length - 1];
          if (e.shiftKey && (document.activeElement === first || document.activeElement === dlg)) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });
    })();


    // ===== Planter page (item 17) =====
    let plPrevKeys = new Set();
    function initCookieMask() {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="${COOKIE_9_SHAPE}"/></svg>`;
      document.documentElement.style.setProperty('--cookie-mask', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
      // Outlined variant (item: cookie avatars switched from filled to outlined for emoji contrast): same shape,
      // stroked instead of filled. non-scaling-stroke keeps the ring a true 2px regardless of the avatar's rendered size.
      const ringSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="${COOKIE_9_SHAPE}" fill="none" stroke="black" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
      document.documentElement.style.setProperty('--cookie-mask-ring', `url("data:image/svg+xml,${encodeURIComponent(ringSvg)}")`);
    }
    function plClearSearch() { const i = document.getElementById('planter-search'); i.value = ''; renderPlanter(); i.focus(); }
    // Groups of names that are the same once accents and case are ignored
    function catDupGroups() {
      const g = {};
      (appData.plants || []).forEach(p => { const k = normTxt(p.name); (g[k] || (g[k] = [])).push(p); });
      return Object.entries(g).filter(([, list]) => list.length > 1);
    }
    function renderPlanter() {
      if (!Array.isArray(appData.plants)) catEnsure();
      const qRaw = document.getElementById('planter-search').value, q = normTxt(qRaw);
      document.getElementById('pl-search-clear').hidden = !qRaw;
      const usage = catUsageMap();
      const all = [...appData.plants].sort((a, b) => a.name.localeCompare(b.name, 'ca'));
      const shown = plFilteredPlants(all);
      const n = all.length, filtering = !!q || plCats.size > 0;
      plCatsPaint();
      document.getElementById('pl-count').textContent = filtering ? `${shown.length} de ${n} plantes` : `${n} ${n === 1 ? 'planta' : 'plantes'}`;

      document.getElementById('pl-dups').innerHTML = catDupGroups().map(([k, list]) => `
        <div class="pl-dup-w" data-key="${escHtml(k)}"><div><div class="pl-dup" role="region" aria-label="Plantes semblants">
          <span class="material-symbols-outlined" aria-hidden="true">merge</span>
          <div class="pl-dup-text"><span class="pl-dup-t">Semblen la mateixa planta</span>
            <span class="pl-dup-n">${list.map(p => `${escHtml(p.emoji)} ${escHtml(p.name)}`).join(' · ')}</span></div>
          <button type="button" class="pm-btn pm-btn-filled x-pill" data-dup="${escHtml(k)}" onclick="pdOpenMerge(this.dataset.dup, this)">
            <span class="material-symbols-outlined" aria-hidden="true">merge</span>Fusiona</button>
        </div></div></div>`).join('');

      const now = new Set();
      let k = 0;
      const host = document.getElementById('pl-results');
      if (!n) {
        host.innerHTML = `<div class="hx-empty"><span class="material-symbols-outlined" aria-hidden="true">local_florist</span>
          <h3>El planter és buit</h3><p>Afegeix la primera planta amb el botó «Afegir planta».</p></div>`;
      } else if (!shown.length) {
        const qq = escHtml(qRaw.trim()), chips = plCats.size > 0;
        // "Afegir «…»" only when no plant at all has that name (with chips on, the plant may exist in another category)
        const add = q && !all.some(p => normTxt(p.name).includes(q)) ? `<button type="button" class="pm-btn pm-btn-filled x-pill pl-add-q" data-q="${qq}" onclick="pdOpenNew(this, this.dataset.q)">
            <span class="material-symbols-outlined" aria-hidden="true">add</span><span>Afegir «${qq}»</span></button>` : '';
        const clr = chips ? `<button type="button" class="hx-btn" onclick="plClearFilters()"><span class="material-symbols-outlined" aria-hidden="true">filter_alt_off</span>Netejar filtres</button>` : '';
        const title = chips ? 'Cap planta coincideix amb els filtres' : `Cap planta coincideix amb «${qq}»`;
        const sub = !chips ? 'Prova amb un altre nom, o afegeix-la al planter.' : add ? 'Prova amb altres categories, o afegeix-la al planter.' : 'Prova amb altres categories o un altre nom.';
        host.innerHTML = `<div class="hx-empty"><span class="material-symbols-outlined" aria-hidden="true">search_off</span>
          <h3>${title}</h3><p>${sub}</p>${add || clr ? `<div class="pl-empty-acts">${clr}${add}</div>` : ''}</div>`;
      } else {
        host.innerHTML = `<ul class="pl-list">${shown.map(p => {
          const key = p.name; now.add(key);
          const anim = plPrevKeys.has(key) || fxQuiet ? '' : ` class="hr-in" style="--k:${Math.min(k++, 8)}"`;
          const idx = appData.plants.indexOf(p);
          return `<li data-k="${escHtml(key)}"${anim}><button type="button" class="pl-item" data-pl="${idx}" data-name="${escHtml(p.name)}" onclick="pdOpenEdit(+this.dataset.pl, this)">
            <span class="pl-av" aria-hidden="true"><span>${escHtml(p.emoji)}</span></span>
            <span class="pl-text"><span class="pl-name">${escHtml(p.name)}</span><span class="pl-use">${catUseText(usage[p.name], true)}</span></span>
            <span class="material-symbols-outlined pl-ic" aria-hidden="true">edit</span></button></li>`;
        }).join('')}</ul>`;
      }
      plPrevKeys = now;
    }

    // ===== Plant dialog: new / edit / merge =====
    const PD_EMOJIS = ['🍅','🥕','🥔','🧅','🧄','🌶️','🫑','🥒','🥬','🥦','🍆','🌽','🫛','🫘','🥜','🍠','🎃','🍉','🍈','🍓',
      '🫐','🍇','🍋','🍊','🍎','🍐','🍑','🍒','🥝','🥑','🍄','🌱','🌿','🍃','🌾','☘️','🪴','🌻','🌷','🌸','🌼','💐'];
    const emoKey = e => String(e || '').replace(/️/g, '');
    const PD_WIDE = window.matchMedia('(min-width: 840px)');
    let pd = null, pdInerted = [];

    function pdIsOpen() { return document.getElementById('plant-cat-modal').classList.contains('open'); }
    function pdSetBasic() {
      const m = document.getElementById('plant-cat-modal');
      m.classList.toggle('basic', !!pd && (pd.mode === 'merge' || PD_WIDE.matches));
    }
    function pdShow(trigger) {
      const m = document.getElementById('plant-cat-modal');
      pd.returnName = trigger && trigger.dataset ? trigger.dataset.name || null : null;
      pd.returnEl = trigger || document.activeElement;
      pdSetBasic();
      pdRender();
      pdInerted = [...document.body.children].filter(el => el !== m && el.id !== 'snackbar-host' && el.tagName !== 'SCRIPT' && !el.inert);
      pdInerted.forEach(el => { el.inert = true; });
      document.documentElement.classList.add('hn-lock');
      m.inert = false;
      m.classList.add('open');
      const body = document.getElementById('pd-body'); body.scrollTop = 0;
      document.getElementById('pd-dlg').classList.remove('scrolled');
      setTimeout(() => {
        if (pd && pd.mode === 'new') document.getElementById('pd-name').focus({ preventScroll: true });
        else document.getElementById('pd-dlg').focus({ preventScroll: true });
      }, 30);
    }
    function pdClose() {
      const m = document.getElementById('plant-cat-modal');
      if (!m.classList.contains('open')) return;
      m.classList.remove('open');
      m.inert = true;
      pdInerted.forEach(el => { el.inert = false; }); pdInerted = [];
      document.documentElement.classList.remove('hn-lock');
      let back = pd && pd.returnEl;
      if (pd && pd.returnName) {
        const again = [...document.querySelectorAll('#pl-results .pl-item')].find(b => b.dataset.name === (pd.focusName || pd.returnName));
        if (again) back = again;
      }
      pd = null;
      if (back && document.contains(back) && !back.closest('.hidden')) back.focus({ preventScroll: true });
    }

    // name: optional, prefilled from the Planter search when nothing matched ("Afegir «…»")
    function pdOpenNew(trigger, name) {
      if (pdIsOpen()) return;
      const n = nmTrim(name), e = n ? getPlantEmoji(n) : '🌱';
      pd = { mode: 'new', idx: -1, name: n, emoji: e, origEmoji: e, touched: false, category: n ? getPlantCategory(n) : '', catTouched: false };
      pdShow(null);
      pd.returnEl = trigger;
    }
    function pdOpenEdit(i, trigger) {
      const p = appData.plants[i]; if (!p || pdIsOpen()) return;
      pd = { mode: 'edit', idx: i, name: p.name, emoji: p.emoji, origEmoji: p.emoji, touched: true, category: catOfPlant(p), catTouched: true };
      pdShow(trigger);
    }
    function pdOpenMerge(key, trigger) {
      const list = (appData.plants || []).filter(p => normTxt(p.name) === key);
      if (list.length < 2 || pdIsOpen()) return;
      const u = catUsageMap();
      // Default: the most used name; ties → the one with accents / capitals (usually the proper spelling)
      const score = p => ((u[p.name] || {}).p || 0) + ((u[p.name] || {}).h || 0);
      const nice = p => (p.name !== p.name.toLowerCase() ? 1 : 0) + (/[^\x00-\x7F]/.test(p.name) ? 1 : 0);
      const keep = [...list].sort((a, b) => score(b) - score(a) || nice(b) - nice(a))[0].name;
      pd = { mode: 'merge', key, names: list.map(p => p.name), keep };
      pdShow(trigger);
    }

    function pdRender() {
      const title = { new: 'Nova planta', edit: 'Editar planta', merge: 'Fusionar plantes' }[pd.mode];
      document.getElementById('pd-title').textContent = title;
      const body = document.getElementById('pd-body');

              <span class="pl-av" aria-hidden="true"><span>${escHtml(catEmoji(n))}</span></span>
              <span class="pl-text"><span class="pl-name">${escHtml(n)}</span><span class="pl-use">${catUseText(u[n], true)}</span></span></label>`).join('')}</div>`;
        pdSetOk('Fusiona', false);
        return;
      }
      body.innerHTML = `<div class="pd-form" id="pd-form">
        <div class="pd-hero"><span class="pl-av pl-av-cookie pd-prev" id="pd-prev" aria-hidden="true"><span>${escHtml(pd.emoji)}</span></span></div>
        <div class="of-field pd-f pd-name" id="pd-name-f">
          <label class="of-label" for="pd-name">Nom</label>
          <input id="pd-name" class="pd-in" value="${escHtml(pd.name)}" placeholder="Ex.: Mongeta" autocomplete="off" autocapitalize="sentences" spellcheck="false"
            aria-describedby="pd-name-sup" oninput="pdNameInput(this)" onkeydown="if (event.key === 'Enter' && !event.isComposing) { event.preventDefault(); pdSubmit(); }">
        </div>
        <p class="pd-sup" id="pd-name-sup"></p>
        <div class="pd-notice" id="pd-notice" role="status" hidden></div>
        <div class="pd-catf" id="pd-catf">
          <button type="button" class="of-field pd-cat" id="pd-cat" aria-haspopup="listbox" aria-expanded="false" aria-controls="pd-cat-menu" onclick="pdCatToggle()">
            <span class="of-label">Categoria</span>
            <span class="material-symbols-outlined pd-cat-ic" id="pd-cat-ic" aria-hidden="true"></span>
            <span class="pd-cat-v" id="pd-cat-v"></span>
            <span class="material-symbols-outlined pd-cat-arr" aria-hidden="true">arrow_drop_down</span>
          </button>
          <div class="pp-menu pd-cat-menu" id="pd-cat-menu" role="listbox" aria-label="Categoria"></div>
        </div>
        <h4 class="pd-h" id="pd-emo-h">Emoji</h4>
        <div class="pd-emo" id="pd-emo">${pdEmoCells(false)}</div></div>`;
      // Delete (edit only): top bar on the full-screen dialog, footer on the pop-up. Soft-disabled while the plant is in use.
      const use = pd.mode === 'edit' ? u[pd.name] : null, used = !!use && (use.p + use.h) > 0;
      document.querySelectorAll('#plant-cat-modal .pd-del').forEach(b => {
        b.hidden = pd.mode !== 'edit';
