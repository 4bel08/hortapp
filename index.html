<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F2E21">
  <title>Gestor de l'hort</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            earth: {
              50: '#fdfaf6',
              100: '#f5eee6',
              200: '#e8d9c8',
              300: '#d7bc9f',
              600: '#9b6c43',
              800: '#5c3d23',
              900: '#382414',
            },
            forest: {
              50: '#f2f7f3',
              100: '#e1ede4',
              200: '#c5dccb',
              500: '#4e875a',
              700: '#2d5436',
              800: '#23422b',
              900: '#1a3120',
            },
            terracotta: {
              500: '#d96b43',
              600: '#be532c',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
      background-color: #f5eee6;
      color: #382414;
      touch-action: manipulation;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #14100d !important;
        color: #f5eee6 !important;
      }
      .dark-card-bg {
        background-color: #221b16 !important;
        border-color: #3d3027 !important;
      }
      .dark-input-bg {
        background-color: #1b1511 !important;
        color: #f5eee6 !important;
        border-color: #3d3027 !important;
      }
      .dark-border {
        border-color: #3d3027 !important;
      }
      .cell-brown {
        background-color: #2b1d14 !important;
        border-color: #422a1b !important;
      }
    }

    .cell-brown {
      background-color: #2b1d14;
      border-color: #422a1b;
    }
    .side-spot {
      transition: all 0.15s ease-in-out;
    }
    .side-spot:hover, .side-spot:active {
      background-color: rgba(217, 107, 67, 0.85) !important;
    }

    .md3-fab {
      border-radius: 16px;
      box-shadow: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 4px 8px 3px rgba(0, 0, 0, 0.15);
      transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.28s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease, width 0.28s cubic-bezier(0.2, 0, 0, 1);
    }
    .md3-fab:hover {
      box-shadow: 0px 2px 3px 1px rgba(0, 0, 0, 0.15), 0px 6px 10px 4px rgba(0, 0, 0, 0.15);
      transform: translateY(-2px) scale(1.02);
    }
    .md3-fab:active {
      box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 1px 3px 1px rgba(0, 0, 0, 0.15);
      transform: translateY(0) scale(0.95);
    }

    #desktop-nav-rail {
      width: 80px;
      transition: width 0.3s cubic-bezier(0.2, 0, 0, 1);
      position: relative;
    }
    #desktop-nav-rail.expanded {
      width: 256px;
    }

    .rail-item {
      position: relative;
      height: 56px !important;
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;
      display: block !important;
      background: transparent !important;
      border-radius: 28px !important;
      box-shadow: none !important;
    }

    .rail-icon-wrap {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      height: 32px;
      border-radius: 16px;
      background: transparent;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease, color 0.2s ease;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      padding-left: 16px !important;
      box-sizing: border-box;
    }
    #desktop-nav-rail.expanded .rail-icon-wrap {
      top: 0;
      height: 56px;
      border-radius: 28px;
    }

    .rail-label {
      position: absolute;
      left: 52px;
      top: 18px; 
      font-size: 0.875rem !important;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 2;
      display: block !important;
      max-width: none !important;
    }
    #desktop-nav-rail.expanded .rail-label {
      opacity: 1;
      transition: opacity 0.25s ease 0.1s;
    }

    .rail-item::after {
      content: attr(data-label);
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      opacity: 1;
      transition: opacity 0.15s ease 0.1s;
      z-index: 2;
      white-space: nowrap;
    }
    #desktop-nav-rail.expanded .rail-item::after {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    /* Active State Colors */
    .rail-active .rail-icon-wrap {
      color: #1a3120 !important;
    }
    .rail-active .rail-label,
    .rail-active::after {
      color: #1a3120 !important;
    }
    @media (prefers-color-scheme: dark) {
      .rail-active .rail-icon-wrap {
        color: #c5dccb !important;
      }
      .rail-active .rail-label,
      .rail-active::after {
        color: #c5dccb !important;
      }
    }

    #rail-fab-export, #rail-fab-planol {
      position: relative;
      height: 56px !important;
      padding: 0 !important;
      border-radius: 16px !important;
      transition: width 0.3s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease, box-shadow 0.2s ease !important;
      overflow: hidden;
      margin-bottom: 0 !important;
    }
    #rail-fab-export { position: absolute !important; top: 0; left: 0; }
    #desktop-nav-rail:not(.expanded) #rail-fab-export,
    #desktop-nav-rail:not(.expanded) #rail-fab-planol {
      width: 56px !important;
    }
    #desktop-nav-rail.expanded #rail-fab-export,
    #desktop-nav-rail.expanded #rail-fab-planol {
      width: 100% !important;
    }
    #rail-fab-export .material-symbols-outlined,
    #rail-fab-planol .material-symbols-outlined {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 16px;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
    }
    #rail-fab-export .rail-label,
    #rail-fab-planol .rail-label {
      top: 50%;
      transform: translateY(-50%);
    }

    /* MD3 indicator pill: circle collapses / grows from centre + hover state layer */
    .nav-pill { position: relative; }
    .rail-icon-wrap::before, .nav-pill::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; background: #c5dccb;
      clip-path: circle(0% at 50% 50%); opacity: 0;
      transition: clip-path 0.4s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s cubic-bezier(0.2, 0, 0, 1);
    }
    .rail-active .rail-icon-wrap::before, .nav-active::before { clip-path: circle(80% at 50% 50%); opacity: 1; }
    .rail-icon-wrap::after, .nav-pill::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor;
      opacity: 0; transition: opacity 0.2s ease;
    }
    .rail-item:hover .rail-icon-wrap::after, button:hover > .nav-pill::after { opacity: 0.08; }
    .rail-item:active .rail-icon-wrap::after, button:active > .nav-pill::after { opacity: 0.12; }
    .rail-icon-wrap > .material-symbols-outlined, .nav-pill > .material-symbols-outlined { position: relative; z-index: 1; }
    @media (prefers-color-scheme: dark) {
      .rail-icon-wrap::before, .nav-pill::before { background: #3a4a3c; }
    }

    /* Download arrow animation */
    .dl-arrow.dl-anim { animation: dl-drop 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes dl-drop {
      0% { transform: translateY(0); opacity: 1; }
      45% { transform: translateY(7px); opacity: 0; }
      46% { transform: translateY(-7px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .rail-icon-wrap::before, .nav-pill::before, .dl-arrow.dl-anim { transition: none; animation: none; } }

    /* Connected button group (column stepper) */
    .cg { --cg-inner: 8px; --cg-outer: 20px; display: inline-flex; gap: 2px; }
    .cg-btn, .cg-count {
      height: 40px; width: 48px; display: flex; align-items: center; justify-content: center;
      background: #c5dccb; color: #1a3120; border-radius: var(--cg-inner);
    }
    .cg-first { border-radius: var(--cg-outer) var(--cg-inner) var(--cg-inner) var(--cg-outer); }
    .cg-last { border-radius: var(--cg-inner) var(--cg-outer) var(--cg-outer) var(--cg-inner); }
    .cg-count { width: 112px; background: #f6dccb; color: #5c2a10; font-weight: 700; font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .cg-btn { position: relative; overflow: hidden; transition: border-radius 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s; }
    .cg-btn::after { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity 0.2s; }
    .cg-btn:hover::after { opacity: 0.08; }
    .cg-btn:active { border-radius: var(--cg-outer); }
    .cg-btn:active::after { opacity: 0.12; }
    .cg-disabled { opacity: 0.38; }
    .cg-disabled::after { display: none; }
    .cg-disabled:active { border-radius: var(--cg-outer) var(--cg-inner) var(--cg-inner) var(--cg-outer); }

    /* Single-select segmented button */
    .seg { display: flex; border: 1px solid #b59a80; border-radius: 9999px; overflow: hidden; }
    .seg-btn {
      flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; position: relative;
      font-size: 13px; font-weight: 600; color: #5c3d23; background: transparent; transition: background-color 0.25s;
    }
    .seg-btn + .seg-btn { border-left: 1px solid #b59a80; }
    .seg-btn::after { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity 0.2s; }
    .seg-btn:hover::after { opacity: 0.08; }
    .seg-btn:active::after { opacity: 0.12; }
    .seg-active { background: #c5dccb; color: #1a3120; }
    .seg-check { font-size: 18px; width: 0; margin-right: 0; opacity: 0; overflow: hidden; transition: width 0.3s cubic-bezier(0.2, 0, 0, 1), margin 0.3s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s; }
    .seg-active .seg-check { width: 18px; margin-right: 8px; opacity: 1; }

    /* Snackbar */
    #snackbar-host { position: fixed; z-index: 60; left: 16px; right: 88px; bottom: 112px; pointer-events: none; display: flex; }
    @media (min-width: 640px) { #snackbar-host { left: 104px; right: auto; bottom: 24px; width: min(672px, calc(100% - 128px)); } }
    @media (min-width: 1024px) { #snackbar-host { left: 280px; width: min(672px, calc(100% - 304px)); } }
    .snackbar {
      pointer-events: auto; display: flex; align-items: center; gap: 4px; width: 100%; min-height: 48px;
      padding: 6px 8px 6px 16px; border-radius: 12px; background: #313033; color: #e6e1e5; font-size: 14px;
      box-shadow: 0 1px 3px 1px rgba(0,0,0,.15), 0 4px 8px 3px rgba(0,0,0,.15);
      animation: snack-in 0.4s cubic-bezier(0.05, 0.7, 0.1, 1);
    }
    .snackbar-out { animation: snack-out 0.2s ease forwards; }
    .snackbar-text { flex: 1; padding: 6px 0; }
    .snackbar-btn { position: relative; height: 40px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; color: #c5dccb; flex-shrink: 0; }
    .snackbar-btn::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity 0.2s; }
    .snackbar-btn:hover::after { opacity: 0.08; }
    .snackbar-btn:active::after { opacity: 0.12; }
    .snackbar-action { padding: 0 12px; font-weight: 700; font-size: 14px; }
    .snackbar-close { width: 40px; color: #e6e1e5; }
    @keyframes snack-in { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes snack-out { to { opacity: 0; transform: translateY(8px); } }

    @media (prefers-color-scheme: dark) {
      .cg-btn { background: #3a4a3c; color: #c5dccb; }
      .cg-count { background: #4d2f20; color: #ffdbcc; }
      .seg, .seg-btn + .seg-btn { border-color: #5a4a3d; }
      .seg-btn { color: #e8d9c8; }
      .seg-active { background: #3a4a3c; color: #c5dccb; }
      .snackbar { background: #e3e2e6; color: #1a1b1e; }
      .snackbar-btn { color: #2d5436; }
      .snackbar-close { color: #1a1b1e; }
    }
    @media (prefers-reduced-motion: reduce) { .snackbar, .snackbar-out, .seg-check, .cg-btn { animation-duration: 0.01s; transition: none; } }

    /* Morphing menu -> menu_open icon (M3 Expressive spring) */
    #rail-menu-btn { --spring: cubic-bezier(0.34, 1.56, 0.64, 1); }
    .menu-morph { position: relative; display: block; width: 24px; height: 24px; }
    .mm-bar {
      position: absolute; left: 3px; width: 18px; height: 2px; border-radius: 1px;
      background: currentColor; transition: width 0.45s var(--spring);
    }
    .mm-top { top: 6px; } .mm-mid { top: 11px; } .mm-bot { top: 16px; }
    .mm-chev {
      position: absolute; inset: 0; width: 24px; height: 24px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      opacity: 0; transform: translateX(6px);
      transition: transform 0.45s var(--spring), opacity 0.2s ease;
    }
    #desktop-nav-rail.expanded .mm-top, #desktop-nav-rail.expanded .mm-bot { width: 13px; }
    #desktop-nav-rail.expanded .mm-mid { width: 10px; }
    #desktop-nav-rail.expanded .mm-chev { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .mm-bar, .mm-chev { transition: none; } }

    /* Hamburger alignment */
    #rail-menu-btn {
      align-self: flex-start !important;
      margin-left: 4px !important;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
    }
  </style>
</head>

<body class="flex flex-col sm:flex-row min-h-screen sm:h-screen w-full sm:overflow-hidden">

  <aside id="desktop-nav-rail" class="hidden sm:flex flex-col bg-[#efe4d6] dark:bg-[#1c1712] h-full z-40 py-6 px-3 shrink-0">
    
    <!-- Collapsible Rail Trigger Button -->
    <button id="rail-menu-btn" aria-label="Menú" aria-expanded="false" onclick="toggleRail()" class="mb-8 p-2 text-earth-800 dark:text-earth-200 rounded-full hover:bg-earth-200 dark:hover:bg-[#2e241d] transition-colors w-12 h-12 flex items-center justify-center shrink-0">
      <span class="menu-morph" aria-hidden="true"><span class="mm-bar mm-top"></span><span class="mm-bar mm-mid"></span><span class="mm-bar mm-bot"></span><svg class="mm-chev" viewBox="0 0 24 24"><path d="M20 7.5 15.5 12 20 16.5"/></svg></span>
    </button>

    <!-- Contextual Rail FAB Menu for Plànol Page (Desktop / Tablet) -->
    <div id="rail-fab-slot" class="relative mb-6 h-14 w-full shrink-0">
    <div id="planol-fab-menu-rail" class="absolute inset-0">
      <!-- Main Trigger FAB for Plànol -->
      <button id="rail-fab-planol" onclick="togglePlanolFabMenu('rail')" class="bg-forest-700 hover:bg-forest-800 text-white shadow-md flex items-center gap-2 transition-all shrink-0 w-full" title="Importar i exportar">
        <span id="planol-fab-icon-rail" class="material-symbols-outlined text-2xl shrink-0 transition-transform duration-300">swap_vert</span>
        <span class="rail-label text-sm font-bold whitespace-nowrap">Importar i exportar</span>
      </button>

      <!-- Floating Sub-menu Items -->
      <div id="planol-fab-items-rail" class="hidden absolute left-full top-0 ml-3 z-50 flex-col gap-1.5 p-2 bg-earth-100 dark:bg-[#221b16] border border-earth-300 dark:border-[#3d3027] rounded-2xl shadow-2xl min-w-[160px] transition-all duration-200">
        <button onclick="exportData()" class="flex items-center gap-2 px-3 py-2 text-xs font-bold text-earth-900 dark:text-earth-100 hover:bg-forest-100 dark:hover:bg-[#2d4231] rounded-xl transition w-full justify-start whitespace-nowrap">
          <span class="material-symbols-outlined text-base text-forest-700 dark:text-forest-400">download</span>
          <span class="rail-label-sub">Exportar</span>
        </button>
        <button onclick="triggerImport()" class="flex items-center gap-2 px-3 py-2 text-xs font-bold text-earth-900 dark:text-earth-100 hover:bg-forest-100 dark:hover:bg-[#2d4231] rounded-xl transition w-full justify-start whitespace-nowrap">
          <span class="material-symbols-outlined text-base text-forest-700 dark:text-forest-400">upload</span>
          <span class="rail-label-sub">Importar</span>
        </button>
      </div>
    </div>

    <!-- Contextual Rail FAB for History CSV -->
    <button id="rail-fab-export" onclick="exportHistoryCSV()" class="hidden bg-forest-700 hover:bg-forest-800 text-white shadow-md flex items-center gap-2 transition-all shrink-0" title="Exportar historial a CSV">
      <span class="material-symbols-outlined text-2xl shrink-0" style="width:24px;height:24px;line-height:0"><svg viewBox="0 0 24 24" width="24" height="24" style="display:block" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19h14"/><g class="dl-arrow"><path d="M12 4v10M7.5 10 12 14.5 16.5 10"/></g></svg></span>
      <span class="rail-label text-sm font-bold whitespace-nowrap">Exportar CSV</span>
    </button>
    </div>

    <!-- Rail Navigation Items -->
    <div class="flex flex-col gap-3 w-full">
      <button id="tab-grid" onclick="switchView('grid')" class="rail-item rail-active flex items-center font-bold text-earth-800 dark:text-earth-200" data-label="Plànol">
        <span class="rail-icon-wrap">
          <span class="material-symbols-outlined text-[24px]">grid_view</span>
        </span>
        <span class="rail-label text-sm">Plànol</span>
      </button>
      
      <button id="tab-summary" onclick="switchView('summary')" class="rail-item flex items-center font-bold text-earth-800 dark:text-earth-200 hover:bg-earth-200 dark:hover:bg-[#2e241d] transition" data-label="Resum">
        <span class="rail-icon-wrap">
          <span class="material-symbols-outlined text-[24px]">summarize</span>
        </span>
        <span class="rail-label text-sm">Resum</span>
      </button>
      
      <button id="tab-history" onclick="switchView('history')" class="rail-item flex items-center font-bold text-earth-800 dark:text-earth-200 hover:bg-earth-200 dark:hover:bg-[#2e241d] transition" data-label="Historial">
        <span class="rail-icon-wrap">
          <span class="material-symbols-outlined text-[24px]">history</span>
        </span>
        <span class="rail-label text-sm">Historial</span>
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col items-center w-full sm:h-full sm:overflow-y-auto pb-28 sm:pb-10 relative">

    <header class="w-full max-w-5xl p-4 flex justify-between items-center bg-forest-800 dark:bg-[#1a2f20] text-forest-50 shadow-lg rounded-b-2xl border-b border-forest-900/20 shrink-0 sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <span class="material-symbols-outlined text-2xl text-terracotta-500">potted_plant</span>
        <h1 class="text-xl sm:text-2xl font-bold tracking-wide">Gestor de l'hort</h1>
      </div>
    </header>

    <!-- Global Hidden Input for JSON Data Import -->
    <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">

    <main class="w-full max-w-5xl p-4 sm:p-6 flex flex-col items-center flex-1 gap-6 shrink-0">
      
      <!-- Plànol View Section -->
      <div id="view-grid" class="w-full flex flex-col gap-3">
      <div class="w-full flex items-center justify-center gap-3 px-1">
        <div class="cg" role="group" aria-label="Columnes">
          <button id="col-remove-btn" onclick="removeColumn()" class="cg-btn cg-first" aria-label="Eliminar columna" title="Eliminar columna"><span class="material-symbols-outlined">remove</span></button>
          <span id="cols-count" class="cg-count" aria-live="polite">8 columnes</span>
          <button id="col-add-btn" onclick="addColumn()" class="cg-btn cg-last" aria-label="Afegir columna" title="Afegir columna"><span class="material-symbols-outlined">add</span></button>
        </div>
      </div>
      <section id="grid-scroll" class="w-full overflow-x-auto bg-earth-200 dark:bg-[#1a1410] p-4 sm:p-6 rounded-3xl shadow-inner flex justify-start sm:justify-center items-center border border-earth-300/40 dark:border-[#3d3027]/40">
        <div id="grid-container" class="grid w-max sm:w-auto sm:mx-auto bg-earth-300 dark:bg-[#2b211a] p-4 sm:p-6 rounded-2xl shadow-md border-2 border-earth-600 dark:border-[#4a3b30] gap-x-6 gap-y-4">
          <!-- Cells generated dynamically via JS -->
        </div>
      </section>
      </div>

      <section id="view-summary" class="w-full hidden flex-col gap-6">
        <div class="bg-gradient-to-r from-forest-800 to-forest-700 dark:from-[#1a2f20] dark:to-[#16281b] text-forest-50 p-5 rounded-2xl shadow-md flex items-center justify-between">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-4xl text-terracotta-500">analytics</span>
            <div>
              <h2 class="font-bold text-lg">Resum visual de cultius actius</h2>
              <p class="text-xs text-forest-100 opacity-90">Visió ràpida de quantitats, proporcions i dates a l'hort</p>
            </div>
          </div>
          <div id="summary-total-badge" class="bg-forest-900/60 dark:bg-[#0d1710] border border-forest-500/40 px-4 py-2 rounded-xl text-right">
            <!-- Injected by JS -->
          </div>
        </div>

        <div class="bg-white dark:bg-[#221b16] border border-earth-300 dark:border-[#3d3027] rounded-2xl p-4 sm:p-6 shadow-sm">

  <script>
    const ROWS = 4;
    let cols = 8;
    let activeSideKey = null;
    let harvestingCropIndex = null;
    let historyViewMode = 'detailed'; 
    let isMobileSearchOpen = false;

    function togglePlanolFabMenu(target) {
      const menu = document.getElementById(target === 'mobile' ? 'planol-fab-items-mobile' : 'planol-fab-items-rail');
      const icon = document.getElementById(target === 'mobile' ? 'planol-fab-icon-mobile' : 'planol-fab-icon-rail');
      if (!menu) return;
      const isOpen = !menu.classList.contains('hidden');
      if (isOpen) {
        menu.classList.add('hidden');
        if (icon) {
          icon.style.transform = target === 'rail' ? 'translateY(-50%) rotate(0deg)' : 'rotate(0deg)';
        }
      } else {
        menu.classList.remove('hidden');
        if (icon) {
          icon.style.transform = target === 'rail' ? 'translateY(-50%) rotate(180deg)' : 'rotate(180deg)';
        }
      }
    }

    function closePlanolFabMenu() {
      ['mobile', 'rail'].forEach(target => {
        const menu = document.getElementById(target === 'mobile' ? 'planol-fab-items-mobile' : 'planol-fab-items-rail');
        const icon = document.getElementById(target === 'mobile' ? 'planol-fab-icon-mobile' : 'planol-fab-icon-rail');
        if (menu) menu.classList.add('hidden');
        if (icon) {
          icon.style.transform = target === 'rail' ? 'translateY(-50%) rotate(0deg)' : 'rotate(0deg)';
        }
      });
    }

    function triggerImport() {
      const importInput = document.getElementById('import-file');
      if (importInput) {
        importInput.click();
      }
      closePlanolFabMenu();
    }

    function initNavRail() {
      const rail = document.getElementById('desktop-nav-rail');
      if (!rail) return;
      if (window.innerWidth >= 1024) {
        rail.classList.add('expanded');
      } else {
        rail.classList.remove('expanded');
      }
      document.getElementById('rail-menu-btn').setAttribute('aria-expanded', rail.classList.contains('expanded'));
    }

    function toggleRail() {
      const rail = document.getElementById('desktop-nav-rail');
      if (!rail) return;
      rail.classList.toggle('expanded');
      document.getElementById('rail-menu-btn').setAttribute('aria-expanded', rail.classList.contains('expanded'));
    }

    function toggleMobileSearch(open) {
      isMobileSearchOpen = open;
      const searchWrapper = document.getElementById('history-search-wrapper');
      const toggleBtn = document.getElementById('mobile-search-toggle-btn');
      const dateFilters = document.getElementById('date-filters-container');

      if (open) {
        searchWrapper.classList.remove('hidden');
        searchWrapper.classList.add('flex', 'flex-1');
        toggleBtn.classList.add('hidden');
        if (dateFilters) dateFilters.classList.add('hidden');
        const searchInput = document.getElementById('history-search');
        if (searchInput) searchInput.focus();
      } else {
        searchWrapper.classList.remove('flex', 'flex-1');
        searchWrapper.classList.add('hidden');
        toggleBtn.classList.remove('hidden');
        if (dateFilters) dateFilters.classList.remove('hidden');
      }
    }

    const PRESET_PLANTS = [
      "Porros", "Col de Saboya / Savoy", "Col Manresana", "Espinacs",
      "Api", "Julivert", "Bledes", "Fulla de Roure Vermell",
      "Francesca / Cogollos", "Carbassó", "Tomàquet", "Ceba"
    ];

    const EMOJI_PALETTE = ['🍅', '🧅', '🌿', '🥬', '🍃', '🌱', '🥒', '🥕', '🥔', '🧄', '🌶️', '🌽', '🍆', '🥦', '🍄', '🫛', '🫑', '🌻', '🍓', '🍎', '🍋', '🍇', '🌾', '🫒'];

    let appData = {
      cols: 8,
      cellSides: {},
      history: [],
      customPlants: []
    };

    document.addEventListener('DOMContentLoaded', () => {
      initNavRail();
      loadSavedData();
      renderGrid();

      // Close FAB menus when clicking outside
      document.addEventListener('click', (e) => {
        const railMenu = document.getElementById('planol-fab-menu-rail');
        const mobileMenu = document.getElementById('planol-fab-menu-mobile');
        if (railMenu && !railMenu.contains(e.target) && mobileMenu && !mobileMenu.contains(e.target)) {
          closePlanolFabMenu();
        }
      });
    });

    function saveData() {
      appData.cols = cols;
      localStorage.setItem('allotment_data_v10', JSON.stringify(appData));
    }

    function loadSavedData() {
      const saved = localStorage.getItem('allotment_data_v10');
      if (saved) {
        try {
          appData = JSON.parse(saved);
          cols = appData.cols || 8;
          if (!appData.history) appData.history = [];
          if (!appData.cellSides) appData.cellSides = {};
          if (!appData.customPlants) appData.customPlants = [];
        } catch (e) {
          console.error("Error carregant localStorage", e);
        }
      }
    }

    function switchView(view) {
      const gridSec = document.getElementById('view-grid');
      const sumSec = document.getElementById('view-summary');
      const histSec = document.getElementById('view-history');
      
      const tabGrid = document.getElementById('tab-grid');
      const tabSum = document.getElementById('tab-summary');
      const tabHist = document.getElementById('tab-history');

      const bPillGrid = document.getElementById('bottom-pill-grid');
      const bLabelGrid = document.getElementById('bottom-label-grid');
      const bPillSum = document.getElementById('bottom-pill-summary');
      const bLabelSum = document.getElementById('bottom-label-summary');
      const bPillHist = document.getElementById('bottom-pill-history');
      const bLabelHist = document.getElementById('bottom-label-history');


      [tabGrid, tabSum, tabHist].forEach(t => {
        if (t) {
          t.classList.remove('rail-active');
          t.className = "rail-item flex items-center font-bold text-earth-800 dark:text-earth-200 hover:bg-earth-200 dark:hover:bg-[#2e241d] transition";
        }
      });

      if (bPillGrid && bLabelGrid && bPillSum && bLabelSum && bPillHist && bLabelHist) {
        const pillInactive = "nav-pill w-16 h-8 rounded-full flex items-center justify-center text-earth-700 dark:text-earth-400";
        const labelInactive = "text-[11px] font-medium mt-1 text-earth-700 dark:text-earth-400";

        bPillGrid.className = pillInactive;
        bLabelGrid.className = labelInactive;
        bPillSum.className = pillInactive;
        bLabelSum.className = labelInactive;
        bPillHist.className = pillInactive;
        bLabelHist.className = labelInactive;
      }

      [gridSec, sumSec, histSec].forEach(s => s.classList.add('hidden'));

      // Contextual Rail CSV Export FAB for History View
      const railFab = document.getElementById('rail-fab-export');
      if (railFab) {
        if (view === 'history') {
          railFab.classList.remove('hidden');
          railFab.classList.add('flex');
        } else {
          railFab.classList.add('hidden');
          railFab.classList.remove('flex');
        }
      }

      // Contextual Plànol FAB Menu Visibility
      const planolFabMobile = document.getElementById('planol-fab-menu-mobile');
      const planolFabRail = document.getElementById('planol-fab-menu-rail');

      if (view === 'grid') {
        if (planolFabMobile) planolFabMobile.classList.remove('hidden');
        if (planolFabRail) planolFabRail.classList.remove('hidden');
      } else {
        if (planolFabMobile) planolFabMobile.classList.add('hidden');
        if (planolFabRail) planolFabRail.classList.add('hidden');
        closePlanolFabMenu();
      }

      if (view === 'grid') {
        gridSec.classList.remove('hidden');
        if (tabGrid) tabGrid.className = "rail-item rail-active flex items-center font-bold text-earth-800 dark:text-earth-200";
        if (bPillGrid) bPillGrid.className = "nav-pill nav-active w-16 h-8 rounded-full flex items-center justify-center text-[#1a3120] dark:text-[#c5dccb]";
        if (bLabelGrid) bLabelGrid.className = "text-[11px] font-bold mt-1 text-earth-900 dark:text-earth-100";
      } else if (view === 'summary') {
        sumSec.classList.remove('hidden');
        if (tabSum) tabSum.className = "rail-item rail-active flex items-center font-bold text-earth-800 dark:text-earth-200";
        if (bPillSum) bPillSum.className = "nav-pill nav-active w-16 h-8 rounded-full flex items-center justify-center text-[#1a3120] dark:text-[#c5dccb]";
        if (bLabelSum) bLabelSum.className = "text-[11px] font-bold mt-1 text-earth-900 dark:text-earth-100";
        renderSummaryView();
      } else {
        histSec.classList.remove('hidden');
        if (tabHist) tabHist.className = "rail-item rail-active flex items-center font-bold text-earth-800 dark:text-earth-200";
        if (bPillHist) bPillHist.className = "nav-pill nav-active w-16 h-8 rounded-full flex items-center justify-center text-[#1a3120] dark:text-[#c5dccb]";
        if (bLabelHist) bLabelHist.className = "text-[11px] font-bold mt-1 text-earth-900 dark:text-earth-100";
        renderHistoryTable();
      }
    }

    function addColumn() {
      cols++;
      saveData();
      renderGrid();
    }

    function lastColumnHasPlants() {
      for (let r = 0; r < ROWS; r++) {
        for (const side of ['left', 'right']) {
          if ((appData.cellSides[`${r}-${cols - 1}-${side}`] || []).length > 0) return true;
        }
      }
      return false;
    }

    function updateColumnControls() {
      const rm = document.getElementById('col-remove-btn');
      const cnt = document.getElementById('cols-count');
      if (!rm || !cnt) return;
      cnt.textContent = `${cols} ${cols === 1 ? 'columna' : 'columnes'}`;
      const blocked = cols <= 1 || lastColumnHasPlants();
      rm.setAttribute('aria-disabled', blocked);
      rm.classList.toggle('cg-disabled', blocked);
      rm.title = blocked ? (cols <= 1 ? 'Cal almenys una columna' : "Buida l'última columna per poder eliminar-la") : 'Eliminar columna';
    }

    function removeColumn() {
      if (cols <= 1) return;
      if (lastColumnHasPlants()) {
        showSnackbar("L'última columna té plantes. Buida-la abans d'eliminar-la.");
        return;
      }
      cols--;
      saveData();
      renderGrid();
      showSnackbar('Columna eliminada', 'Desfés', () => addColumn());
    }

    function renderGrid() {
      const container = document.getElementById('grid-container');
      updateColumnControls();
      container.style.gridTemplateColumns = `repeat(${cols}, minmax(52px, 1fr))`;
      container.innerHTML = '';

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('div');
          cell.className = "relative w-10 sm:w-14 h-28 sm:h-36 rounded-2xl border border-earth-600/50 dark:border-[#4a3b30] cell-brown flex items-center justify-center select-none shadow-sm overflow-hidden";
          appendVerticalSidesToCell(cell, r, c);
          container.appendChild(cell);
        }
      }
    }

    function appendVerticalSidesToCell(cell, r, c) {
      const sides = [
        { id: 'left', class: 'absolute top-0 bottom-0 left-0 w-1/3 rounded-l-2xl border-r border-[#422a1b] dark:border-[#2b1d14]' },
        { id: 'right', class: 'absolute top-0 bottom-0 right-0 w-1/3 rounded-r-2xl border-l border-[#422a1b] dark:border-[#2b1d14]' }
      ];

      sides.forEach(s => {
        const sideKey = `${r}-${c}-${s.id}`;
        const crops = appData.cellSides[sideKey] || [];

        const sideEl = document.createElement('div');
        sideEl.className = `absolute ${s.class} side-spot cursor-pointer flex flex-col items-center justify-center transition-colors ${crops.length > 0 ? 'bg-forest-500/90 text-white font-bold' : 'bg-transparent'}`;

        if (crops.length > 0) {
          const firstPlantName = crops[0].plantName || '';
          const emoji = crops[0].emoji || getPlantEmoji(firstPlantName);
          const totalQty = crops.reduce((sum, item) => sum + (parseInt(item.plantQty, 10) || 0), 0);
          
          sideEl.innerHTML = `
            <span class="text-xs pointer-events-none mb-0.5">${emoji}</span>
            <span class="text-[9px] leading-none pointer-events-none bg-forest-900/60 px-1 py-0.5 rounded">${totalQty}</span>
          `;
          sideEl.title = crops.map(cp => `${cp.plantName}: ${cp.plantQty}`).join(', ');
        }

        sideEl.onclick = (e) => {
          e.stopPropagation();
          openPlantModal(sideKey, r, c, s.id);
        };

        cell.appendChild(sideEl);
      });
    }

    let currentCropsWorkingCopy = [];

    function openPlantModal(sideKey, r, c, sideId) {
      activeSideKey = sideKey;
      const sidesNames = { left: 'Esquerra', right: 'Dreta' };
      document.getElementById('modal-title').textContent = `Cel·la (${r + 1}, ${c + 1}) - Costat ${sidesNames[sideId]}`;

      const existing = appData.cellSides[sideKey] || [];
      currentCropsWorkingCopy = JSON.parse(JSON.stringify(existing));
      if (currentCropsWorkingCopy.length === 0) {
        currentCropsWorkingCopy.push(createNewCropObject());
      }

      renderModalCrops();
      document.getElementById('plant-modal').classList.remove('hidden');
    }

    function createNewCropObject() {
      return {
        plantName: '',
        plantQty: 1,
        plantDate: new Date().toISOString().slice(0, 10),
        emoji: '🌱',
        notes: []
      };
    }

    function renderModalCrops() {
      const container = document.getElementById('modal-crops-container');
      container.innerHTML = '';

      const allAvailablePlants = [...PRESET_PLANTS, ...(appData.customPlants || [])];

      currentCropsWorkingCopy.forEach((crop, idx) => {
        if (idx > 0) {
          const divider = document.createElement('div');
          divider.className = "my-6 border-t border-earth-300 dark:border-[#3d3027]";
          container.appendChild(divider);
        }

        const block = document.createElement('div');
        block.className = "bg-white dark:bg-[#221b16] p-4 sm:p-5 rounded-2xl border border-earth-300 dark:border-[#3d3027] shadow-sm space-y-3";

        let optionsHtml = allAvailablePlants.map(p => `<option value="${p}" ${crop.plantName === p ? 'selected' : ''}>${p}</option>`).join('');
        const currentEmoji = crop.emoji || getPlantEmoji(crop.plantName);

        block.innerHTML = `
          <div class="flex justify-between items-center flex-wrap gap-2">
            <span class="text-xs font-bold text-forest-800 dark:text-forest-200 uppercase tracking-wider">Cultiu #${idx + 1}</span>
            <div class="flex items-center gap-2">
              <button onclick="promptHarvest(${idx})" type="button" class="px-3 py-1.5 bg-terracotta-500 hover:bg-terracotta-600 text-white rounded-xl text-xs font-bold flex items-center gap-1 transition shadow-sm">
                <span class="material-symbols-outlined text-sm">agriculture</span> Moure a collit
              </button>
              <button onclick="removeCropBlock(${idx})" type="button" class="text-red-600 dark:text-red-400 hover:text-red-800 p-1 rounded-xl text-xs font-bold flex items-center gap-0.5 bg-red-50 dark:bg-red-950/40 hover:bg-red-100 transition px-2.5 py-1.5">
                <span class="material-symbols-outlined text-sm">delete</span> Eliminar
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="block text-[11px] font-bold text-earth-800 dark:text-earth-200">Nom de la planta</label>
                <div class="flex items-center gap-2">
                  <div class="relative">
                    <button type="button" onclick="toggleEmojiPicker(${idx})" class="w-7 h-7 bg-earth-200 dark:bg-[#2e241d] hover:bg-earth-300 dark:hover:bg-[#3d3027] rounded-lg flex items-center justify-center text-base transition shadow-sm" title="Canviar emoji">
                      ${currentEmoji}
                    </button>
                    <div id="emoji-picker-${idx}" class="absolute right-0 top-9 z-20 bg-white dark:bg-[#221b16] border border-earth-300 dark:border-[#3d3027] rounded-2xl shadow-xl p-2.5 hidden grid grid-cols-6 gap-1 w-52">
                      ${EMOJI_PALETTE.map(em => `<button type="button" onclick="selectCropEmoji(${idx}, '${em}')" class="w-7 h-7 hover:bg-earth-200 dark:hover:bg-[#2e241d] rounded-lg flex items-center justify-center text-base transition">${em}</button>`).join('')}
                    </div>
                  </div>
                  <button onclick="toggleCustomPlantInput(${idx})" type="button" class="text-[10px] text-forest-700 dark:text-forest-400 hover:underline font-bold flex items-center gap-0.5">
                    <span class="material-symbols-outlined text-xs">add_circle</span> Afegir personalitzada
                  </button>
                </div>
              </div>
              <select id="select-crop-${idx}" onchange="updateCropField(${idx}, 'plantName', this.value)" class="w-full bg-earth-50 dark:bg-[#1b1511] dark:text-earth-100 border border-earth-300 dark:border-[#3d3027] rounded-xl p-2.5 text-xs text-earth-900 focus:outline-none focus:ring-2 focus:ring-forest-500">
                <option value="">-- Selecciona planta --</option>
                ${optionsHtml}
              </select>
              <div id="custom-input-box-${idx}" class="hidden mt-2 flex gap-1">
                <input type="text" id="custom-plant-name-${idx}" placeholder="Nom de la nova planta..." class="w-full bg-earth-50 dark:bg-[#1b1511] dark:text-earth-100 border border-earth-300 dark:border-[#3d3027] rounded-xl p-2 text-xs text-earth-900 focus:outline-none focus:ring-2 focus:ring-forest-500">
                <button onclick="saveCustomPlant(${idx})" type="button" class="px-3 bg-forest-700 text-white rounded-xl text-xs font-bold hover:bg-forest-800 transition">Desar</button>
              </div>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-earth-800 dark:text-earth-200 mb-1">Quantitat plantada</label>
              <input type="number" min="1" value="${crop.plantQty || 1}" oninput="updateCropField(${idx}, 'plantQty', this.value)" class="w-full bg-earth-50 dark:bg-[#1b1511] dark:text-earth-100 border border-earth-300 dark:border-[#3d3027] rounded-xl p-2.5 text-xs text-earth-900 focus:outline-none focus:ring-2 focus:ring-forest-500">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold text-earth-800 dark:text-earth-200 mb-1">Data de plantació</label>
            <input type="date" value="${crop.plantDate || ''}" onchange="updateCropField(${idx}, 'plantDate', this.value)" class="w-full bg-earth-50 dark:bg-[#1b1511] dark:text-earth-100 border border-earth-300 dark:border-[#3d3027] rounded-xl p-2.5 text-xs text-earth-900 focus:outline-none focus:ring-2 focus:ring-forest-500">
          </div>

          <div class="bg-earth-50 dark:bg-[#191310] p-3 rounded-xl border border-earth-200 dark:border-[#3d3027] space-y-2">
            <label class="block text-[11px] font-bold text-earth-800 dark:text-earth-200 flex items-center gap-1">
              <span class="material-symbols-outlined text-sm">notes</span> Notes del cultiu
            </label>
            <div class="space-y-1 max-h-28 overflow-y-auto pr-1">
              ${(crop.notes && crop.notes.length > 0) ? crop.notes.map((n, nIdx) => `
                <div class="flex items-center justify-between bg-white dark:bg-[#221b16] px-2.5 py-1.5 rounded-lg border border-earth-200 dark:border-[#3d3027] text-xs">
                  <div>
                    <span class="text-[10px] text-earth-600 dark:text-earth-400 font-semibold mr-2">${n.date}</span>
                    <span class="text-earth-900 dark:text-earth-100">${n.text}</span>
                  </div>
                  <button onclick="removeNoteFromCrop(${idx}, ${nIdx})" type="button" class="text-red-500 hover:text-red-700 text-xs font-bold ml-2 p-1">×</button>
                </div>
              `).join('') : '<p class="text-[11px] text-earth-600 dark:text-earth-400 italic">Encara no hi ha notes registrades per a aquest cultiu.</p>'}
            </div>
            <div class="flex gap-1.5 mt-2">
              <input type="text" id="note-input-${idx}" placeholder="Escriu una nova nota..." class="w-full bg-white dark:bg-[#1b1511] dark:text-earth-100 border border-earth-300 dark:border-[#3d3027] rounded-xl p-2 text-xs text-earth-900 focus:outline-none focus:ring-2 focus:ring-forest-500">
              <button type="button" onclick="addNoteToCrop(${idx})" class="px-3 bg-forest-700 text-white rounded-xl text-xs font-bold hover:bg-forest-800 transition">Afegir</button>
            </div>
          </div>
        `;
        container.appendChild(block);
      });
    }

    function toggleEmojiPicker(idx) {
      const picker = document.getElementById(`emoji-picker-${idx}`);
      if (picker) {
        picker.classList.toggle('hidden');
      }
    }

    function selectCropEmoji(idx, emoji) {
      currentCropsWorkingCopy[idx].emoji = emoji;
      toggleEmojiPicker(idx);
      renderModalCrops();
    }

    function promptHarvest(idx) {
      harvestingCropIndex = idx;
      const crop = currentCropsWorkingCopy[idx];
      if (!crop.plantName || crop.plantName.trim() === '') {
        alertBox("Selecciona primer un nom de planta abans de collir.");
        return;
      }
      document.getElementById('harvest-plant-label').textContent = `Cultiu: ${crop.plantName}`;
      document.getElementById('harvest-modal-qty').value = crop.plantQty || 1;
      document.getElementById('harvest-modal-date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('harvest-modal').classList.remove('hidden');
    }

    function closeHarvestModal() {
      document.getElementById('harvest-modal').classList.add('hidden');
      harvestingCropIndex = null;
    }

    function confirmHarvest() {
      if (harvestingCropIndex === null) return;
      const crop = currentCropsWorkingCopy[harvestingCropIndex];
      const qty = document.getElementById('harvest-modal-qty').value;
      const date = document.getElementById('harvest-modal-date').value;

      appData.history.push({
        id: Date.now() + Math.random(),
        plantName: crop.plantName,
        plantQty: crop.plantQty,
        plantDate: crop.plantDate || new Date().toISOString().slice(0, 10),
        harvestDate: date,
        harvestQty: qty,
        emoji: crop.emoji || getPlantEmoji(crop.plantName),
        notes: crop.notes ? JSON.parse(JSON.stringify(crop.notes)) : []
      });

      currentCropsWorkingCopy.splice(harvestingCropIndex, 1);

      saveCellCropsSilently();

      closeHarvestModal();
      closeModal();

      renderGrid();

      alertBox(`Cultiu "${crop.plantName}" col·lectat i mogut a l'historial!`);
    }

    function addNoteToCrop(idx) {
      const input = document.getElementById(`note-input-${idx}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;

      if (!currentCropsWorkingCopy[idx].notes) {
        currentCropsWorkingCopy[idx].notes = [];
      }
      currentCropsWorkingCopy[idx].notes.push({
        text: val,
        date: new Date().toISOString().slice(0, 10)
      });
      input.value = '';
      renderModalCrops();
    }

    function removeNoteFromCrop(cropIdx, noteIdx) {
      if (currentCropsWorkingCopy[cropIdx].notes) {
        currentCropsWorkingCopy[cropIdx].notes.splice(noteIdx, 1);
        renderModalCrops();
      }
    }

    function saveCellCropsSilently() {
      const validCrops = currentCropsWorkingCopy.filter(c => c.plantName && c.plantName.trim() !== '');
      if (validCrops.length > 0) {
        appData.cellSides[activeSideKey] = validCrops;
      } else {
        delete appData.cellSides[activeSideKey];
      }
      saveData();
    }

    function toggleCustomPlantInput(idx) {
      const box = document.getElementById(`custom-input-box-${idx}`);
      if (box) {
        box.classList.toggle('hidden');
      }
    }

    function saveCustomPlant(idx) {
      const input = document.getElementById(`custom-plant-name-${idx}`);
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;

      if (!appData.customPlants) appData.customPlants = [];
      if (!appData.customPlants.includes(val) && !PRESET_PLANTS.includes(val)) {
        appData.customPlants.push(val);
      }

      currentCropsWorkingCopy[idx].plantName = val;
      currentCropsWorkingCopy[idx].emoji = getPlantEmoji(val);
      saveData();
      renderModalCrops();
    }

    function updateCropField(idx, field, val) {
      currentCropsWorkingCopy[idx][field] = val;
      if (field === 'plantName') {
        currentCropsWorkingCopy[idx].emoji = getPlantEmoji(val);
        renderModalCrops();
      }
    }

    function addCropBlock() {
      currentCropsWorkingCopy.push(createNewCropObject());
      renderModalCrops();
    }

    function removeCropBlock(idx) {
      currentCropsWorkingCopy.splice(idx, 1);
      if (currentCropsWorkingCopy.length === 0) {
        currentCropsWorkingCopy.push(createNewCropObject());
      }
      renderModalCrops();
    }

    function closeModal() {
      document.getElementById('plant-modal').classList.add('hidden');
      activeSideKey = null;
    }

    function saveCellCrops() {
      currentCropsWorkingCopy.forEach((c, idx) => {
        const input = document.getElementById(`note-input-${idx}`);
        if (input && input.value.trim() !== '') {
          if (!c.notes) c.notes = [];
          c.notes.push({
            text: input.value.trim(),
            date: new Date().toISOString().slice(0, 10)
          });
        }
      });

      const validCrops = currentCropsWorkingCopy.filter(c => c.plantName && c.plantName.trim() !== '');
      
      if (validCrops.length > 0) {
        appData.cellSides[activeSideKey] = validCrops;
      } else {
        delete appData.cellSides[activeSideKey];
      }

      saveData();
      closeModal();
      renderGrid();
      alertBox("Canvis desats correctament!");
    }

    function getPlantEmoji(name) {
      const lower = (name || '').toLowerCase();
      if (lower.includes('tomàquet')) return '🍅';
      if (lower.includes('ceba')) return '🧅';
      if (lower.includes('porros') || lower.includes('porro')) return '🌿';
      if (lower.includes('col')) return '🥬';
      if (lower.includes('espinac')) return '🍃';
      if (lower.includes('api')) return '🌱';
      if (lower.includes('julivert')) return '🌿';
      if (lower.includes('bleda')) return '🥬';
      if (lower.includes('carbassó')) return '🥒';
      return '🌱';
    }

    function renderSummaryView() {
      const summaryContent = document.getElementById('summary-content');
      const totalBadge = document.getElementById('summary-total-badge');
      summaryContent.innerHTML = '';

      const counts = {};
      const emojisMap = {};
      const datesMap = {};
      let totalPlantsCount = 0;

      Object.values(appData.cellSides).forEach(cropsList => {
        cropsList.forEach(crop => {
          if (crop.plantName) {
            const qty = parseInt(crop.plantQty, 10) || 1;
            counts[crop.plantName] = (counts[crop.plantName] || 0) + qty;
            totalPlantsCount += qty;

            if (!emojisMap[crop.plantName]) {
              emojisMap[crop.plantName] = crop.emoji || getPlantEmoji(crop.plantName);
            }

            if (crop.plantDate) {
              if (!datesMap[crop.plantName]) {
                datesMap[crop.plantName] = new Set();
              }
              datesMap[crop.plantName].add(crop.plantDate);
            }
          }
        });
      });

      totalBadge.innerHTML = `
        <span class="text-[10px] uppercase font-bold tracking-wider block text-forest-200">Total unitats</span>
        <span class="text-xl font-black text-white">${totalPlantsCount}</span>
      `;

      const sortedCrops = Object.entries(counts).sort((a, b) => b[1] - a[1]);

      if (sortedCrops.length === 0) {
        summaryContent.innerHTML = `
          <div class="col-span-full py-10 text-center text-earth-600 dark:text-earth-400 text-sm">
            Encara no hi ha cap cultiu actiu a l'hort. Fes clic a una cel·la del plànol per començar a plantar!
          </div>
        `;
        return;
      }

      sortedCrops.forEach(([plantName, qty]) => {
        const emoji = emojisMap[plantName] || getPlantEmoji(plantName);
        const percentage = totalPlantsCount > 0 ? Math.round((qty / totalPlantsCount) * 100) : 0;
        const uniqueDates = datesMap[plantName] ? Array.from(datesMap[plantName]).sort().join(', ') : 'Sense data';

        const card = document.createElement('div');
        card.className = "bg-earth-50 dark:bg-[#191310] border border-earth-200 dark:border-[#3d3027] p-4 rounded-2xl flex flex-col justify-between gap-3 shadow-sm";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              <span class="text-2xl">${emoji}</span>
              <div>
                <span class="font-bold text-sm text-earth-900 dark:text-earth-100 block">${plantName}</span>
                <span class="text-[11px] text-earth-600 dark:text-earth-400 block">Plantació: ${uniqueDates}</span>
              </div>
            </div>
            <div class="text-right">
              <span class="bg-forest-100 dark:bg-[#16281b] text-forest-800 dark:text-forest-200 font-extrabold text-sm px-2.5 py-1 rounded-xl">${qty} u.</span>
            </div>
          </div>
          <div class="w-full bg-earth-200 dark:bg-[#2e241d] rounded-full h-2.5 overflow-hidden">
            <div class="bg-forest-600 h-full rounded-full transition-all duration-500" style="width: ${percentage}%"></div>
          </div>
        `;
        summaryContent.appendChild(card);
      });
    }

    function setHistoryViewMode(mode) {
      historyViewMode = mode;
      [['detailed','toggle-view-detailed'],['aggregated','toggle-view-aggregated']].forEach(([m,id]) => {
        const b = document.getElementById(id);
        b.classList.toggle('seg-active', m === mode);
        b.setAttribute('aria-pressed', m === mode);
      });
      renderHistoryTable();
    }

    function clearHistoryDateFilter() {
      document.getElementById('history-date-start').value = '';
      document.getElementById('history-date-end').value = '';
      renderHistoryTable();
    }

    function renderHistoryTable() {
      const thead = document.getElementById('history-table-head');
      const tbody = document.getElementById('history-table-body');
      const searchQuery = (document.getElementById('history-search').value || '').toLowerCase();
      const startDate = document.getElementById('history-date-start').value;
      const endDate = document.getElementById('history-date-end').value;

      tbody.innerHTML = '';

      const filtered = appData.history.filter(item => {
        const matchesName = (item.plantName || '').toLowerCase().includes(searchQuery);
        const pDate = item.plantDate || '';
        const matchesStart = !startDate || pDate >= startDate;
        const matchesEnd = !endDate || pDate <= endDate;
        return matchesName && matchesStart && matchesEnd;
      });

      if (historyViewMode === 'detailed') {
        thead.innerHTML = `
          <tr class="bg-forest-800 dark:bg-[#1a2f20] text-forest-50 font-bold uppercase text-[11px] tracking-wider">
            <th class="p-3">Hortalissa</th>
            <th class="p-3 text-center">Qtat. Plantada</th>
            <th class="p-3">Data Plantació</th>
            <th class="p-3">Data Recol·lecció</th>
            <th class="p-3 text-center">Qtat. Recol·lectada</th>
            <th class="p-3 text-center">Èxit</th>
            <th class="p-3 text-center">Accions / Notes</th>
          </tr>
        `;

        if (filtered.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="p-6 text-center text-earth-600 dark:text-earth-400">No s'han trobat registres a l'historial amb aquests filtres.</td>
            </tr>
          `;
          return;
        }

        filtered.slice().reverse().forEach(item => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-earth-50 dark:hover:bg-[#1b1511] transition group relative";
          const hasNotes = item.notes && item.notes.length > 0;
          
          const pQty = parseFloat(item.plantQty) || 1;
          const hQty = parseFloat(item.harvestQty) || 0;
          const successPct = Math.round((hQty / pQty) * 100);
          const clampedPct = Math.min(Math.max(successPct, 0), 100);
          const hue = Math.round(clampedPct * 1.2);
          const emoji = item.emoji || getPlantEmoji(item.plantName);

          tr.innerHTML = `
            <td class="p-3 font-bold flex items-center gap-2"><span>${emoji}</span> ${item.plantName}</td>
            <td class="p-3 text-center">${item.plantQty}</td>
            <td class="p-3">${item.plantDate}</td>
            <td class="p-3">${item.harvestDate}</td>
            <td class="p-3 text-center">${item.harvestQty}</td>
            <td class="p-3 text-center">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold inline-block" style="background-color: hsl(${hue}, 70%, 90%); color: hsl(${hue}, 80%, 25%); border: 1px solid hsl(${hue}, 60%, 75%);">
                ${successPct}%
              </span>
            </td>
            <td class="p-3 text-center">
              <div class="flex items-center justify-center gap-2">
                ${hasNotes ? `
                  <button onclick="openHistoryNotesModal('${item.id}')" class="px-2.5 py-1 bg-forest-700 hover:bg-forest-800 text-white rounded-lg text-xs font-bold flex items-center gap-1 transition shadow-sm">
                    <span class="material-symbols-outlined text-sm">visibility</span> Veure (${item.notes.length})
                  </button>
                ` : '<span class="text-earth-400 italic text-xs">Sense notes</span>'}
                <button onclick="deleteHistoryItem('${item.id}')" class="opacity-0 group-hover:opacity-100 transition-opacity p-1 bg-red-100 dark:bg-red-950 hover:bg-red-200 text-red-600 dark:text-red-400 rounded-lg" title="Eliminar registre">
                  <span class="material-symbols-outlined text-sm">delete</span>
                </button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });

      } else {
        thead.innerHTML = `
          <tr class="bg-forest-800 dark:bg-[#1a2f20] text-forest-50 font-bold uppercase text-[11px] tracking-wider">
            <th class="p-3">Hortalissa</th>
            <th class="p-3 text-center">Total Collites</th>
            <th class="p-3 text-center">Total Plantat</th>
            <th class="p-3 text-center">Total Recol·lectat</th>
            <th class="p-3 text-center">Èxit Mitjà</th>
            <th class="p-3 text-center">Notes / Registres</th>
          </tr>
        `;

        const groups = {};
        filtered.forEach(item => {
          const name = item.plantName;
          if (!groups[name]) {
            groups[name] = {
              plantName: name,
              emoji: item.emoji || getPlantEmoji(name),
              harvestCount: 0,
              totalPlantQty: 0,
              totalHarvestQty: 0,
              allNotes: []
            };
          }
          groups[name].harvestCount++;
          groups[name].totalPlantQty += parseFloat(item.plantQty) || 0;
          groups[name].totalHarvestQty += parseFloat(item.harvestQty) || 0;
          if (item.notes && item.notes.length > 0) {
            groups[name].allNotes.push(...item.notes);
          }
        });

        const aggregatedList = Object.values(groups).sort((a, b) => b.totalHarvestQty - a.totalHarvestQty);

        if (aggregatedList.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="p-6 text-center text-earth-600 dark:text-earth-400">No s'han trobat dades agrupades amb aquests filtres.</td>
            </tr>
          `;
          return;
        }

        aggregatedList.forEach(agg => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-earth-50 dark:hover:bg-[#1b1511] transition";
          
          const successPct = agg.totalPlantQty > 0 ? Math.round((agg.totalHarvestQty / agg.totalPlantQty) * 100) : 0;
          const clampedPct = Math.min(Math.max(successPct, 0), 100);
          const hue = Math.round(clampedPct * 1.2);

          tr.innerHTML = `
            <td class="p-3 font-bold flex items-center gap-2"><span>${agg.emoji}</span> ${agg.plantName}</td>
            <td class="p-3 text-center font-bold text-forest-800 dark:text-forest-200">${agg.harvestCount}</td>
            <td class="p-3 text-center">${agg.totalPlantQty}</td>
            <td class="p-3 text-center">${agg.totalHarvestQty}</td>
            <td class="p-3 text-center">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold inline-block" style="background-color: hsl(${hue}, 70%, 90%); color: hsl(${hue}, 80%, 25%); border: 1px solid hsl(${hue}, 60%, 75%);">
                ${successPct}%
              </span>
            </td>
            <td class="p-3 text-center">
              <span class="text-earth-700 dark:text-earth-300 text-xs font-semibold">${agg.allNotes.length} notes acumulades</span>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    function deleteHistoryItem(id) {
      appData.history = appData.history.filter(h => String(h.id) !== String(id));
      saveData();
      renderHistoryTable();
      alertBox("Registre eliminat de l'historial.");
    }

    function openHistoryNotesModal(itemId) {
      const item = appData.history.find(h => String(h.id) === String(itemId));
      if (!item || !item.notes) return;

      const container = document.getElementById('history-notes-container');
      container.innerHTML = '';

      item.notes.forEach(note => {
        const div = document.createElement('div');
        div.className = "bg-earth-50 dark:bg-[#191310] p-2.5 rounded-xl border border-earth-200 dark:border-[#3d3027] text-xs text-earth-900 dark:text-earth-100 space-y-1";
        div.innerHTML = `
          <div class="font-bold text-forest-800 dark:text-forest-300">${note.date}</div>
          <div>${note.text}</div>
        `;
        container.appendChild(div);
      });

      document.getElementById('history-notes-modal').classList.remove('hidden');
    }

    function closeHistoryNotesModal() {
      document.getElementById('history-notes-modal').classList.add('hidden');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `hort_data_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      closePlanolFabMenu();
    }

    function exportHistoryCSV() {
      document.querySelectorAll('.dl-arrow').forEach(a => { a.classList.remove('dl-anim'); void a.getBoundingClientRect(); a.classList.add('dl-anim'); clearTimeout(a._t); a._t = setTimeout(() => a.classList.remove('dl-anim'), 750); });
      const searchQuery = (document.getElementById('history-search').value || '').toLowerCase();
      const startDate = document.getElementById('history-date-start').value;
      const endDate = document.getElementById('history-date-end').value;

      const filtered = appData.history.filter(item => {
        const matchesName = (item.plantName || '').toLowerCase().includes(searchQuery);
        const pDate = item.plantDate || '';
        const matchesStart = !startDate || pDate >= startDate;
        const matchesEnd = !endDate || pDate <= endDate;
        return matchesName && matchesStart && matchesEnd;
      });

      let csvContent = "data:text/csv;charset=utf-8,";

      if (historyViewMode === 'detailed') {
        csvContent += "Hortalissa,Qtat Plantada,Data Plantacio,Data Recolleccio,Qtat Recollectada,Exit (%),Notes\n";
        filtered.slice().reverse().forEach(item => {
          const pQty = parseFloat(item.plantQty) || 1;
          const hQty = parseFloat(item.harvestQty) || 0;
          const successPct = pQty > 0 ? Math.round((hQty / pQty) * 100) : 0;
          const notesText = item.notes ? item.notes.map(n => `[${n.date}] ${n.text}`).join('; ') : '';
          
          const row = [
            `"${item.plantName.replace(/"/g, '""')}"`,
            item.plantQty,
            `"${item.plantDate || ''}"`,
            `"${item.harvestDate || ''}"`,
            item.harvestQty,
            `${successPct}%`,
            `"${notesText.replace(/"/g, '""')}"`
          ];
          csvContent += row.join(",") + "\n";
        });
      } else {
        csvContent += "Hortalissa,Total Collites,Total Plantat,Total Recollectat,Exit Mitja (%),Notes Acumulades\n";
        const groups = {};
        filtered.forEach(item => {
          const name = item.plantName;
          if (!groups[name]) {
            groups[name] = {
              plantName: name,
              harvestCount: 0,
              totalPlantQty: 0,
              totalHarvestQty: 0,
              allNotes: []
            };
          }
          groups[name].harvestCount++;
          groups[name].totalPlantQty += parseFloat(item.plantQty) || 0;
          groups[name].totalHarvestQty += parseFloat(item.harvestQty) || 0;
          if (item.notes && item.notes.length > 0) {
            groups[name].allNotes.push(...item.notes);
          }
        });

        const aggregatedList = Object.values(groups).sort((a, b) => b.totalHarvestQty - a.totalHarvestQty);
        aggregatedList.forEach(agg => {
          const successPct = agg.totalPlantQty > 0 ? Math.round((agg.totalHarvestQty / agg.totalPlantQty) * 100) : 0;
          const notesText = agg.allNotes.map(n => `[${n.date}] ${n.text}`).join('; ');

          const row = [
            `"${agg.plantName.replace(/"/g, '""')}"`,
            agg.harvestCount,
            agg.totalPlantQty,
            agg.totalHarvestQty,
            `${successPct}%`,
            `"${notesText.replace(/"/g, '""')}"`
          ];
          csvContent += row.join(",") + "\n";
        });
      }

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `historial_hort_${historyViewMode}_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
      alertBox("Historial exportat a CSV correctament!");
    }

    function importData(event) {
      const fileReader = new FileReader();
      if (event.target.files[0]) {
        fileReader.readAsText(event.target.files[0], "UTF-8");
        fileReader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed && parsed.cellSides) {
              appData = parsed;
              cols = appData.cols || 8;
              if (!appData.customPlants) appData.customPlants = [];
              saveData();
              renderGrid();
              alertBox("Dades importades correctament!");
            } else {
              alertBox("El fitxer no té un format vàlid.");
            }
          } catch (err) {
            alertBox("Error al llegir el fitxer JSON.");
          }
        };
      }
    }

    let snackTimer = null;
    function showSnackbar(msg, actionLabel, onAction) {
      const host = document.getElementById('snackbar-host');
      clearTimeout(snackTimer);
      host.innerHTML = '';
      const bar = document.createElement('div');
      bar.className = 'snackbar';
      bar.setAttribute('role', 'status');
      const text = document.createElement('span');
      text.className = 'snackbar-text';
      text.textContent = msg;
      bar.appendChild(text);
      const dismiss = () => { clearTimeout(snackTimer); bar.classList.add('snackbar-out'); setTimeout(() => bar.remove(), 200); };
      if (actionLabel) {
        const act = document.createElement('button');
        act.className = 'snackbar-btn snackbar-action';
        act.textContent = actionLabel;
        act.onclick = () => { dismiss(); if (onAction) onAction(); };
        const close = document.createElement('button');
        close.className = 'snackbar-btn snackbar-close';
        close.setAttribute('aria-label', 'Tancar');
        close.innerHTML = '<span class="material-symbols-outlined">close</span>';
        close.onclick = dismiss;
        bar.append(act, close);
      }
      host.appendChild(bar);
      snackTimer = setTimeout(dismiss, actionLabel ? 6000 : 4000);
    }

    function alertBox(msg) { showSnackbar(msg); }
  </script>
</body>
</html>
