      });
      pdEmoBind();
      pdCatPaint(); pdCatBind();
      pdRoving();
      pdValidate(); pdFitMenu();
    }

    // ===== Category field (M3 outlined select + menu). Arrow keys move, Enter / Space pick, Escape closes. =====
    function pdCatPaint() {
      const f = document.getElementById('pd-cat'); if (!f || !pd) return;
      const c = catInfo(pd.category) || CAT_NONE;
      document.getElementById('pd-cat-ic').textContent = c.icon;
      document.getElementById('pd-cat-v').textContent = c.label;
      f.classList.toggle('none', !catInfo(pd.category));
      pdCatFill();
    }
    // The menu is always filled (hidden), so its height is known before it opens
    function pdCatFill() {
      const m = document.getElementById('pd-cat-menu'); if (!m || !pd) return;
      const opt = c => {
        const sel = (c.id === 'none' ? '' : c.id) === (pd.category || '');
        return `<button type="button" class="pp-mi" role="option" tabindex="-1" data-cat="${c.id}" aria-selected="${sel}"><span class="material-symbols-outlined pp-e" aria-hidden="true">${c.icon}</span><span class="pp-l">${c.label}</span>${sel ? '<span class="material-symbols-outlined pp-ck" aria-hidden="true">check</span>' : ''}</button>`;
      };
      m.innerHTML = CATS.map(opt).join('') + '<div class="pp-div" role="separator"></div>' + opt(CAT_NONE);
    }
    // The form reserves room below the Categoria field for the whole menu, so the dialog opens tall enough
    // and opening the menu never needs a scroll (offsets, not rects: the dialog is scaled while it animates in)
    function pdFitMenu() {
      const form = document.getElementById('pd-form'), w = document.getElementById('pd-catf'), m = document.getElementById('pd-cat-menu');
      if (!form || !w || !m) return;
      form.style.minHeight = '';
      const need = w.offsetTop + w.offsetHeight + 4 + m.offsetHeight + 8;
      if (need > form.offsetHeight) form.style.minHeight = need + 'px';
    }
    const pdCatIsOpen = () => { const m = document.getElementById('pd-cat-menu'); return !!m && m.classList.contains('open'); };
    function pdCatOpen() {
      const m = document.getElementById('pd-cat-menu'), f = document.getElementById('pd-cat'); if (!m || !pd) return;
      pdCatFill();
      // Open downwards if it fits in the visible dialog; otherwise towards the side with more room, scrolling inside itself
      const br = document.getElementById('pd-body').getBoundingClientRect(), fr = f.getBoundingClientRect();
      const below = br.bottom - fr.bottom - 12, above = fr.top - br.top - 12;
      m.style.maxHeight = '';
      const h = m.offsetHeight, up = h > below && above > below;
      m.classList.toggle('up', up);
      const room = up ? above : below;
      if (h > room) m.style.maxHeight = Math.max(160, room) + 'px';
      m.classList.add('open'); f.setAttribute('aria-expanded', 'true'); f.parentElement.classList.add('open');
      (m.querySelector('.pp-mi[aria-selected="true"]') || m.querySelector('.pp-mi')).focus({ preventScroll: false });
    }
    function pdCatClose(focusField) {
      const m = document.getElementById('pd-cat-menu'), f = document.getElementById('pd-cat'); if (!m) return;
      m.classList.remove('open'); f.setAttribute('aria-expanded', 'false'); f.parentElement.classList.remove('open');
      if (focusField) f.focus({ preventScroll: true });
    }
    function pdCatToggle() { if (pdCatIsOpen()) pdCatClose(true); else pdCatOpen(); }
    function pdCatSet(id) { pd.category = id; pd.catTouched = true; pdCatPaint(); }
    function pdCatBind() {
      const w = document.getElementById('pd-catf'); if (!w) return;
      const m = document.getElementById('pd-cat-menu'), f = document.getElementById('pd-cat');
      // Clicks never move focus (Safari would otherwise blur the menu before the click lands)
      [m, f].forEach(el => el.addEventListener('mousedown', e => { if (pdCatIsOpen()) e.preventDefault(); }));
      w.addEventListener('focusout', () => setTimeout(() => { if (pdCatIsOpen() && !w.contains(document.activeElement)) pdCatClose(false); }, 0));
      f.addEventListener('keydown', e => { if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !pdCatIsOpen()) { e.preventDefault(); pdCatOpen(); } });
      m.addEventListener('keydown', e => {
        const items = [...m.querySelectorAll('.pp-mi')], i = items.indexOf(document.activeElement);
        const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
        if (to === undefined) return;
        e.preventDefault(); items[Math.max(0, Math.min(items.length - 1, to))].focus();
      });
    }
    function pdSetOk(label, disabled) {
      document.querySelectorAll('#plant-cat-modal .pd-ok').forEach(b => {
        b.textContent = label;
        if (disabled) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
      });
    }
    // Other plant whose name is the same once accents and case are ignored (not the one being edited)
    function pdClash(name) {
      const k = normTxt(name);
      return k ? (appData.plants || []).find((p, i) => i !== pd.idx && normTxt(p.name) === k) : null;
    }
    function pdValidate() {
      if (!pd || pd.mode === 'merge') return;
      const name = nmTrim(pd.name), other = pdClash(name);
      const f = document.getElementById('pd-name-f'), sup = document.getElementById('pd-name-sup'), note = document.getElementById('pd-notice');
      f.classList.remove('err'); sup.classList.remove('err'); sup.textContent = ''; note.hidden = true;
      pd.mergeInto = null;
      if (!name) { pdSetOk('Desar', true); return; }
      if (other && pd.mode === 'new') {
        f.classList.add('err'); sup.classList.add('err');
        sup.textContent = `Ja tens «${other.name}» al planter.`;
        pdSetOk('Desar', true); return;
      }
      if (other) {
        const u = catUsageMap()[appData.plants[pd.idx].name];
        const moves = u && (u.p + u.h) ? ` ${catUseText(u, true).replace(' · ', ' i ')} passaran a «${escHtml(other.name)}».` : '';
        note.innerHTML = `<span class="material-symbols-outlined" aria-hidden="true">merge</span><span>Ja existeix «${escHtml(other.name)}». En fusionar,
          «${escHtml(appData.plants[pd.idx].name)}» s'hi unirà.${moves}</span>`;
        note.hidden = false;
        pd.mergeInto = other;
        pdSetOk('Fusiona', false); return;
      }
      pdSetOk('Desar', false);
    }
    function pdNameInput(el) {
      pd.name = el.value;
      // New plants: the emoji follows the name until one is picked by hand
      if (pd.mode === 'new' && !pd.touched) { const e = getPlantEmoji(el.value); if (e !== pd.emoji) { pd.emoji = e; pdPaintEmoji(); } }
      // …and so does the category, until one is picked by hand
      if (pd.mode === 'new' && !pd.catTouched) { pd.category = getPlantCategory(el.value); pdCatPaint(); }
      pdValidate(); pdFitMenu();
    }
    // Emoji cells: the 42 garden emojis, then (when the plant's emoji isn't one of them) one custom cell, then "+".
    // The radios sit in a display:contents radiogroup so they share the grid with "+", which is a plain button.
    function pdEmoCells(animateCustom) {
      const inGrid = PD_EMOJIS.some(e => emoKey(e) === emoKey(pd.emoji));
      const cell = (e, extra) => `<button type="button" class="pd-e${extra || ''}" role="radio" aria-checked="${emoKey(e) === emoKey(pd.emoji)}" tabindex="-1" data-e="${escHtml(e)}" aria-label="${escHtml(e)}">${escHtml(e)}</button>`;
      return `<div role="radiogroup" aria-labelledby="pd-emo-h" style="display:contents">${PD_EMOJIS.map(e => cell(e)).join('')}${inGrid ? '' : cell(pd.emoji, ' pd-e-custom' + (animateCustom ? ' in' : ''))}</div>
        <span class="pd-add-w"><input id="pd-emo-in" class="pd-emo-in" type="text" tabindex="-1" aria-hidden="true" autocomplete="off" autocorrect="off" spellcheck="false">
          <button type="button" class="pd-add" id="pd-add" onclick="pdOpenEmojiPicker()" aria-label="Un altre emoji" title="Un altre emoji"><span class="material-symbols-outlined" aria-hidden="true">add</span></button></span>`;
    }
    function pdPaintEmoji() {
      const prev = document.getElementById('pd-prev');
      if (prev) { prev.firstElementChild.textContent = pd.emoji; prev.classList.remove('bump'); void prev.offsetWidth; prev.classList.add('bump'); }
      const grid = document.getElementById('pd-emo'); if (!grid) return;
      const inGrid = PD_EMOJIS.some(e => emoKey(e) === emoKey(pd.emoji));
      const custom = grid.querySelector('.pd-e-custom');
      if (!inGrid && (!custom || emoKey(custom.dataset.e) !== emoKey(pd.emoji))) {
        grid.innerHTML = pdEmoCells(true); pdEmoBind(); // a new custom emoji springs into the cell before "+"
      } else {
        grid.querySelectorAll('.pd-e').forEach(b => b.setAttribute('aria-checked', emoKey(b.dataset.e) === emoKey(pd.emoji)));
      }
      pdRoving();
    }
    function pdPick(e) { pd.emoji = e; pd.touched = true; pdPaintEmoji(); }

    // "+": the web can't open the system emoji picker directly. Focusing an (invisible) text field opens the phone's /
    // tablet's keyboard, where the 😊 key is; on Windows a snackbar points to Win + . (the emoji panel types into the field).
    // The first emoji typed is picked and the keyboard closes.
    const PD_IS_WIN = /Windows/i.test(navigator.userAgent);
    function pdOpenEmojiPicker() {
      const inp = document.getElementById('pd-emo-in'), add = document.getElementById('pd-add'); if (!inp) return;
      inp.value = '';
      inp.focus({ preventScroll: true });
      add.classList.add('picking');
      if (PD_IS_WIN) showSnackbar('Prem Win + . per obrir els emojis');
    }
    function pdEmoBind() {
      const inp = document.getElementById('pd-emo-in'); if (!inp) return;
      const take = () => {
        const v = inp.value.trim(); if (!v) return;
        const segs = typeof Intl !== 'undefined' && Intl.Segmenter ? [...new Intl.Segmenter('ca', { granularity: 'grapheme' }).segment(v)].map(x => x.segment) : [...v];
        const first = segs.find(g => /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(g));
        inp.value = '';
        if (!first) { showSnackbar('Això no és un emoji.'); return; }
        inp.blur();
        pdPick(first);
        const c = document.querySelector('#pd-emo .pd-e[aria-checked="true"]'); if (c) c.focus({ preventScroll: true });
      };
      inp.addEventListener('input', e => { if (!e.isComposing) take(); });
      inp.addEventListener('compositionend', take);
      inp.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); inp.blur(); } });
      inp.addEventListener('blur', () => { const a = document.getElementById('pd-add'); if (a) a.classList.remove('picking'); });
    }
    // Emoji grid = one tab stop; arrow keys move between emojis (roving tabindex), Enter / Space picks
    function pdRoving() {
      const btns = [...document.querySelectorAll('#pd-emo .pd-e')]; if (!btns.length) return;
      const cur = btns.find(b => b.getAttribute('aria-checked') === 'true') || btns[0];
      const focused = btns.find(b => b === document.activeElement);
      btns.forEach(b => { b.tabIndex = b === (focused || cur) ? 0 : -1; });
    }
    function pdGridKey(e) {
      const b = e.target.closest('.pd-e'); if (!b) return;
      const btns = [...document.querySelectorAll('#pd-emo .pd-e')], i = btns.indexOf(b);
      const cols = Math.max(1, btns.filter(x => x.offsetTop === btns[0].offsetTop).length);
      const to = { ArrowRight: i + 1, ArrowLeft: i - 1, ArrowDown: i + cols, ArrowUp: i - cols, Home: 0, End: btns.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      const t = btns[Math.max(0, Math.min(btns.length - 1, to))];
      btns.forEach(x => { x.tabIndex = x === t ? 0 : -1; }); t.focus();
    }

    function pdSubmit() {
      if (!pd || document.querySelector('#plant-cat-modal .pd-ok[aria-disabled="true"]')) return;
      if (pd.mode === 'merge') {
        const keep = pd.keep, others = pd.names.filter(n => n !== keep);
        const target = catFind(keep); if (!target) return;
        const snap = catSnap();
        // The survivor keeps its category; if it has none, it takes one from the plants merged into it
        if (!catOfPlant(target)) { const donor = others.map(catFind).find(catOfPlant); if (donor) target.category = donor.category; }
        others.forEach(n => catRewrite(n, { plantName: keep, emoji: target.emoji }));
        appData.plants = appData.plants.filter(p => !others.includes(p.name));
        pd.focusName = keep;
        pdClose(); catCommitAnimated(keep);
        catUndoable(`S'ha fusionat a «${keep}»`, snap);
        return;
      }
      const name = nmTrim(pd.name);
      if (pd.mode === 'new') {
        const np = { name, emoji: pd.emoji };
        if (catInfo(pd.category)) np.category = pd.category;
        appData.plants.push(np);
        pd.focusName = name;
        catCommit(); pdClose();
        showSnackbar(`«${name}» s'ha afegit al planter`);
        return;
      }
      const p = appData.plants[pd.idx]; if (!p) return pdClose();
      const old = p.name, emojiChanged = emoKey(pd.emoji) !== emoKey(pd.origEmoji);
      const origCat = catOfPlant(p), catChanged = (pd.category || '') !== origCat;
      if (pd.mergeInto) {
        const target = pd.mergeInto, snap = catSnap();
        const finalEmoji = emojiChanged ? pd.emoji : target.emoji;
        catRewrite(old, { plantName: target.name });
        target.emoji = finalEmoji;
        // Category: the one picked in the dialog if changed, else the survivor's, else the merged plant's
        const finalCat = catChanged ? pd.category : (catOfPlant(target) || origCat);
        if (finalCat) target.category = finalCat; else delete target.category;
        catRewrite(target.name, { emoji: finalEmoji });
        appData.plants.splice(appData.plants.indexOf(p), 1);
        pd.focusName = target.name;
        pdClose(); catCommitAnimated(target.name);
        catUndoable(`«${old}» s'ha fusionat amb «${target.name}»`, snap);
        return;
      }
      const renamed = name !== old;
      if (renamed) { catRewrite(old, { plantName: name }); p.name = name; }
      if (emojiChanged) { p.emoji = pd.emoji; catRewrite(p.name, { emoji: pd.emoji }); }
      if (catChanged) { if (pd.category) p.category = pd.category; else delete p.category; }
      pd.focusName = p.name;
      pdClose();
      if (renamed || emojiChanged || catChanged) { catCommitAnimated(p.name, renamed ? [old, p.name] : null); showSnackbar('Canvis desats'); }
    }
    function pdDelete() {
      if (!pd || pd.mode !== 'edit') return;
      const p = appData.plants[pd.idx], u = catUsageMap()[p.name];
      if (u && (u.p + u.h)) { showSnackbar('Planta en ús, no és possible eliminar-la'); return; } // only unused plants can be deleted
      const at = pd.idx;
      appData.plants.splice(at, 1);
      pd.returnName = null; pd.returnEl = null;
      pdClose(); catCommitAnimated(null);
      showSnackbar(`S'ha eliminat «${p.name}»`, 'Desfés', () => {
        if (catFind(p.name)) return;
        appData.plants.splice(Math.min(at, appData.plants.length), 0, p);
        catCommit();
      });
    }

    (function initPlantDialog() {
      const m = document.getElementById('plant-cat-modal');
      const scrim = document.getElementById('pd-scrim');
      scrim.addEventListener('click', () => { if (m.classList.contains('basic')) pdClose(); });
      ['wheel', 'touchmove'].forEach(t => scrim.addEventListener(t, e => e.preventDefault(), { passive: false }));
      document.getElementById('pd-body').addEventListener('scroll', e => document.getElementById('pd-dlg').classList.toggle('scrolled', e.target.scrollTop > 0), { passive: true });
      const body = document.getElementById('pd-body');

            .filter(el => !el.disabled && el.offsetParent !== null && el.tabIndex >= 0);

          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

    })();

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));

    function exportHistoryCSV() {
      document.querySelectorAll('.dl-arrow').forEach(a => { a.classList.remove('dl-anim'); void a.getBoundingClientRect(); a.classList.add('dl-anim'); clearTimeout(a._t); a._t = setTimeout(() => a.classList.remove('dl-anim'), 750); });
      const filtered = historyFiltered();

      let csvContent = "data:text/csv;charset=utf-8,";

      // Always one row per harvest (the complete dataset), filtered like the list
      csvContent += "Hortalissa,Qtat Plantada,Data Plantacio,Data Recolleccio,Qtat Recollectada,Exit (%),Notes,Categoria\n";
      filtered.slice().reverse().forEach(item => {
        const pQty = parseFloat(item.plantQty) || 1;
        const hQty = parseFloat(item.harvestQty) || 0;
        const successPct = pQty > 0 ? Math.round((hQty / pQty) * 100) : 0;
        const notesText = item.notes ? item.notes.map(n => `[${n.date}] ${n.text}`).join('; ') : '';
        const row = [
          `"${String(item.plantName || '').replace(/"/g, '""')}"`,

          `"${item.plantDate || ''}"`,

          `${successPct}%`,

    function importData(event) {
      const fileReader = new FileReader();

        fileReader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (parsed && parsed.cellSides) {
              appData = parsed;
              cols = appData.cols || 8;
              if (!appData.customPlants) appData.customPlants = [];
              if (!Array.isArray(appData.paths)) appData.paths = []; // older exports: every path walkable
              if (!appData.history) appData.history = [];

              saveData();
              if (currentView === 'plants') renderPlanter();
              renderGrid();
              alertBox("Dades importades correctament!");
            } else {
              alertBox("El fitxer no té un format vàlid.");
            }
          } catch (err) {
            alertBox("Error al llegir el fitxer JSON.");
          }
        };
      }
    }

    let snackTimer = null;
    function showSnackbar(msg, actionLabel, onAction) {
      const host = document.getElementById('snackbar-host');
      clearTimeout(snackTimer);
      host.innerHTML = '';
      const bar = document.createElement('div');
      bar.className = 'snackbar';
      bar.setAttribute('role', 'status');
      const text = document.format ? document.createElement('span') : document.createElement('span');
      text.className = 'snackbar-text';
      text.textContent = msg;
      bar.appendChild(text);
      const dismiss = () => { clearTimeout(snackTimer); bar.classList.add('snackbar-out'); setTimeout(() => bar.remove(), 200); };
      if (actionLabel) {
        const act = document.createElement('button');
        act.className = 'snackbar-btn snackbar-action';
        act.textContent = actionLabel;
        act.onclick = () => { dismiss(); if (onAction) onAction(); };
        const close = document.createElement('button');
        close.className = 'snackbar-btn snackbar-close';
        close.setAttribute('aria-label', 'Tancar');
        close.innerHTML = '<span class="material-symbols-outlined">close</span>';

        bar.append(act, close);

      host.appendChild(bar);
      snackTimer = setTimeout(dismiss, actionLabel ? 6000 : 4000);
    }

    function alertBox(msg) { showSnackbar(msg); }

    // ===== Pill buttons: rest radius = half the height (see .m3-pill) so the press morph never flashes square corners =====
    (function initPillRadius() {
      const ro = new ResizeObserver(entries => entries.forEach(e => {
        const b = e.target, h = b.offsetHeight;
        if (h) b.style.setProperty('--btn-r', (h / 2) + 'px');
      }));
      const adopt = b => {
        if (b.dataset.pill) return;
        const r = parseFloat(getComputedStyle(b).borderTopLeftRadius) || 0;
        if (!b.classList.contains('rounded-full') && r < 999) return; // only pills (rounded-full / 9999px)
        b.dataset.pill = '1';
        b.classList.add('m3-pill');
        if (b.offsetHeight) b.style.setProperty('--btn-r', (b.offsetHeight / 2) + 'px');
        ro.observe(b);
      };
      const scan = root => { if (root.matches && root.matches('button.m3-btn')) adopt(root); root.querySelectorAll && root.querySelectorAll('button.m3-btn').forEach(adopt); };
      scan(document);
      new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) scan(n); }))).observe(document.body, { childList: true, subtree: true });
    })();

    // ===== M3 ripple (visual only): buttons + garden slots; rail/nav ripple inside the indicator pill =====
    (function () {
      const GROW_MS = 225, FADE_MS = 150, TOUCH_DELAY_MS = 70;

      function rippleHost(el) {
        const t = el && el.closest ? el.closest('button, .side-spot') : null;
        if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') return null;
        return t.querySelector(':scope > .rail-icon-wrap, :scope > .nav-pill, :scope > .path-toggle-face') || t;
      }

      function startRipple(host, clientX, clientY) {
        let layer = host.querySelector(':scope > .ripple-host');
        if (!layer) {
          if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
          layer = document.createElement('span');
          layer.className = 'ripple-host';
          host.appendChild(layer);
        }
        const r = host.getBoundingClientRect();
        const x = clientX == null ? r.width / 2 : clientX - r.left;
        const y = clientY == null ? r.height / 2 : clientY - r.top;
        const radius = Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y));
        const wave = document.createElement('span');
        wave.className = 'ripple';
        wave.style.width = wave.style.height = (radius * 2) + 'px';
        wave.style.left = (x - radius) + 'px';
        wave.style.top = (y - radius) + 'px';
        layer.appendChild(wave);
        void wave.offsetWidth;
        wave.classList.add('ripple-grow');
        const born = performance.now();
        return function release() {
          const wait = Math.max(0, GROW_MS - (performance.now() - born));
          setTimeout(() => {
            wave.classList.add('ripple-out');
            setTimeout(() => wave.remove(), FADE_MS + 20);
          }, wait);
        };
      }

      const active = new Map(); // pointerId -> { release, timer, pending }

      document.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        const host = rippleHost(e.target);
        if (!host) return;
        const entry = {};
        const begin = () => { entry.pending = false; entry.release = startRipple(host, e.clientX, e.clientY); };
        if (e.pointerType === 'touch') {
          // Short delay so a touch that turns into a scroll doesn't flash a ripple
          entry.pending = true;
          entry.begin = begin;
          entry.timer = setTimeout(begin, TOUCH_DELAY_MS);
        } else {
          begin();
        }
        active.set(e.pointerId, entry);
      }, { passive: true });

      function end(e, cancelled) {
        const entry = active.get(e.pointerId);
        if (!entry) return;
        active.delete(e.pointerId);
        if (entry.pending) {
          clearTimeout(entry.timer);
          if (cancelled) return;
          entry.begin();
        }
        if (entry.release) entry.release();
      }
      document.addEventListener('pointerup', (e) => end(e, false), true);
      document.addEventListener('pointercancel', (e) => end(e, true), true);

      // Keyboard (Enter / Space): ripple from the centre
      document.addEventListener('keydown', (e) => {
        if (e.repeat || (e.key !== 'Enter' && e.key !== ' ')) return;
        const host = rippleHost(e.target);
        if (host) startRipple(host)();
      });
    })();
  </script>
</body>
</html>
