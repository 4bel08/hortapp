  <style>
    /* ============ M3 colour tokens ============
       Source: Material Theme Builder export (seed #2D5436, tertiary #8FB339, neutral #9B6C43).
       "harvest" = extended colour #D96B43, harmonized to the seed, tones 40/100/90/30 (light) and 80/20/30/90 (dark).

      color-scheme: light dark;
      --md-sys-color-primary: 50 105 65; /* #326941 */

      --md-sys-shape-corner-none: 0px;
      --md-sys-shape-corner-extra-small: 4px;
      --md-sys-shape-corner-small: 8px;
      --md-sys-shape-corner-medium: 12px;

      --md-sys-shape-corner-full: 9999px;

      --app-btn-r48: 24px; /* rest shape of 48dp icon buttons = half their height (a 9999px radius breaks the press morph) */

      /* Spacing scale. Stacked outlined fields need more room vertically than side by side: the floating label pokes 8px
         above the border, so a 20px row gap leaves 12px clear under the label (= the 12px horizontal gap). */
      --app-space-4: 4px;
      --app-space-8: 8px;
      --app-space-12: 12px;
      --app-space-16: 16px;
      --app-space-20: 20px;
      --app-space-24: 24px;
      --app-field-stack-gap: var(--app-space-20);

      /* M3 motion tokens (easing + duration). Expressive springs are approximated with overshooting curves;
         the app uses the gentle one (user prefers calmer motion). */
      --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1);
      --md-sys-motion-easing-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
      --md-sys-motion-easing-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
      --app-motion-spring-gentle: cubic-bezier(0.3, 1.25, 0.5, 1);

      --md-sys-motion-duration-short4: 200ms;
      --md-sys-motion-duration-medium1: 250ms;

      --md-sys-motion-duration-medium3: 350ms;
      --md-sys-motion-duration-medium4: 400ms;
      --md-sys-motion-duration-long1: 450ms;
      --md-sys-motion-duration-long2: 500ms;
      --md-sys-motion-duration-long3: 550ms;
      --md-sys-motion-duration-long4: 600ms;

      /* M3 elevation (shadow colour token + levels 1–3) */
      --md-sys-color-shadow: 0 0 0;
      --md-sys-elevation-level1: 0 1px 2px rgb(var(--md-sys-color-shadow) / 0.3), 0 1px 3px 1px rgb(var(--md-sys-color-shadow) / 0.15);

      /* M3 type scale (font shorthand). Titles/headlines use the brand font Faculty Glyphic; the rest Roboto Flex.

      --md-sys-typescale-label-medium: 500 12px/16px 'Roboto Flex', sans-serif;

      --md-sys-typescale-title-medium-emphasized: 700 16px/24px 'Roboto Flex', sans-serif;

    }

        --md-sys-color-surface-bright: 65 55 49; /* #413731 */
        --md-sys-color-surface-container-lowest: 20 13 8; /* #140D08 */
        --md-sys-color-surface-container-low: 34 26 20; /* #221A14 */
        --md-sys-color-surface-container: 38 30 24; /* #261E18 */
        --md-sys-color-surface-container-high: 49 40 34; /* #312822 */
        --md-sys-color-surface-container-highest: 60 51 44; /* #3C332C */
        --md-sys-color-harvest: 255 183 135; /* #FFB787 */
        --md-sys-color-on-harvest: 80 36 0; /* #502400 */
        --md-sys-color-harvest-container: 114 54 0; /* #723600 */
        --md-sys-color-on-harvest-container: 255 220 199; /* #FFDCC7 */

        --garden-ground: #806552;
        --garden-soil: #2b1d14;
        --garden-label: #fff3e6;
        --garden-gravel: #5c4834;
        --garden-gravel-texture: #f3cb9e;
        --garden-gravel-pebbles: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2718%27%20height%3D%2736%27%20viewBox%3D%270%200%2018%2036%27%3E%3Cellipse%20cx%3D%275%27%20cy%3D%273%27%20rx%3D%272.1%27%20ry%3D%271.5%27%20transform%3D%27rotate%2820%205%203%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%2712.5%27%20cy%3D%275.5%27%20rx%3D%271.3%27%20ry%3D%271.1%27%20transform%3D%27rotate%280%2012.5%205.5%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%278.5%27%20cy%3D%2710%27%20rx%3D%271%27%20ry%3D%270.8%27%20transform%3D%27rotate%280%208.5%2010%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%2713.5%27%20cy%3D%2713.5%27%20rx%3D%272.2%27%20ry%3D%271.4%27%20transform%3D%27rotate%28-30%2013.5%2013.5%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%274.5%27%20cy%3D%2715%27%20rx%3D%271.3%27%20ry%3D%271%27%20transform%3D%27rotate%2860%204.5%2015%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%279%27%20cy%3D%2720%27%20rx%3D%271.8%27%20ry%3D%271.3%27%20transform%3D%27rotate%28-10%209%2020%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%2714%27%20cy%3D%2722%27%20rx%3D%270.9%27%20ry%3D%270.9%27%20transform%3D%27rotate%280%2014%2022%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%274.5%27%20cy%3D%2724.5%27%20rx%3D%271%27%20ry%3D%270.8%27%20transform%3D%27rotate%280%204.5%2024.5%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%2711.5%27%20cy%3D%2727.5%27%20rx%3D%271.4%27%20ry%3D%271.1%27%20transform%3D%27rotate%2840%2011.5%2027.5%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%275.5%27%20cy%3D%2731%27%20rx%3D%272%27%20ry%3D%271.4%27%20transform%3D%27rotate%28-45%205.5%2031%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3Cellipse%20cx%3D%2713.5%27%20cy%3D%2733%27%20rx%3D%271%27%20ry%3D%270.8%27%20transform%3D%27rotate%280%2013.5%2033%29%27%20fill%3D%27%23f3cb9e%27%2F%3E%3C%2Fsvg%3E");
        --garden-water: #1e525b;
        --garden-water-wave: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2712%27%20height%3D%2724%27%20viewBox%3D%270%200%2012%2024%27%3E%3Cpath%20d%3D%27M6%200%20Q10%206%206%2012%20T6%2024%27%20fill%3D%27none%27%20stroke%3D%27%2399d6e2%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E");
      }
    }

    /* M3 Expressive buttons: pill shape that morphs to small corners while pressed */
    button.m3-btn {
      transition: border-radius var(--md-sys-motion-duration-medium2) var(--app-motion-spring-gentle), background-color 0.2s ease, color 0.2s ease,
                  border-color 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    }
    /* Pill buttons rest at exactly half their height (set by JS as --btn-r), not 9999px: a 9999px → 8px morph
       overshoots below zero with the spring and flashes square corners. */
    button.m3-btn.m3-pill { border-radius: var(--btn-r); }
    button.m3-btn:active:not([aria-disabled="true"]):not(:disabled) { border-radius: var(--md-sys-shape-corner-small); }

    /* Hover state layers for filled containers (8%); the pressed state is the ripple */
    .state-primary:hover { background-color: color-mix(in srgb, rgb(var(--md-sys-color-on-primary)) 8%, rgb(var(--md-sys-color-primary))); }
    .state-harvest:hover { background-color: color-mix(in srgb, rgb(var(--md-sys-color-on-harvest)) 8%, rgb(var(--md-sys-color-harvest))); }
    .state-harvest-container:hover { background-color: color-mix(in srgb, rgb(var(--md-sys-color-on-harvest-container)) 8%, rgb(var(--md-sys-color-harvest-container))); }
    .state-error-container:hover { background-color: color-mix(in srgb, rgb(var(--md-sys-color-on-error-container)) 8%, rgb(var(--md-sys-color-error-container))); }

    body {
      font-family: 'Roboto Flex', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: rgb(var(--md-sys-color-surface));
      color: rgb(var(--md-sys-color-on-surface));
      touch-action: manipulation;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, h4, h5, h6, .font-heading {
      font-family: 'Faculty Glyphic', serif;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* ===== Garden (Plànol) ===== */
    .garden {
      display: inline-flex; flex-direction: column; gap: 8px;
      background-color: var(--garden-ground);
      border-radius: var(--md-sys-shape-corner-extra-large);
      padding: 10px 16px 16px 10px;
    }
    @media (min-width: 640px) { .garden { padding: 12px 20px 20px 12px; } }
    .garden-label {
      color: var(--garden-label); font: var(--md-sys-typescale-label-small-emphasized); line-height: 1;
      font-variant-numeric: tabular-nums; user-select: none; text-align: center;
    }
    .garden { --bh: 112px; }
    @media (min-width: 640px) { .garden { --bh: 144px; } }
    .garden-head, .garden-body { display: flex; }
    /* Columns may differ in height (second plànol: short columns hang from the top); paths set their own height inline */
    .garden-body { align-items: flex-start; }
    /* Second plànol with its notch: the ground is an SVG L-shape drawn behind the beds (see drawGroundShape);
       the notch area is page background. Row labels 3-4 sit in the path gutter, under the short path. */
    .garden.garden-l { background: none; }
    .garden-l > .garden-head, .garden-l > .garden-body { position: relative; z-index: 1; }
    .garden-ground { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
    .garden-ground path { fill: var(--garden-ground); }
    .path-notch-w { width: 24px; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; }
    .path-notch-w > .row-labels { width: 24px; margin-right: 0; }
    .garden-head { align-items: flex-end; }
    .row-labels { width: 14px; margin-right: 6px; display: flex; flex-direction: column; gap: 3px; }
    .row-labels .garden-label { display: flex; align-items: center; justify-content: center; }
    .bed-col, .col-w { width: 40px; flex-shrink: 0; }
    .bed-col { display: flex; flex-direction: column; gap: 3px; }
    @media (min-width: 640px) { .bed-col, .col-w { width: 56px; } }
    .bed-h { height: 112px; }
    @media (min-width: 640px) { .bed-h { height: 144px; } }
    .bed-cell {
      display: flex; background-color: var(--garden-soil);
      background-image: repeating-linear-gradient(to bottom, transparent 0 7px, rgb(255 255 255 / 0.035) 7px 8px);
      border-radius: var(--md-sys-shape-corner-extra-small);
    }
    .bed-cell:first-child { border-radius: var(--md-sys-shape-corner-large) var(--md-sys-shape-corner-large) var(--md-sys-shape-corner-extra-small) var(--md-sys-shape-corner-extra-small); }
    .bed-cell:last-child { border-radius: var(--md-sys-shape-corner-extra-small) var(--md-sys-shape-corner-extra-small) var(--md-sys-shape-corner-large) var(--md-sys-shape-corner-large); }
    .bed-divider { width: 1px; background: rgb(255 255 255 / 0.08); flex-shrink: 0; }

    /* Slot = one half of a bed cell (the whole half is the tap target) */
    .side-spot {
      position: relative; flex: 1 1 0; min-width: 0; border-radius: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: none; border: 0; padding: 4px 0; cursor: pointer; outline: none;
    }
    .bed-cell > .side-spot:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .bed-cell > .side-spot:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; }
    /* State layers (M3: hover 8%, focus 10%; press = ripple 10%), in primary-fixed so they show on the soil */
    .side-spot::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: rgb(var(--md-sys-color-primary-fixed)); opacity: 0;
      transition: opacity 250ms cubic-bezier(0.2, 0, 0, 1);
    }
    .side-spot:hover::before { opacity: 0.08; }
    .side-spot:focus-visible::before { opacity: 0.10; }
    /* Slot being edited (its dialog is open): tonal wash */
    .side-spot.slot-selected::before { opacity: 0.16; }
    /* Keyboard focus ring: 3px, 2px gap, appears instantly */
    .side-spot:focus-visible { outline: 3px solid rgb(var(--md-sys-color-secondary-fixed-dim)); outline-offset: 2px; z-index: 2; }
    .slot-plus {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
      font: 300 22px/1 'Roboto Flex', sans-serif; color: rgb(var(--md-sys-color-primary-fixed) / 0.7);
      opacity: 0; transition: opacity 250ms cubic-bezier(0.2, 0, 0, 1);
    }
    .side-spot:not(.planted):hover .slot-plus, .side-spot:not(.planted):focus-visible .slot-plus { opacity: 1; }
    .side-spot .ripple { background: rgb(var(--md-sys-color-primary-fixed)); opacity: 0.1; }

    /* Crop pills (fixed colours: same in light and dark mode) */
    .crop-pill {
      width: 18px; padding: 5px 0; border-radius: var(--md-sys-shape-corner-full);
      background: rgb(var(--md-sys-color-primary-fixed));
      display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0;
      transition: opacity 0.3s cubic-bezier(0.2, 0, 0, 1);
    }
    .crop-emoji { font-size: 14px; line-height: 1; }
    .crop-qty {
      font: var(--md-sys-typescale-label-small-emphasized); line-height: 1; font-variant-numeric: tabular-nums;
      padding: 2px 2px; border-radius: var(--md-sys-shape-corner-extra-small);
      background: rgb(var(--md-sys-color-on-primary-fixed-variant)); color: rgb(var(--md-sys-color-primary-fixed));
    }
    .crop-qty.q3 { font-size: 10px; }
    .crop-more {
      width: 18px; height: 18px; border-radius: var(--md-sys-shape-corner-full); flex-shrink: 0;
      background: rgb(var(--md-sys-color-primary-fixed)); color: rgb(var(--md-sys-color-on-primary-fixed));
      font: var(--md-sys-typescale-label-small-emphasized); line-height: 1; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s cubic-bezier(0.2, 0, 0, 1);
    }
    /* Overflow: phone = up to 2 pills, 3+ crops -> 1 pill + "+N"; larger = 3+ crops -> 2 pills + "+N" */
    .more-d { display: none; }
    .ovf .pill-2 { display: none; }
    @media (min-width: 640px) {
      .crop-pill { width: 24px; padding: 6px 0; gap: 4px; }
      .crop-emoji { font-size: 17px; }
      .crop-qty { padding: 2px 3px; }
      .crop-qty.q3 { font-size: 11px; }
      .crop-more { width: 22px; height: 22px; }
      .more-m { display: none; }
      .more-d { display: flex; }
      .ovf .pill-2 { display: flex; }
    }
    /* Saving: pills spring in / shrink out */
    .pill-in { animation: pill-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; animation-delay: calc(var(--k, 0) * 90ms); }
    .pill-out { animation: pill-out 0.3s cubic-bezier(0.2, 0, 0, 1) both; }
    @keyframes pill-in { from { transform: scale(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes pill-out { to { transform: scale(0.3); opacity: 0; } }

    /* Paths between bed columns (24px gap) */
    .garden-path { position: relative; width: 24px; flex-shrink: 0; }
    .path-morph {
      position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); overflow: hidden;
      transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), border-radius 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .path-morph .pg, .path-morph .pw { position: absolute; inset: 0; transition: opacity 0.45s cubic-bezier(0.2, 0, 0, 1); }
    .pg {
      background-color: var(--garden-gravel);
      /* Pebbles: irregular ovals in 3 sizes, 18×36 tile, drawn in --garden-gravel-texture */
      background-image: var(--garden-gravel-pebbles);
      background-size: 18px 36px; background-position: center top;
    }
    .pw { background-color: var(--garden-water); background-image: var(--garden-water-wave); background-size: 12px 24px; background-position: center top; }
    .garden-path[data-t="walk"] .path-morph { width: 18px; border-radius: 9px; }
    .garden-path[data-t="irrigation"] .path-morph { width: 14px; border-radius: 7px; }
    .garden-path[data-t="walk"] .pw, .garden-path[data-t="irrigation"] .pg { opacity: 0; }

    /* Path toggle (edit mode only): 32px face, 48px touch area */
    .path-toggle {
      position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; z-index: 3;
      border: 0; background: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(0.4); visibility: hidden;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), opacity 0.2s cubic-bezier(0.2, 0, 0, 1), visibility 0s linear 0.3s;
    }
    .path-toggle, .side-spot, button { -webkit-tap-highlight-color: transparent; }
    .path-toggle-face { position: relative; display: block; width: 32px; height: 32px; border-radius: var(--md-sys-shape-corner-full);
      background: rgb(var(--md-sys-color-surface-container-lowest)); color: rgb(var(--md-sys-color-on-surface)); box-shadow: var(--md-sys-elevation-level1); overflow: hidden; }
    .path-toggle .path-ic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s cubic-bezier(0.2, 0, 0, 1); }
    .path-ic-walk { color: #6b4a2c; }
    .path-ic-water { color: #3f7f9c; font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    @media (prefers-color-scheme: dark) { .path-ic-walk { color: #d9c3a5; } .path-ic-water { color: #9fcde0; } }
    .garden-path[data-t="walk"] .path-ic-water { opacity: 0; transform: rotate(-90deg) scale(0.5); }
    .garden-path[data-t="irrigation"] .path-ic-walk { opacity: 0; transform: rotate(90deg) scale(0.5); }
    .paths-editing .path-toggle {
      opacity: 1; transform: none; visibility: visible;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s cubic-bezier(0.2, 0, 0, 1), visibility 0s;
    }
    .path-toggle:focus-visible .path-toggle-face { outline: 3px solid rgb(var(--md-sys-color-secondary-fixed-dim)); outline-offset: 2px; }
    /* Edit mode: beds disabled (content at 38%) */
    .paths-editing .crop-pill, .paths-editing .crop-more { opacity: 0.38; transition-duration: 0.4s; }
    .paths-editing .side-spot { cursor: default; }
    .paths-editing .side-spot::before, .paths-editing .slot-plus { opacity: 0 !important; }

    /* ===== Plànol controls: M3 Expressive standard button group (Small, 40px) ===== */
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .std-group { display: flex; align-items: center; flex-wrap: nowrap; }
    .std-group > .gb + .gb { margin-left: 12px; }
    .std-group > .gb + .gb.gb-pair { margin-left: 4px; }       /* − and + form a pair */
    .gb {
      position: relative; height: 40px; flex: 0 0 auto; border: 0; padding: 0; overflow: hidden; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
      font-size: 14px; font-weight: 600; border-radius: var(--app-btn-r40); /* half the 40px height (not 9999px) so the press morph is smooth */
      /* release: gentle spring */
      transition: width .5s cubic-bezier(0.3, 1.25, 0.5, 1), margin-left .5s cubic-bezier(0.3, 1.25, 0.5, 1), border-radius .5s cubic-bezier(0.3, 1.25, 0.5, 1),
                  background-color .35s cubic-bezier(0.2, 0, 0, 1), color .35s cubic-bezier(0.2, 0, 0, 1), border-color .35s cubic-bezier(0.2, 0, 0, 1), opacity .2s;
    }
    /* press: smooth, no bounce */
    .std-group.pressing > .gb {
      transition: width .3s cubic-bezier(0.2, 0, 0, 1), margin-left .3s cubic-bezier(0.2, 0, 0, 1), border-radius .3s cubic-bezier(0.2, 0, 0, 1),
                  background-color .35s cubic-bezier(0.2, 0, 0, 1), color .35s cubic-bezier(0.2, 0, 0, 1), border-color .35s cubic-bezier(0.2, 0, 0, 1), opacity .2s;
    }
    .gb::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .gb:hover::after { opacity: .08; }
    .gb.pressed { border-radius: var(--md-sys-shape-corner-small); }
    .gb[aria-disabled="true"] { opacity: .38; cursor: default; }
    .gb[aria-disabled="true"]::after { display: none; }
    .gb:focus-visible { outline: 3px solid rgb(var(--md-sys-color-secondary)); outline-offset: 2px; }
    /* Outlined (item 23): tonal was ~1.2:1 against the page surface in light mode */
    .gb-icon { width: 40px; border: 1px solid rgb(var(--md-sys-color-outline)); background: transparent; color: rgb(var(--md-sys-color-on-surface-variant)); }
    .gb-icon .material-symbols-outlined { font-size: 24px; }
    .gb-toggle { padding: 0 16px; border: 1px solid rgb(var(--md-sys-color-outline)); background: transparent; color: rgb(var(--md-sys-color-on-surface-variant)); }
    .gb-toggle .material-symbols-outlined { font-size: 20px; }
    /* selected toggle: square (12dp at Small) + inverse surface */
    .gb-toggle[aria-pressed="true"] {
      border-radius: var(--md-sys-shape-corner-medium);
      background: rgb(var(--md-sys-color-inverse-surface)); color: rgb(var(--md-sys-color-inverse-on-surface)); border-color: rgb(var(--md-sys-color-inverse-surface));
    }
    .gb-toggle[aria-pressed="true"].pressed { border-radius: var(--md-sys-shape-corner-small); }
    /* Mobile Llista/Calendari toggle (item 37): selected fill is tokenized green (primary), not the generic
       inverse-surface every other .gb-toggle still uses (Plànol's path-edit-btn keeps inverse-surface) — this
       is the one place on the page the user sees most, so it gets the app's own garden-green accent instead
       of a neutral. Scoped to #hist-cal-group so it doesn't touch any other toggle. */
    #hist-cal-group .gb-toggle[aria-pressed="true"] {
      background: rgb(var(--md-sys-color-primary)); color: rgb(var(--md-sys-color-on-primary)); border-color: rgb(var(--md-sys-color-primary));
    }
    /* The row carries its own "flex" utility class, which (being author CSS) beats the UA [hidden] default,
       so it needs this explicit override to actually disappear on every view but Historial/Calendari. */
    #hist-cal-toggle-row[hidden] { display: none; }

    /* View switch (Llista/Calendari, Visió general/Millors mesos): both halves change fill, text and border with the
       same 250ms standard curve, so one fades out exactly as the other fades in; the shape keeps the gentle spring. */
    #hist-cal-group .gb-toggle, .cal-view-group .gb-toggle {
      transition: width .5s cubic-bezier(0.3, 1.25, 0.5, 1), margin-left .5s cubic-bezier(0.3, 1.25, 0.5, 1), border-radius .5s cubic-bezier(0.3, 1.25, 0.5, 1),
                  background-color var(--md-sys-motion-duration-medium1) var(--md-sys-motion-easing-standard), color var(--md-sys-motion-duration-medium1) var(--md-sys-motion-easing-standard),
                  border-color var(--md-sys-motion-duration-medium1) var(--md-sys-motion-easing-standard), opacity .2s;
    }
    /* Page swap (M3 fade through): the outgoing page fades out while the buttons animate; the new page renders after (see switchView) */
    .vs-leaving { opacity: 0; pointer-events: none; transition: opacity var(--md-sys-motion-duration-short2) linear var(--md-sys-motion-duration-short2); } /* 100ms hold, 100ms fade */


    /* Connected button groups (M3 Expressive): 2dp gap, outer corners fully round, inner corners small, selected = fully round,
       pressed = small. Used by Visió general / Millors mesos and by Llista + Calendari + chevron on phones. */

    .gb-connected > .gb:last-child { border-radius: var(--md-sys-shape-corner-small) var(--app-btn-r40) var(--app-btn-r40) var(--md-sys-shape-corner-small); }
    .gb-connected > .gb.gb-toggle[aria-pressed="true"] { border-radius: var(--app-btn-r40); }
    .std-group.gb-connected > .gb.gb-toggle.pressed { border-radius: var(--md-sys-shape-corner-small); }
    #hist-cal-toggle-row { gap: 2px; }
    #hist-cal-group .gb-toggle { border-radius: var(--app-btn-r40) var(--md-sys-shape-corner-small) var(--md-sys-shape-corner-small) var(--app-btn-r40); }
    #hist-cal-group .gb-toggle[aria-pressed="true"] { border-radius: var(--app-btn-r40); }
    #hist-cal-group .gb-toggle.pressed, #hist-cal-group .gb-toggle[aria-pressed="true"].pressed { border-radius: var(--md-sys-shape-corner-small); }

    /* FABs (M3): elevation 3 at rest, 4 on hover, back to 3 while pressed (the ripple shows the press). No lift or scale (item 24). */
    .md3-fab {
      border-radius: var(--md-sys-shape-corner-large);
      box-shadow: var(--md-sys-elevation-level3);

    #desktop-nav-rail {

    }

    }

    .rail-item {
      position: relative;
      height: 56px !important;
      width: 100% !important;
      padding: 0 !important;
      margin: 0 !important;

      box-shadow: none !important;
    }

    .rail-icon-wrap {
      position: absolute;
      top: 4px;
      left: 0;
      width: 100%;
      height: 32px;
      border-radius: var(--md-sys-shape-corner-large);
      background: transparent;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease, color 0.2s ease;

      height: 56px;

    }

    .rail-label {
      position: absolute;
      left: 52px;
      top: 18px;

      font-weight: 600;
      white-space: nowrap;
      opacity: 0;

      z-index: 2;

    .rail-item::after {

      white-space: nowrap;
    }

    }

    /* Active State Colors */
    .rail-active .rail-icon-wrap {

    }
    .rail-active .rail-label,

    }

    #rail-fab-export, #rail-fab-planol, #rail-fab-plant {
      position: relative;
      height: 56px !important;
      padding: 0 !important;
      border-radius: var(--md-sys-shape-corner-large) !important;
      box-shadow: var(--md-sys-elevation-level3);

      overflow: hidden;

    #rail-fab-export, #rail-fab-plant { position: absolute !important; top: 0; left: 0; }
    #desktop-nav-rail:not(.expanded) #rail-fab-export,
    #desktop-nav-rail:not(.expanded) #rail-fab-plant,
    #desktop-nav-rail:not(.expanded) #rail-fab-planol {
      width: 56px !important;
    }
    #desktop-nav-rail.expanded #rail-fab-export,
    #desktop-nav-rail.expanded #rail-fab-plant,
    #desktop-nav-rail.expanded #rail-fab-planol {
      width: 100% !important;
    }
    #rail-fab-export .material-symbols-outlined, #rail-fab-plant .material-symbols-outlined {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 16px;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    /* ===== M3 Expressive FAB menu (import / export) ===== */
    .fab-icon {
      position: absolute; --fab-icon-base: translate(0, 0);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
    }
    .fab-toggle .fab-icon { inset: 0; display: flex; align-items: center; justify-content: center; }
    #rail-fab-planol .fab-icon { top: 50%; left: 16px; --fab-icon-base: translateY(-50%); }
    .fab-icon-open { opacity: 1; transform: var(--fab-icon-base); }
    .fab-icon-close { opacity: 0; transform: var(--fab-icon-base) rotate(-90deg) scale(0.6); }
    .fab-menu.is-open .fab-icon-open { opacity: 0; transform: var(--fab-icon-base) rotate(90deg) scale(0.6); }
    .fab-menu.is-open .fab-icon-close { opacity: 1; transform: var(--fab-icon-base); }

    /* Button shape morph: rounded square -> full round (close button) */
    .fab-toggle { border-radius: var(--md-sys-shape-corner-large); transition: border-radius 0.35s var(--app-motion-spring-gentle), box-shadow var(--md-sys-motion-duration-medium2) var(--md-sys-motion-easing-standard), background-color 0.2s ease; }
    .fab-menu.is-open .fab-toggle { border-radius: var(--md-sys-shape-corner-extra-large); }
    #rail-fab-planol { transition: width 0.3s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease, box-shadow var(--md-sys-motion-duration-medium2) var(--md-sys-motion-easing-standard), border-radius 0.35s var(--app-motion-spring-gentle) !important; }
    #planol-fab-menu-rail.is-open #rail-fab-planol { border-radius: var(--md-sys-shape-corner-extra-large) !important; }

    /* The menu wrapper must never catch taps: only the FAB, and the pills while open, are interactive.
       (Closed pills are invisible but still take space; without this, that area blocked taps on the beds below.) */
    .fab-menu { pointer-events: none; }
    .fab-menu [data-fab-toggle] { pointer-events: auto; }

    /* Menu items: 56px tonal pills that pop in one after another */
    .fab-menu-items { display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
    .fab-menu-items-mobile { align-items: flex-end; }
    .fab-menu-items-rail { align-items: flex-start; }
    .fab-menu-item {
      position: relative; height: 56px; padding: 0 24px 0 20px; border-radius: 9999px;
      display: flex; align-items: center; gap: 12px; white-space: nowrap;
      font-size: 16px; font-weight: 500;
      background-color: rgb(var(--md-sys-color-primary-container)); color: rgb(var(--md-sys-color-on-primary-container));
      box-shadow: var(--md-sys-elevation-level3);
      opacity: 0; visibility: hidden;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease, visibility 0s linear 0.35s, background-color 0.2s ease;
    }
    .fab-menu-items-mobile .fab-menu-item { transform-origin: right center; transform: translateY(16px) scale(0.7); }
    .fab-menu-items-rail .fab-menu-item { transform-origin: left center; transform: translateX(-16px) scale(0.7); }
    .fab-menu.is-open .fab-menu-items { pointer-events: auto; }
    .fab-menu.is-open .fab-menu-item {
      opacity: 1; visibility: visible; transform: none;

    }
    .state-primary-container:hover { background-color: color-mix(in srgb, rgb(var(--md-sys-color-on-primary-container)) 8%, rgb(var(--md-sys-color-primary-container))); }
    #rail-fab-export .rail-label,
    #rail-fab-plant .rail-label,
    #rail-fab-planol .rail-label {
      top: 50%;
      transform: translateY(-50%);
    }

    /* MD3 indicator pill: circle collapses / grows from centre + hover state layer */
    /* M3 Expressive flexible navigation bar (phones): 64px + safe area, no elevation */
    .m3-nav-bar { height: calc(64px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); }
    .m3-nav-bar > button { min-width: 0; }
    /* Active destination: filled icon (bottom bar and rail) */
    .nav-pill > .material-symbols-outlined, .rail-icon-wrap > .material-symbols-outlined { transition: font-variation-settings 0.2s ease; }
    .nav-active > .material-symbols-outlined, .rail-active .rail-icon-wrap > .material-symbols-outlined { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .nav-pill { position: relative; }
    .rail-icon-wrap::before, .nav-pill::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; background: rgb(var(--md-sys-color-secondary-container));
      clip-path: circle(0% at 50% 50%); opacity: 0;
      transition: clip-path 0.4s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s cubic-bezier(0.2, 0, 0, 1);
    }
    .rail-active .rail-icon-wrap::before, .nav-active::before { clip-path: circle(80% at 50% 50%); opacity: 1; }
    .rail-icon-wrap::after, .nav-pill::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; background: currentColor;
      opacity: 0; transition: opacity 0.2s ease;
    }
    .rail-item:hover .rail-icon-wrap::after, button:hover > .nav-pill::after { opacity: 0.08; }
    .rail-icon-wrap > .material-symbols-outlined, .nav-pill > .material-symbols-outlined { position: relative; z-index: 1; }

    /* Plànol: edge fades that hint at horizontal scroll (pure CSS, scroll-driven animation).
       Only when the grid overflows: an inactive scroll timeline leaves both fades at 0. */
    @property --fade-l { syntax: '<length>'; inherits: false; initial-value: 0px; }
    @property --fade-r { syntax: '<length>'; inherits: false; initial-value: 0px; }
    @supports (animation-timeline: scroll()) {
      .grid-scroll {
        --fade: 32px;
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent 100%);
        mask-image: linear-gradient(to right, transparent 0, #000 var(--fade-l), #000 calc(100% - var(--fade-r)), transparent 100%);
        animation: grid-edge-fade linear both;
        animation-timeline: scroll(self inline);
      }
      @media (min-width: 640px) { .grid-scroll { --fade: 48px; } }
    }
    @keyframes grid-edge-fade {
      0%   { --fade-l: 0px;         --fade-r: var(--fade); }
      10%  { --fade-l: var(--fade); }
      90%  { --fade-r: var(--fade); }
      100% { --fade-l: var(--fade); --fade-r: 0px; }
    }

    /* ===== Plant editor container =====
       Phones (<840px): M3 full-screen dialog (slides up; ✕ · title · Desar in a top bar that tints on scroll).
       ≥840px: M3 detached modal side sheet (400px, 16px margin, 16dp corners) that slides in from the right.
       The edited slot is spotlit: the scrim is a box-shadow around a "hole" that tracks the slot.
       Everything here uses the M3 tokens (colour, shape, type, elevation, motion) defined in :root. */
    #plant-modal {
      position: fixed; inset: 0; z-index: 50; visibility: hidden;
      transition: visibility 0s linear var(--md-sys-motion-duration-medium1);
      --pm-field-r: var(--md-sys-shape-corner-large); /* fields: 16dp (user choice, option C) */
      --pm-press-s: var(--md-sys-shape-corner-small);  /* pressed shape, 40dp buttons */
      --pm-press-m: var(--md-sys-shape-corner-medium); /* pressed shape, 48dp buttons */
      --pm-morph: border-radius var(--md-sys-motion-duration-medium2) var(--app-motion-spring-gentle);
    }
    #plant-modal.pm-open { visibility: visible; transition: none; }
    /* Closed editor must never catch taps or focus: children that set visibility: visible themselves
       (open card content, open menu) would otherwise stay "visible" inside the hidden layer. `inert` is set in JS too. */
    #plant-modal:not(.pm-open), #plant-modal:not(.pm-open) * { pointer-events: none !important; }
    #plant-modal:not(.pm-open) .pc-inner, #plant-modal:not(.pm-open) .pp-menu { visibility: hidden !important; }
    .pm-catch { position: absolute; inset: 0; }
    .pm-hole { position: fixed; display: none; pointer-events: none; border-radius: var(--md-sys-shape-corner-medium); opacity: 0;
      box-shadow: 0 0 0 200vmax rgb(var(--md-sys-color-scrim) / 0.32);
      transition: opacity var(--md-sys-motion-duration-medium1) linear; }
    .pm-open .pm-hole { opacity: 1; transition-duration: var(--md-sys-motion-duration-medium2); }
    .pm-panel { position: absolute; inset: 0; display: flex; flex-direction: column; outline: none;
      background: rgb(var(--md-sys-color-surface)); color: rgb(var(--md-sys-color-on-surface));
      opacity: 0; transform: translateY(48px);
      transition: transform var(--md-sys-motion-duration-medium1) var(--md-sys-motion-easing-emphasized-accelerate), opacity var(--md-sys-motion-duration-short4) linear; }
    .pm-open .pm-panel { opacity: 1; transform: none;
      transition: transform var(--md-sys-motion-duration-long2) var(--md-sys-motion-easing-emphasized-decelerate), opacity var(--md-sys-motion-duration-medium1) linear; }
    .pm-head { display: flex; align-items: center; gap: 4px; min-height: 64px; padding: 4px 8px 4px 4px; flex-shrink: 0;
      transition: background-color var(--md-sys-motion-duration-medium1) linear; }
    .pm-panel.pm-scrolled .pm-head { background: rgb(var(--md-sys-color-surface-container)); }
    .pm-titles { flex: 1; min-width: 0; padding-left: 4px; }
    .pm-title, .pm-sub { margin: 0; }
    .pm-title { font: var(--md-sys-typescale-title-large); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pm-sub { font: var(--md-sys-typescale-body-medium); color: rgb(var(--md-sys-color-on-surface-variant)); }
    .pm-icon-btn { background: none; border: 0; cursor: pointer; width: 48px; height: 48px; flex-shrink: 0; display: grid; place-items: center; border-radius: var(--md-sys-shape-corner-full);
      color: rgb(var(--md-sys-color-on-surface-variant)); position: relative;
      transition: background-color var(--md-sys-motion-duration-short4) linear, var(--pm-morph); }
    .pm-icon-btn:hover { background: rgb(var(--md-sys-color-on-surface) / 0.08); }
    .pm-close-end { display: none; }
    /* Desar (phones): M3 small filled button in the top app bar */
    .pm-save-top { border: 0; cursor: pointer; height: 40px; padding: 0 16px; margin-right: 4px; border-radius: var(--md-sys-shape-corner-full);
      font: var(--md-sys-typescale-label-large-emphasized); background: rgb(var(--md-sys-color-primary)); color: rgb(var(--md-sys-color-on-primary)); flex-shrink: 0; position: relative;
      transition: background-color var(--md-sys-motion-duration-short4) linear, box-shadow var(--md-sys-motion-duration-short4) linear, var(--pm-morph); }
    .pm-save-top:hover { background: color-mix(in srgb, rgb(var(--md-sys-color-on-primary)) 8%, rgb(var(--md-sys-color-primary))); box-shadow: var(--md-sys-elevation-level1); }
    .pm-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 16px 24px; }
    .pm-foot { display: none; }

    /* Consistent press morph for every button in the editor: 40dp → 8dp corners, 48dp → 12dp, gentle spring */
    #plant-modal button.m3-btn { transition: var(--pm-morph), background-color var(--md-sys-motion-duration-short4) linear, box-shadow var(--md-sys-motion-duration-short4) linear; }
    #plant-modal button.m3-btn:active, .pm-save-top:active, .nt-more:active, .pp-arrow:active, .nt-del:active, .pc-delete:active { border-radius: var(--pm-press-s); }
    .pm-icon-btn:active, .qty-btn:active, .nt-send.ready:active { border-radius: var(--pm-press-m); }
    /* Focus indicator (M3): 3dp secondary ring */
    #plant-modal button:focus-visible { outline: 3px solid rgb(var(--md-sys-color-secondary)); outline-offset: 2px; }
    .pc-head:focus-visible, .qty-btn:focus-visible { outline-offset: -3px !important; }

    /* Plants in the side: M3 Expressive grouped list; the open card springs to full corners */
    .pc-list { display: flex; flex-direction: column; --pc-bg: var(--md-sys-color-surface-container); }
    /* Each card sits in a wrapper whose height can grow/shrink (grid 0fr ↔ 1fr) when adding, deleting or undoing */
    .pc-w { display: grid; grid-template-rows: 1fr; margin-top: 2px;
      transition: grid-template-rows var(--md-sys-motion-duration-long1) var(--md-sys-motion-easing-emphasized-decelerate), opacity var(--md-sys-motion-duration-medium2) linear,
        margin-top var(--md-sys-motion-duration-long1) var(--md-sys-motion-easing-emphasized-decelerate), transform var(--md-sys-motion-duration-long1) var(--md-sys-motion-easing-emphasized-decelerate); }
    .pc-w:first-child { margin-top: 0; }
    .pc-w > .pc-item { min-height: 0; }
    .pc-w.pc-anim > .pc-item { overflow: hidden; }
    .pc-w.pc-anim .pc-body { transition: none; }
    .pc-w.entering, .pc-w.leaving { grid-template-rows: 0fr; opacity: 0; transform: scale(0.96); margin-top: 0; }
    .pc-w.leaving { transition: grid-template-rows var(--md-sys-motion-duration-medium4) var(--md-sys-motion-easing-emphasized-decelerate) 80ms, opacity var(--md-sys-motion-duration-short4) linear,
      margin-top var(--md-sys-motion-duration-medium4) var(--md-sys-motion-easing-emphasized-decelerate) 80ms, transform var(--md-sys-motion-duration-medium2) var(--md-sys-motion-easing-emphasized-accelerate); }
    .pc-item { background: rgb(var(--pc-bg)); border-radius: var(--md-sys-shape-corner-extra-small);
      transition: border-radius var(--md-sys-motion-duration-long2) var(--app-motion-spring-gentle), margin var(--md-sys-motion-duration-long2) var(--app-motion-spring-gentle); }
    .pc-w:first-child > .pc-item { border-top-left-radius: var(--md-sys-shape-corner-large-increased); border-top-right-radius: var(--md-sys-shape-corner-large-increased); }
    .pc-w:last-child > .pc-item { border-bottom-left-radius: var(--md-sys-shape-corner-large-increased); border-bottom-right-radius: var(--md-sys-shape-corner-large-increased); }
    .pc-item.open { border-radius: var(--md-sys-shape-corner-large-increased); margin: 6px 0; }
    .pc-w:first-child > .pc-item.open { margin-top: 0; }
    .pc-w:last-child > .pc-item.open { margin-bottom: 0; }
    .pc-head { background: none; border: 0; color: inherit; font: inherit; cursor: pointer;
      width: 100%; display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 8px 12px 8px 16px; text-align: left;
      border-radius: inherit; position: relative; }
    .pc-item.open .pc-head { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
    .pc-head::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: rgb(var(--md-sys-color-on-surface)); opacity: 0;
      transition: opacity var(--md-sys-motion-duration-medium1) linear; pointer-events: none; }
    .pc-head:hover::before { opacity: 0.08; }
    .pc-avatar { width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--md-sys-shape-corner-full); display: grid; place-items: center; font-size: 22px; line-height: 1;
      background: rgb(var(--md-sys-color-primary-fixed)); } /* fixed role on purpose: same as the crop pills in the garden */
    .pc-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .pc-name { font: var(--md-sys-typescale-title-medium); color: rgb(var(--md-sys-color-on-surface)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pc-sup { font: var(--md-sys-typescale-body-medium); color: rgb(var(--md-sys-color-on-surface-variant)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pc-chev { color: rgb(var(--md-sys-color-on-surface-variant)); transition: transform var(--md-sys-motion-duration-long1) var(--app-motion-spring-gentle); }
    .pc-item.open .pc-chev { transform: rotate(180deg); }
    .pc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--md-sys-motion-duration-long1) var(--md-sys-motion-easing-emphasized-decelerate); }
    .pc-item.open .pc-body { grid-template-rows: 1fr; }
    .pc-body > div { min-height: 0; overflow: hidden; }
    .pc-item.settled .pc-body > div { overflow: visible; }
    .pc-inner { padding: 4px 16px 16px; opacity: 0; visibility: hidden;
      transition: opacity var(--md-sys-motion-duration-short4) linear, visibility 0s linear var(--md-sys-motion-duration-short4); }
    .pc-item.open .pc-inner { opacity: 1; visibility: visible; transition: opacity var(--md-sys-motion-duration-medium2) linear 120ms, visibility 0s; }
    @media (min-width: 840px) { .pc-list { --pc-bg: var(--md-sys-color-surface-container-high); } }

    /* ===== Harvest inside the card (H2) ===== */
    .pc-inner { position: relative; }
    .pc-item.harvesting .pc-inner { min-height: 248px; }
    .hv { position: absolute; inset: 0; z-index: 1; padding: 8px 16px 0;
      border-radius: 0 0 var(--md-sys-shape-corner-large-increased) var(--md-sys-shape-corner-large-increased);
      background: rgb(var(--md-sys-color-harvest-container)); color: rgb(var(--md-sys-color-on-harvest-container));
      --pc-bg: var(--md-sys-color-harvest-container);

    .hv-t { display: flex; align-items: center; gap: 8px; margin: 4px 0; font: var(--md-sys-typescale-title-small); }

    /* Actions stay above the orange surface */

    /* Right slot: bin ⇄ Confirma (filled, harvest colour) */

    .hv-confirm { background: rgb(var(--md-sys-color-harvest)); color: rgb(var(--md-sys-color-on-harvest)); white-space: nowrap; transform-origin: right center;
      opacity: 0; transform: scale(0.7); pointer-events: none;
      transition: opacity var(--md-sys-motion-duration-short4) linear, transform var(--md-sys-motion-duration-medium3) var(--app-motion-spring-gentle),

    /* Card actions (A1): Collir (tonal, harvest colour) on the left, delete icon on the right */
    .pc-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--app-space-8); margin-top: var(--app-space-24); padding-top: var(--app-space-16); border-top: 1px solid rgb(var(--md-sys-color-outline-variant)); }
    .pc-harvest { height: 40px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; position: relative;
      border-radius: var(--md-sys-shape-corner-full); font: var(--md-sys-typescale-label-large-emphasized);

      transition: opacity var(--md-sys-motion-duration-short4) linear; pointer-events: none; }

    /* Delete (plant and note): M3 tonal icon button in the error palette — error-container fill, on-error-container bin;
       hover = 8% on-error-container state layer (a shade deeper), press = ripple. 40dp, 48dp touch target. */
    .pc-delete, .nt-del { background: rgb(var(--md-sys-color-error-container)) !important; color: rgb(var(--md-sys-color-on-error-container)) !important; border: 0 !important; }
    .pc-delete:hover, .nt-del:hover { background: color-mix(in srgb, rgb(var(--md-sys-color-on-error-container)) 8%, rgb(var(--md-sys-color-error-container))) !important; }

      border-radius: var(--md-sys-shape-corner-full);

      border-radius: var(--md-sys-shape-corner-full); color: rgb(var(--md-sys-color-on-surface-variant)); opacity: 0.38; transform: scale(0.85);
      transition: background-color var(--md-sys-motion-duration-medium1) linear, color var(--md-sys-motion-duration-medium1) linear, opacity var(--md-sys-motion-duration-short4) linear,
        transform var(--md-sys-motion-duration-long1) var(--app-motion-spring-pop), var(--pm-morph); }

    .nt-del { grid-column: 3; grid-row: 1 / span 2; align-self: start; width: 40px; height: 40px; margin: -6px 0 0 0; display: grid; place-items: center;
      border: 1px solid rgb(var(--md-sys-color-outline-variant)); background: none; cursor: pointer; position: relative; border-radius: var(--md-sys-shape-corner-full); color: rgb(var(--md-sys-color-on-surface-variant));
      transition: opacity var(--md-sys-motion-duration-short4) linear, background-color var(--md-sys-motion-duration-short4) linear, color var(--md-sys-motion-duration-short4) linear, var(--pm-morph); }
    .nt-del::after { content: ''; position: absolute; inset: -5px; } /* 48px touch target */

    /* Same tonal error icon button as the plant delete. Hidden until needed:

    .nt-del { opacity: 0; transform: scale(0.6); pointer-events: none;

    /* Plant field (N1): M3 outlined text field with leading emoji and floating label (rests inside when empty, floats up on focus) */
    .pp-field { position: relative; margin-top: 8px; }
    .pp-box { position: relative; display: flex; align-items: center; height: 56px; padding: 0 4px 0 12px;

    .pp-label { position: absolute; left: 16px; top: -8px; padding: 0 4px; font: var(--md-sys-typescale-body-small); white-space: nowrap; z-index: 1;

    .pp-input::placeholder { color: rgb(var(--md-sys-color-on-surface-variant)); opacity: 0; transition: opacity var(--md-sys-motion-duration-short4) linear; }
    .pp-field.focus .pp-input::placeholder { opacity: 1; }

    .pp-input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: none; padding: 0 8px 0 12px;
      font: var(--md-sys-typescale-body-large); color: rgb(var(--md-sys-color-on-surface)); }
    .pp-arrow { width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center; border: 0; background: none; cursor: pointer; position: relative;
      border-radius: var(--md-sys-shape-corner-full); color: rgb(var(--md-sys-color-on-surface-variant));
      transition: transform var(--md-sys-motion-duration-medium3) var(--app-motion-spring-gentle), var(--pm-morph); }
    .pp-field.menu-open .pp-arrow { transform: rotate(180deg); }
    .pp-menu { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; max-height: 312px; overflow-y: auto; overscroll-behavior: contain; padding: 4px;
      background: rgb(var(--md-sys-color-surface-container)); border-radius: var(--md-sys-shape-corner-large); box-shadow: var(--md-sys-elevation-level2);
      transform-origin: top center; opacity: 0; transform: scaleY(0.85); visibility: hidden;
      transition: opacity var(--md-sys-motion-duration-short3) linear, transform var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-emphasized-decelerate), visibility 0s linear var(--md-sys-motion-duration-short4); }

    .pp-mh { font: var(--md-sys-typescale-label-medium); letter-spacing: 0.5px; color: rgb(var(--md-sys-color-on-surface-variant)); padding: 10px 12px 4px; }
